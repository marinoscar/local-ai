schema_version: 1
id: ark-drive-full
display_name: "Portable ark drive (everything)"
router:
  models_max: 1
  memory_margin_mib: 512
  autoload: false
storage:
  target: ark_drive
  budget_bytes: 2000000000000
  min_free_bytes: 50000000000
include:
  models: [model-alpha-9b-q4, model-beta-27b-q4, model-gamma-vl-q4, model-delta-embed, whisper-small, piper-en-medium]
  content: [wiki-alpha-en, wiki-alpha-es, medical-alpha-en, map-region-alpha, map-assets, places-region-alpha, kit-ubuntu-iso-26.04, kit-tool-bundle, kit-llama-cpp, kit-debs-resolute-amd64, kit-nvidia-resolute-amd64-595-open, docs-bundle]
default_model: model-alpha-9b-q4
survival:
  models: [model-alpha-9b-q4]
  default_model: model-alpha-9b-q4
  portal_language: auto
