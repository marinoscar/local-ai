<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local AI: {{.Message}}</title>
<style>
:root { color-scheme: light dark; }
body { margin: 0; padding: 1.5rem; font: 1.25rem/1.5 system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: #f6f7f9; color: #14181f; }
main { max-width: 38rem; margin: 3rem auto; padding: 1.5rem 2rem; background: #fff; border: 2px solid #c8ced8; border-radius: 0.75rem; }
h1 { margin: 0 0 1rem; font-size: 1.75rem; line-height: 1.25; }
.fix { margin: 0 0 1.25rem; }
.meta { margin: 1.25rem 0 0; font-size: 1rem; color: #4a5260; }
code { font: 1em ui-monospace, Menlo, Consolas, monospace; padding: 0.1rem 0.35rem; background: #eceff4; border-radius: 0.25rem; }
ul { list-style: none; margin: 1.25rem 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 0.75rem; }
a { display: inline-block; padding: 0.6rem 1.1rem; border-radius: 0.5rem; background: #0b57d0; color: #fff; text-decoration: none; font-weight: 600; }
a:focus-visible { outline: 3px solid #ffb300; outline-offset: 2px; }
@media (prefers-color-scheme: dark) {
  body { background: #101318; color: #eceff4; }
  main { background: #1a1f27; border-color: #3a4250; }
  .meta { color: #aab2c0; }
  code { background: #2a303b; }
  a { background: #8ab4f8; color: #0b1a33; }
}
</style>
</head>
<body>
<main>
<h1>{{.Message}}</h1>
<p class="fix"><strong>What to do:</strong> {{.Fix}}</p>
{{- if .Links}}
<ul>
{{- range .Links}}
<li><a href="{{.Href}}">{{.Label}}</a></li>
{{- end}}
</ul>
{{- end}}
<p class="meta">Error code <code>{{.Code}}</code>{{if .RequestID}} &middot; request <code>{{.RequestID}}</code>{{end}} &middot; status {{.Status}}</p>
</main>
</body>
</html>
