schema_version: 1
id: small-8gb
display_name: "Small GPU laptop (8 GB VRAM)"
match:
  backends: [cuda]
  vram_mib: {min: 7000, max: 11999}
  ram_mib: {min: 12000}
router:
  models_max: 1
  memory_margin_mib: 512
  autoload: false
storage:
  target: internal
  budget_bytes: 220000000000
  min_free_bytes: 25000000000
include:
  models: [model-alpha-9b-q4, model-gamma-vl-q4, model-delta-embed, whisper-small, piper-en-medium]
  content: [wiki-alpha-en, map-region-alpha, kit-catalog, kit-llama-cpp, kit-whisper-cpp, kit-agent-binaries, kit-agent-source, kit-go-toolchain, kit-kiwix-tools, kit-pmtiles, kit-piper, kit-debs-resolute-amd64, kit-nvidia-resolute-amd64-595-open, kit-desktop, docs-bundle]
default_model: model-alpha-9b-q4
survival:
  models: [model-alpha-9b-q4, model-gamma-vl-q4]
  default_model: model-alpha-9b-q4
  require_services: [kiwix, whisper]
  portal_language: auto
