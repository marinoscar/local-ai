        only: {type: array, items: {type: string}, description: "Check ids."}
        trigger: {type: string, enum: [manual, scheduled], default: manual}

    DrillAccepted:
      type: object
      required: [run_id]
      additionalProperties: false
      properties:
        run_id: {type: string, pattern: "^drl-"}

    DrillResults:
      description: "The results document, owned by drill.md section 3.4."
      type: object
      required: [schema_version, run_id, trigger, started_at, overall]
      additionalProperties: true
      properties:
        schema_version: {type: integer}
        run_id: {type: string, pattern: "^drl-"}
        trigger: {type: string}
        started_at: {type: string, format: date-time}
        finished_at: {type: [string, "null"], format: date-time}
        overall: {type: string, enum: [pass, warn, fail, aborted]}
        survival_ready: {type: boolean}
        checks: {type: array, items: {type: object, additionalProperties: true}}

    DrillManualRequest:
      type: object
      required: [result]
      additionalProperties: false
      properties:
        result: {type: string, enum: [pass, fail]}
