        docs:
          type: array
          items:
            type: object
            required: [slug, title, html]
            additionalProperties: false
            properties:
              slug: {type: string}
              title: {type: string}
              title_es: {type: string}
              html: {type: string}
              pdf: {type: string}

    Profile:
      description: "GET and PUT /profile (agent.md section 3.8.30)."
      type: object
      required: [profile, display_name, overrides, suggested, match_reasons, effective]
      additionalProperties: false
      properties:
        profile: {type: string}
        display_name: {type: string}
        overrides:
          description: "node.yaml profile_overrides, with empty lists instead of null."
          type: object
          additionalProperties: true
          properties:
            add_models: {type: array, items: {type: string}}
            remove_models: {type: array, items: {type: string}}
            add_content: {type: array, items: {type: string}}
            remove_content: {type: array, items: {type: string}}
            budget_bytes: {type: [integer, "null"], minimum: 1}
        suggested: {type: [string, "null"], description: "The profile the hardware matches; null only when the catalog has no profile that fits (not even cpu-only)."}
        match_reasons: {type: array, items: {type: string}}
        effective:
          description: "What the plan keeps after the budget (catalog.md section 4); never filtered by hardware fit."
          type: object
          required: [models, content, planned_bytes, budget_bytes]
          additionalProperties: false
          properties:
            models: {type: array, items: {type: string}}
            content: {type: array, items: {type: string}}
            skipped:
              description: "What the budget dropped, in the order it was dropped; this agent always sends it (an empty list when nothing was dropped)."
              type: array
              items:
                type: object
                required: [kind, id, reason, size_bytes]
                additionalProperties: false
                properties:
                  kind: {type: string, enum: [model, content]}
                  id: {type: string}
                  reason: {type: string, enum: [budget]}
                  size_bytes: {type: integer, minimum: 0}
            planned_bytes: {type: integer, minimum: 0}
            budget_bytes: {type: integer, minimum: 0}
        warnings:
          description: "PUT only, present when the router reload had a problem. node.yaml is already written; the next reload retries."
          type: array
          items:
            type: object
            required: [code, message]
            additionalProperties: false
            properties:
              code: {type: string, pattern: "^LAI-[A-Z]{2,3}-[0-9]{3}$"}
              message: {type: string}

    ProfileRequest:
