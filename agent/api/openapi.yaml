openapi: 3.1.0
info:
  title: Local AI node agent API
  version: 1.0.0
  summary: The wire contract of the aiagent REST API (agent.md section 3.8).
  description: |
    Hand-written, and the contract: the local UI, the Survival Portal, ai-desktop and the cloud generate
    their TypeScript types from this file, and `internal/api/openapi_test.go` fails when a route, an auth
    level or a field exists on one side only. Workflow: docs/specs/agent.md section 4.14. A change to any
    `/api/v1` route edits the spec and this file in the same PR.

    Conventions (agent.md section 3.7):
    - Same routes on TCP `127.0.0.1:<ports.agent>` and on the unix socket `/run/localai/agent.sock`.
    - Bodies are `application/json; charset=utf-8`, except SSE (`text/event-stream`), the STT upload
      (`multipart/form-data`) and TTS (`audio/wav`).
    - A mutating request (every method except GET) must send `Content-Type: application/json`, even with
      an empty body `{}`, else `415 LAI-AGT-020`. The body limit is 1 MiB (STT 25 MiB), else `413 LAI-AGT-025`.
      Decoding is strict: an unknown field is `400 LAI-AGT-020` with `details.field`.
    - Times are RFC 3339 UTC with `Z` (`format: date-time`). Sizes are integer bytes. Durations are integers
      with an `_ms` or `_s` suffix.
    - Every response carries `X-Request-Id`. A mutating response carries `X-LocalAI-Op-Id` when an
      operation was created. `Retry-After` is set on 429 and on the 503 `LAI-AGT-024`.
    - Every non-2xx response is an `ErrorEnvelope`. `OPTIONS` is answered `405` and no `Access-Control-*`
      header is ever sent. A `405` also lists the allowed methods in `Allow` and `details.allow`.
    - `Accept-Language: es` localizes `message` and `fix`; codes and field names never change.
    - Repeating a request whose effect is already in place answers `200` with a flag (`already_loaded`),
      not an error.

    Extensions:
    - `x-localai-auth`: the level an operation requires: `none`, `op`, `portal`, `admin` or `admin*`; a list
      when several principals are accepted (`[op, portal]`). One of them is enough. Must equal the route's
      auth in `api.Routes()`.
    - `x-localai-auth-note`: free text for a restriction the level cannot express.
    - `x-localai-timeout`: the server-side handler deadline (agent.md section 3.8 column "Timeout"), informational.
    - `x-localai-status: planned`: documented, not implemented yet. It lands in the issue named by
      `x-localai-issue`, whose PR removes both extensions. A planned operation must not be registered, and a
      registered operation must not be planned (this is the allowlist the bijection test uses).
    - `x-localai-gate-exempt: true`: the mutating-route gate does not hold the route back (POST /mode/survival).
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
    description: Same origin on TCP 127.0.0.1:<ports.agent> (default 7070) and on unix:/run/localai/agent.sock.
tags:
  - {name: health, description: "Liveness."}
  - {name: auth, description: "Sessions, UI codes and the admin PIN."}
  - {name: status, description: "Node snapshot, hardware, doctor, logs and events."}
  - {name: models, description: "Models and the llama router."}
  - {name: key, description: "The llama API key."}
  - {name: mode, description: "Online, offline and survival modes."}
  - {name: ark, description: "Content roots, drives and sync (owned by ark-sync.md)."}
  - {name: catalog, description: "The catalog and the profile."}
  - {name: services, description: "Companion services and speech."}
  - {name: cloud, description: "The cloud link."}
  - {name: drill, description: "The offline-readiness drill (owned by drill.md)."}
  - {name: docs, description: "The rendered manuals index."}

paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness
      description: |
        No auth. Never touches upstreams. `ok` is true whenever the agent answers; a damaged state is
        reported as an alert, not here. `starting` stays true until startup step 17 (mutations open after
        step 12). The status is always 200. agent.md section 3.8.1.
      x-localai-auth: none
      x-localai-timeout: "2 s"
      responses:
        "200":
          description: The agent is alive.
          headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Health"}
              examples:
                online: {value: {ok: true, version: "0.1.0", mode: online, starting: false}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/Internal"}

  /session:
    post:
      tags: [auth]
      operationId: createSession
      summary: Exchange the agent token for a session cookie
      description: "Header `Authorization: Bearer lat_...`, body `{}`. Sets the cookie `localai_session` (HttpOnly, SameSite=Strict, 7 days). agent.md section 3.8.2."
      x-localai-auth: op
      x-localai-auth-note: Bearer token only; a cookie or Portal session cannot mint a session.
      x-localai-timeout: "5 s"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EmptyRequest"}
      responses:
        "204": {$ref: "#/components/responses/SessionCookie"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}
    delete:
      tags: [auth]
      operationId: deleteSession
      summary: End the session
      description: Answers 204 and clears the cookie (`Set-Cookie`, `Max-Age=0`). agent.md section 3.8.2.
      x-localai-auth: op
      x-localai-auth-note: Session cookie.
      x-localai-timeout: "5 s"
      responses:
        "204":
          description: The session ended.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
            Set-Cookie: {description: "localai_session= with Max-Age=0.", schema: {type: string}}
            Cache-Control: {description: "no-store.", schema: {type: string, enum: [no-store]}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}

  /session/code:
    post:
      tags: [auth]
      operationId: createSessionFromCode
      summary: Exchange a one-time UI code for a session cookie
      description: The code comes from `POST /ui-code`. Single use, 5 minutes. agent.md section 3.8.2.
      x-localai-auth: none
      x-localai-timeout: "5 s"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SessionCodeRequest"}
            examples:
              code: {value: {code: "482913"}}
      responses:
        "204": {$ref: "#/components/responses/SessionCookie"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401":
          $ref: "#/components/responses/Unauthenticated"
          description: "LAI-SEC-008: the code is wrong, expired or already used."
        "403": {$ref: "#/components/responses/Forbidden"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "429":
          $ref: "#/components/responses/RateLimited"
          description: "LAI-SEC-004: 5 failures in 5 minutes (global, not per client)."
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}

  /ui-code:
    post:
      tags: [auth]
      operationId: createUiCode
      summary: Mint a one-time UI code
      description: At most 3 unexpired codes exist; minting a 4th invalidates the oldest. Audit event `ui_code.mint`. agent.md section 3.8.2.
      x-localai-auth: "admin*"
      x-localai-timeout: "5 s"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EmptyRequest"}
      responses:
        "200":
          description: The code.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
            Cache-Control: {description: "no-store: the body carries a credential.", schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UiCode"}
              examples:
                code: {value: {code: "482913", expires_at: "2026-11-02T15:09:05Z"}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}

  /pin/verify:
    post:
      tags: [auth]
      operationId: verifyPin
      summary: Verify the admin PIN and get a grant
      description: |
        The grant is bound to the principal that obtained it and is sent as `X-LocalAI-Pin-Grant` on admin
        routes; it lasts 5 minutes. Audit events `pin.verify.ok` and `pin.verify.fail`. agent.md section 3.8.3.
      x-localai-auth: op
      x-localai-timeout: "5 s"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PinVerifyRequest"}
            examples:
              pin: {value: {pin: "4821"}}
      responses:
        "200":
          description: The grant.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
            Cache-Control: {description: "no-store: the body carries a credential.", schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PinGrant"}
              examples:
                grant: {value: {grant: "pg_0123456789abcdefghijklmnopqrstuvwxyzABCDEFG", expires_at: "2026-11-02T15:09:05Z"}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401":
          $ref: "#/components/responses/Unauthenticated"
          description: "LAI-SEC-001 missing credentials; LAI-SEC-003 wrong PIN (details.remaining_attempts)."
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          $ref: "#/components/responses/Conflict"
          description: "LAI-SEC-005: no PIN is set (fix: sudo aictl pin set)."
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "429":
          $ref: "#/components/responses/RateLimited"
          description: "LAI-SEC-004: too many wrong PINs; Retry-After in seconds."
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}

  /status:
    get:
      tags: [status]
      operationId: getStatus
      summary: The full node snapshot
      description: |
        Also the body pushed to the cloud (agent.md section 4.8.4), minus `alerts[].details` and
        `hardware.gpus[].processes`. Built from cached values only, so it answers within the deadline even when
        the router or Tailscale hang; a subsystem that is not available has its documented empty state (empty
        lists, `null`), never an error. Alert titles and fixes follow `Accept-Language` or `ui.language`.
        agent.md section 3.8.4.
      x-localai-auth: op
      x-localai-timeout: "5 s"
      parameters:
        - name: counters
          in: query
          description: "1 adds `node.counters` (agent.md section 7); 0 or absent leaves it out. Any other value is 400."
          schema: {type: string, enum: ["0", "1"]}
      responses:
        "200":
          description: The snapshot.
          headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Status"}
              examples:
                snapshot:
                  value:
                    node: {id: ai-n3, display_name: "HP ZBook (ai-n3)", hostname: hp-linux, profile: small-8gb, agent_version: "0.1.0", backend: cuda, llama_mode: router, llama_build: "f3586e66b-cuda", catalog_version: "2026.11.02-1", uptime_s: 86400, time: "2026-11-02T15:04:05Z"}
                    mode: {value: online, since: "2026-11-01T22:10:00Z", transition: null}
                    connectivity: {value: full, checked_at: "2026-11-02T15:04:00Z", none_since: null}
                    hardware: {gpu: "NVIDIA GeForce RTX 2070 with Max-Q Design", vram_total_mib: 8192, vram_used_mib: 6791, ram_total_mib: 14336, ram_available_mib: 5120, gpu_temp_c: 61, cpu_temp_c: 72, power: {source: ac, battery_percent: 100, charging: false, time_remaining_s: null, profile: performance}, gpus: [{index: 0, vendor: nvidia, name: "NVIDIA GeForce RTX 2070 with Max-Q Design", vram_total_mib: 8192, vram_used_mib: 6791, temp_c: 61, util_pct: 0, throttling: [], processes: [{pid: 4242, name: llama-server, vram_mib: 6581}]}]}
                    services:
                      - {name: llama, unit: "localai-llama.service", active: active, sub: running, since: "2026-11-02T08:00:05Z", restarts: 0, healthy: true}
                      - {name: whisper, unit: "localai-whisper.service", active: inactive, sub: dead, since: null, restarts: 0, healthy: false}
                    models: {default: qwen3.5-9b-q4km, loaded: [qwen3.5-9b-q4km], loading: [], present: 5, loadable: 4, models_max: 1}
                    ark:
                      roots: [{path: /srv/localai, kind: internal, status: partial, ready_pct: 82, updated_at: "2026-11-02T03:12:00Z"}]
                      drive: {mounted: false}
                      sync: {state: idle, last_success_at: "2026-11-02T03:12:00Z"}
                    cloud: {enrolled: true, state: linked, url: "https://ai.marin.cr", last_heartbeat_at: "2026-11-02T15:03:55Z"}
                    tailscale: {manage: true, pattern: B, applied: true, backend_state: Running}
                    alerts:
                      - {code: LAI-HW-012, severity: warning, title: "Running on battery", fix: "Plug in the charger. A laptop server stops when the battery runs out.", since: "2026-11-02T08:00:30Z", details: {battery_percent: 64}}
        "400":
          $ref: "#/components/responses/InvalidRequest"
          description: "LAI-AGT-020: counters is not 0 or 1 (details.field is counters)."
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/Internal"}

  /portal/status:
    get:
      tags: [status]
      operationId: getPortalStatus
      summary: The reduced, localized status of the Survival Portal
      description: |
        No auth. The schema and example are owned by survival-portal.md section 3.5 (AGENT-14 provides the
        route, the 2 s cache and a minimal builder; PORTAL-01 the full schema). It never contains paths, keys,
        hostnames, ids beyond model ids, or cloud details. Cached for 2 s per language and session kind.
        The language is `?lang=`, else `portal.language` (when `en` or `es`), else the profile's
        `survival.portal_language`, else `Accept-Language` or `ui.language`. `session` tells the SPA what it may
        call: `none`, `portal` (a Portal session cookie) or `full` (an operator or admin credential).
        agent.md section 3.8.5.
      x-localai-auth: none
      x-localai-timeout: "5 s"
      parameters:
        - name: lang
          in: query
          description: "en or es overrides the resolved language. Any other value is 400."
          schema: {type: string, enum: [en, es]}
      responses:
        "200":
          description: The Portal status.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            Cache-Control: {description: "no-store: the body is rebuilt at most every 2 s and must not be kept by a cache.", schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PortalStatus"}
              examples:
                survival:
                  value:
                    schema_version: 1
                    generated_at: "2026-11-02T14:05:11Z"
                    node_id: ai-n3
                    mode: survival
                    language: es
                    emergency_number: "911"
                    session: portal
                    power: {on_ac: false, battery_pct: 72, minutes_left: 145, state: discharging, low: false, critical: false}
                    clock_ok: true
                    brain:
                      loaded: [{id: qwen3.5-9b-q4km, display_name: "Qwen 3.5 9B", roles: [chat, reasoning, coder], vision: false}]
                      loading: null
                      choices: []
                    capabilities: {chat: {state: ready}}
                    first_aid: []
                    alerts: [{code: LAI-SVC-013, severity: info, title: "El reconocimiento de voz usa el procesador.", fix: "Nada que hacer."}]
        "400":
          $ref: "#/components/responses/InvalidRequest"
          description: "LAI-AGT-020: lang is not en or es (details.field is lang)."
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/Internal"}

  /hardware:
    get:
      tags: [status]
      operationId: getHardware
      summary: Hardware sample
      description: GPU UUIDs and serial numbers are never collected. agent.md section 3.8.6.
      x-localai-auth: op
      x-localai-timeout: "10 s"
      parameters:
        - name: fresh
          in: query
          description: "1 forces a new sample, at most one per 2 s across all clients (a request inside the window gets the previous forced sample, never an error); 0 or absent answers the cached snapshot. Any other value is 400. API clients only."
          schema: {type: string, enum: ["0", "1"]}
      responses:
        "400":
          $ref: "#/components/responses/InvalidRequest"
          description: "LAI-AGT-020: fresh is not 0 or 1 (details.field is fresh)."

        "200":
          description: The sample.
          headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Hardware"}
              examples:
                nvidia:
                  value:
                    sampled_at: "2026-11-02T15:04:00Z"
                    gpus:
                      - {index: 0, vendor: nvidia, name: "NVIDIA GeForce RTX 2070 with Max-Q Design", backend: cuda, compute_cap: "7.5", driver: "595.99.02", unified_memory: false, vram_total_mib: 8192, vram_used_mib: 6791, vram_used_by_others_mib: 210, temp_c: 61, util_pct: 0, power_w: 1.46, throttling: [], processes: [{pid: 4242, name: llama-server, vram_mib: 6581}]}
                    ram: {total_mib: 14336, available_mib: 5120, swap_total_mib: 4096, swap_free_mib: 4000}
                    disks:
                      - {path: /srv/localai, role: internal_root, fs: ext4, total_bytes: 342000000000, free_bytes: 293000000000}
                      - {path: /var/lib/localai, role: state, fs: ext4, total_bytes: 342000000000, free_bytes: 293000000000}
                    power: {source: ac, battery_percent: 100, charging: false, time_remaining_s: null, profile: performance}
                    thermal: {cpu_temp_c: 72, cpu_throttle_events: 0, zones: [{type: x86_pkg_temp, temp_c: 72}]}
                    cpu: {model: "Intel(R) Core(TM) i7-10850H CPU @ 2.70GHz", cores: 12, load1: 0.4}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/Internal"}

  /models:
    get:
      tags: [models]
      operationId: listModels
      summary: Catalog models merged with local state
      description: "All engines. `?loadable=1` keeps `loadable: true`; `?engine=llama` filters by engine. agent.md section 3.8.7."
      x-localai-auth: op
      x-localai-timeout: "5 s"
      x-localai-status: planned
      x-localai-issue: AGENT-15
      parameters:
        - {name: loadable, in: query, schema: {type: string, enum: ["1"]}, description: "1 keeps the models with loadable true."}
        - {name: engine, in: query, schema: {type: string}, description: "For example llama."}
      responses:
        "200":
          description: The models.
          headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ModelList"}
              examples:
                two:
                  value:
                    models_max: 1
                    default: qwen3.5-9b-q4km
                    models:
                      - {id: qwen3.5-9b-q4km, display_name: "Qwen 3.5 9B", summary: "Fast general assistant", engine: llama, roles: [chat, reasoning, coder], survival_tier: 1, in_profile: true, size_bytes: 5868826976, present: true, verified: true, locations: [{root: /srv/localai, complete: true, verified_at: "2026-11-02T03:10:00Z"}], loadable: true, loadable_reason: null, status: loaded, loaded: true, default: true, aliases: [qwen3.5-9b], requirements: {backends: [cuda, vulkan, cpu], min_vram_mib: 6400, min_ram_mib: 8192}, last_load_ms: 7100}
                      - {id: qwen3.6-35b-a3b-q4km, display_name: "Qwen 3.6 35B A3B", engine: llama, in_profile: false, present: false, verified: false, locations: [], loadable: false, loadable_reason: {code: LAI-CAT-005, message: "Needs 11.0 GB of graphics memory; this computer has 8.0 GB."}, status: absent, loaded: false, default: false, aliases: []}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/Internal"}

  /models/default:
    put:
      tags: [models]
      operationId: setDefaultModel
      summary: Set the default model
      description: |
        The model must be `present` and `loadable` (422 otherwise). Sets `state.models.default`, regenerates
        `models.ini` (`load-on-startup`) and tells the router under the reload-safety rule, so a running
        model whose preset did not change stays loaded; it never loads or unloads a model. `previous` is
        the default in force before (the recorded one, else the profile's), `null` when there was none.
        `ini_regenerated` is false when the file already said this. llama-router.md section 4.6.
        agent.md section 3.8.10. Audit `model.set_default`.
      x-localai-auth: op
      x-localai-timeout: "5 s"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DefaultModelRequest"}
            examples:
              default: {value: {id: qwen3.5-9b-q4km}}
      responses:
        "200":
          description: The new default.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DefaultModelResponse"}
              examples:
                changed: {value: {default: qwen3.5-9b-q4km, previous: small-vlm-q4km, ini_regenerated: true}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422":
          $ref: "#/components/responses/Unprocessable"
          description: "LAI-CAT-005 the model does not fit, or the engine is not llama; LAI-LLM-008 its files are missing or unverified."
        "500":
          $ref: "#/components/responses/Internal"
          description: "LAI-LLM-007 the model list could not be written, so the default was not changed; LAI-AGT-099 a bug."
        "503": {$ref: "#/components/responses/Starting"}
        "504":
          $ref: "#/components/responses/GatewayTimeout"
          description: "LAI-AGT-099 with details.reason deadline_exceeded: the handler ran past its 5 s deadline."

  /models/{id}:
    parameters:
      - {$ref: "#/components/parameters/ModelId"}
    get:
      tags: [models]
      operationId: getModel
      summary: One model, with its files and router preset
      description: Like a `GET /models` entry plus `files` and `preset`. An unknown id is `404 LAI-AGT-021`. agent.md section 3.8.7.
      x-localai-auth: op
      x-localai-timeout: "5 s"
      x-localai-status: planned
      x-localai-issue: AGENT-15
      responses:
        "200":
          description: The model.
          headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Model"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/Internal"}
    delete:
      tags: [models]
      operationId: deleteModel
      summary: Delete a model's files
      description: |
        Query `root` (default all roots) and `keep_last` (default true). A loaded model is refused
        (409 LAI-AGT-022, "Unload it first"). With `keep_last=true` it refuses to remove the last verified copy
        across all mounted roots (409, code defined by ark-sync.md section 4.10). Audit `model.delete`.
        agent.md section 3.8.12.
      x-localai-auth: admin
      x-localai-timeout: "60 s"
      x-localai-status: planned
      x-localai-issue: AGENT-15
      parameters:
        - {name: root, in: query, schema: {type: string}, description: "A content root path or root id."}
        - {name: keep_last, in: query, schema: {type: boolean, default: true}}
      responses:
        "200":
          description: What was deleted.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DeleteModelResponse"}
              examples:
                deleted: {value: {id: qwen3.5-9b-q4km, deleted: [{root: /srv/localai, bytes: 5868826976}], op_id: op_7k2m9q4r8t1c}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          $ref: "#/components/responses/Conflict"
          description: "LAI-AGT-022 the model is loaded; the last verified copy would be removed (code from ark-sync.md section 4.10)."
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}

  /models/{id}/load:
    parameters:
      - {$ref: "#/components/parameters/ModelId"}
    post:
      tags: [models]
      operationId: loadModel
      summary: Load a model
      description: |
        Orchestration: llama-router.md section 4.4. The body is optional; `wait` and `unload_others` default
        to true. With `wait: false` it answers 202 as soon as the load is planned and progress arrives on
        `/events` (`model.loading`, `model.loaded`, `model.failed`, with the same `op_id`). A Portal session
        may only load `loadable` models and its body is forced to `wait: false` with the planner deciding
        what to unload (survival-portal.md section 3.3). A failed load is rolled back to the previous
        models (`details.rolled_back`, `details.restored`). `warning` is present when the load went ahead
        although other programs hold much of the memory (LAI-HW-005, LAI-HW-006). Audit `model.load`.
        agent.md section 3.8.8.
      x-localai-auth: [op, portal]
      x-localai-auth-note: "Portal: restricted to loadable models, body forced (survival-portal.md section 3.3)."
      x-localai-timeout: "load_timeout x (n+2) + 30 s"
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoadRequest"}
            examples:
              defaults: {value: {wait: true, unload_others: true}}
      responses:
        "200":
          description: Loaded (or already loaded).
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ModelLoaded"}
              examples:
                loaded: {value: {id: qwen3.5-9b-q4km, status: loaded, already_loaded: false, load_ms: 7100, unloaded: [small-vlm-q4km], op_id: op_7k2m9q4r8t1c}}
        "202":
          description: "Loading started (`wait: false`)."
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ModelLoading"}
              examples:
                loading: {value: {id: qwen3.5-9b-q4km, status: loading, op_id: op_7k2m9q4r8t1c}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          $ref: "#/components/responses/Conflict"
          description: "LAI-AGT-022 another model operation is running (details.op_id); LAI-LLM-011 unload_others is false and there is no room."
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422":
          $ref: "#/components/responses/Unprocessable"
          description: "LAI-CAT-005 does not fit, backend unsupported, or the engine is not llama; LAI-LLM-008 files missing or unverified."
        "500":
          $ref: "#/components/responses/Internal"
          description: "LAI-LLM-009 the load failed and the previous model was restored (details.rolled_back, details.restored, details.cause, details.exit_code); LAI-LLM-012 no model could be loaded, not even the previous one; LAI-LLM-007 the router does not list the model; LAI-AGT-099 a bug."
        "502":
          $ref: "#/components/responses/BadGateway"
          description: "LAI-LLM-004: the router is running but not answering; LAI-LLM-005: it rejects this node's key."
        "503": {$ref: "#/components/responses/Starting"}
        "504":
          $ref: "#/components/responses/GatewayTimeout"
          description: "LAI-LLM-010: the load timed out and the previous model was restored."

  /models/{id}/unload:
    parameters:
      - {$ref: "#/components/parameters/ModelId"}
    post:
      tags: [models]
      operationId: unloadModel
      summary: Unload a model
      description: |
        Unloading the default model is allowed. In survival mode, unloading the last loaded LLM answers
        `409 LAI-AGT-023` unless `force` is true. A model that is not running answers `already_unloaded`.
        If the router still reports the model running after 60 s, llama is restarted, the other models
        are loaded again and LAI-LLM-031 is raised; the answer is then 200 with `restarted` and
        `restored`. llama-router.md section 4.5. Audit `model.unload`. agent.md section 3.8.9.
      x-localai-auth: op
      x-localai-timeout: "90 s"
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UnloadRequest"}
      responses:
        "200":
          description: Unloaded (or already unloaded).
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ModelUnloaded"}
              examples:
                unloaded: {value: {id: qwen3.5-9b-q4km, status: unloaded, already_unloaded: false, op_id: op_7k2m9q4r8t1c}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          $ref: "#/components/responses/Conflict"
          description: "LAI-AGT-022 another model operation is running (details.op_id); LAI-AGT-023 survival mode and this is the last loaded LLM (send force)."
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422":
          $ref: "#/components/responses/Unprocessable"
          description: "LAI-CAT-005 the model is not a llama model."
        "500":
          $ref: "#/components/responses/Internal"
          description: "LAI-LLM-012 the model would not stop, llama was restarted and no model could be loaded afterwards; LAI-AGT-099 a bug."
        "502":
          $ref: "#/components/responses/BadGateway"
          description: "LAI-LLM-004: the router is running but not answering, or the model would not stop and llama could not be restarted; LAI-LLM-005: it rejects this node's key."
        "503": {$ref: "#/components/responses/Starting"}
        "504":
          $ref: "#/components/responses/GatewayTimeout"
          description: "LAI-LLM-031: the model would not stop in time."

  /models/{id}/download:
    parameters:
      - {$ref: "#/components/parameters/ModelId"}
    post:
      tags: [models]
      operationId: downloadModel
      summary: Queue a model download through the sync engine
      description: |
        Delegates to the sync engine with `items: [id]` (ark-sync.md). Default roots: the internal root, plus
        the drive if its profile includes the model. agent.md section 3.8.11.
      x-localai-auth: op
      x-localai-timeout: "10 s"
      x-localai-status: planned
      x-localai-issue: AGENT-15
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DownloadRequest"}
      responses:
        "202":
          description: Queued.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DownloadAccepted"}
              examples:
                queued: {value: {id: qwen3.5-9b-q4km, sync_run_id: "run-20261102T031500Z-a1f3", queued: true}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          $ref: "#/components/responses/Conflict"
          description: "LAI-SYN-010 survival mode; LAI-AGT-023 offline mode without allow_offline_mode; LAI-SYN-005 a run is already active."
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}

  /key:
    get:
      tags: [key]
      operationId: getKey
      summary: The llama API key
      description: |
        The only route that returns the full llama key. Writes audit `key.show` with the principal.
        `Cache-Control: no-store`. Snippets embed `$KEY` placeholders, never the key. agent.md section 3.8.13.
        There is deliberately no example: a 64-hex key literal in the repository trips scripts/check-redaction.sh.
      x-localai-auth: op
      x-localai-timeout: "5 s"
      x-localai-status: planned
      x-localai-issue: AGENT-15
      responses:
        "200":
          description: The key and how to use it.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            Cache-Control: {description: "no-store.", schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Key"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/Internal"}

  /key/rotate:
    post:
      tags: [key]
      operationId: rotateKey
      summary: Rotate the llama API key
      description: |
        Generates a new key, writes `/etc/localai/api-key` atomically, restarts llama (unless `restart` is
        false), restores `models.desired_loaded` and pushes the key to the cloud. If the llama restart
        fails the new key stays and the answer is `500 LAI-LLM-001` with `details.key_rotated: true`.
        Audit `key.rotate`. agent.md section 3.8.14.
      x-localai-auth: admin
      x-localai-timeout: "15 min"
      x-localai-status: planned
      x-localai-issue: AGENT-15
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/KeyRotateRequest"}
      responses:
        "200":
          description: Rotated.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KeyRotated"}
              examples:
                rotated:
                  value:
                    fingerprint: "c0de...77aa"
                    rotated_at: "2026-11-02T15:10:00Z"
                    cloud_synced: true
                    restored_models: [qwen3.5-9b-q4km]
                    clients_to_update: ["OpenCode on this computer: ~/.config/opencode/llama-api-key", "Any script that uses the old key directly"]
                    op_id: op_7k2m9q4r8t1c
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "500":
          $ref: "#/components/responses/Internal"
          description: "LAI-LLM-001: the llama restart failed; the new key stays (details.key_rotated is true). LAI-AGT-099: a bug."
        "503": {$ref: "#/components/responses/Starting"}

  /mode:
    get:
      tags: [mode]
      operationId: getMode
      summary: The current mode
      description: agent.md section 3.8.15.
      x-localai-auth: op
      x-localai-timeout: "5 s"
      responses:
        "200":
          description: The mode.
          headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Mode"}
              examples:
                online: {value: {mode: online, since: "2026-11-01T22:10:00Z", transition: null, allowed_targets: [offline, survival], leave_requires_admin: false, connectivity: full, suggest_survival: false}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/Internal"}
    post:
      tags: [mode]
      operationId: setMode
      summary: Request a mode transition
      description: |
        `reapply: true` re-runs every step of the current mode's transition even when `target` equals the
        current mode; without it a same-target request answers `200 {already: true}`. Cloud principals may only
        request `offline`. agent.md section 3.8.15.
      x-localai-auth: op
      x-localai-auth-note: "admin* is required to leave survival (LAI-SEC-002)."
      x-localai-timeout: "20 min if wait, else 5 s"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ModeRequest"}
            examples:
              offline: {value: {target: offline, wait: false, reapply: false}}
      responses:
        "200":
          description: "Done (`wait: true`), or already in the target mode."
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: "#/components/schemas/ModeDone"}
                  - {$ref: "#/components/schemas/ModeAlready"}
              examples:
                done: {value: {op_id: op_7k2m9q4r8t1c, from: online, mode: offline, warnings: []}}
                already: {value: {mode: offline, already: true}}
        "202":
          description: The transition started.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ModeAccepted"}
              examples:
                started: {value: {op_id: op_7k2m9q4r8t1c, from: online, target: offline, transition: {step: link_stop, started_at: "2026-11-02T15:04:05Z"}}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403":
          $ref: "#/components/responses/Forbidden"
          description: "LAI-SEC-002: leaving survival needs admin*; plus the generic 403 codes."
        "409":
          $ref: "#/components/responses/Conflict"
          description: "LAI-AGT-022 another transition is running (a request for survival preempts it); with `wait: true`, also the answer to a transition that survival preempted (`details.preempted` is true, `details.op_id` is the survival operation)."
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}

  /mode/survival:
    post:
      tags: [mode]
