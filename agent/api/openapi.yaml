        name: {type: [string, "null"]}
        since: {type: [string, "null"], format: date-time}
        last_heartbeat_at: {type: [string, "null"], format: date-time}
        last_claim_at: {type: [string, "null"], format: date-time}
        last_error: {type: [string, "null"]}
        credential: {type: [string, "null"], description: "The credential, masked."}
        eligible_types: {type: array, items: {type: string}}
        server_features: {type: array, items: {type: string}}
        state_transport: {type: string, enum: [endpoint, capabilities]}
        inflight: {type: [object, "null"], additionalProperties: true}
        key_synced: {type: boolean}

    CloudEnrollRequest:
      type: object
      required: [url, credential]
      additionalProperties: false
      properties:
        url: {type: string}
        credential: {type: string, description: "A nod_ credential."}

    CloudEnrolled:
      type: object
      required: [state]
      additionalProperties: false
      properties:
        state: {type: string, enum: [linked, backoff, stopped]}
        server_node_id: {type: string}
        reattached: {type: boolean}
        last_error: {type: string}

    CloudUnenrolled:
      type: object
      required: [enrolled]
      additionalProperties: false
      properties:
        enrolled: {type: boolean, enum: [false]}

    ResendKeyResult:
      type: object
      required: [key_synced, fingerprint]
      additionalProperties: false
      properties:
        key_synced: {type: boolean}
        fingerprint: {type: string}

    DoctorReport:
      description: "GET /doctor (agent.md section 3.8.27)."
      type: object
      required: [ran_at, duration_ms, summary, results, passed]
      additionalProperties: false
      properties:
        ran_at: {type: string, format: date-time}
        duration_ms: {type: integer, minimum: 0}
        summary:
          type: object
          required: [ok, info, warning, error, critical]
          additionalProperties: false
          properties:
            ok: {type: integer, minimum: 0}
            info: {type: integer, minimum: 0}
            warning: {type: integer, minimum: 0}
            error: {type: integer, minimum: 0}
            critical: {type: integer, minimum: 0}
        results:
          description: "Only non-ok results."
          type: array
          items:
            type: object
            required: [check, code, severity, title, fix]
            additionalProperties: false
            properties:
              check: {type: string}
              code: {type: string, pattern: "^LAI-[A-Z]{2,3}-[0-9]{3}$"}
              severity: {$ref: "#/components/schemas/Severity"}
              title: {type: string}
              fix: {type: string}
              details: {type: object}
        passed: {type: array, items: {type: string}}

    DrillRequest:
      type: object
      additionalProperties: false
      properties:
