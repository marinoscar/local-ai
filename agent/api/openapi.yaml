        "503": {$ref: "#/components/responses/Starting"}
        "504": {$ref: "#/components/responses/GatewayTimeout"}

  /logs:
    get:
      tags: [status]
      operationId: getLogs
      summary: Recent log lines of a unit
      description: |
        `journalctl -u <unit> -n <lines> [--since <t>] -o json --no-pager`, 5 s timeout, 4 MiB cap; each
        message passes the scrubber. agent.md section 3.8.23.
      x-localai-auth: op
      x-localai-timeout: "10 s"
      parameters:
        - {name: unit, in: query, required: true, schema: {type: string, enum: [agent, llama, kiwix, whisper, music, sync, drill]}}
        - {name: lines, in: query, schema: {type: integer, minimum: 1, maximum: 2000, default: 200}}
        - {name: since, in: query, schema: {type: string, format: date-time}, description: "RFC 3339."}
      responses:
        "200":
          description: The lines.
          headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Logs"}
              examples:
                llama: {value: {unit: "localai-llama.service", lines: [{at: "2026-11-02T08:00:12Z", priority: 6, message: "llama_server: model loaded"}], truncated: false}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500":
          $ref: "#/components/responses/Internal"
          description: "LAI-AGT-099: journalctl failed (details.reason is journalctl_failed, details.exit_code) or a bug."
        "504":
          $ref: "#/components/responses/GatewayTimeout"
          description: "LAI-AGT-099: journalctl took longer than 5 s (details.reason is journalctl_timeout)."

  /events:
    get:
      tags: [status]
      operationId: streamEvents
      summary: Server-sent events
      description: |
        `text/event-stream`, `Cache-Control: no-store`, `X-Accel-Buffering: no`. Each event is `id: <n>`,
        `event: <type>` and `data: <Event as JSON>`; the `resync` and `shutdown` frames carry only their
        payload as data (`{"reason":"gap"}`, `{}`). A reconnecting client sends `Last-Event-ID`; the first event is
        `resync` when the gap is too old or the agent restarted. A keepalive comment `: ping` every 15 s. A
        Portal session only receives `mode.*`, `model.*`, `service.state`, `drive.*` and `alert.*`; the rest
        of its `types` is dropped silently. The event catalog is agent.md section 3.10. It is a GET, so the
        starting gate does not hold it back; a request while the agent is stopping answers 503. After the
        stream started an error cannot be reported as an envelope.
      x-localai-auth: [op, portal]
      x-localai-auth-note: "Portal: types limited to mode.*, model.*, service.state, drive.* and alert.* (survival-portal.md section 3.3)."
      x-localai-timeout: none
      parameters:
        - {name: types, in: query, schema: {type: string}, description: "Comma-separated, may repeat; each pattern is an exact type or ends in a single *, for example model.*,mode.changed. Default: all."}
        - {name: Last-Event-ID, in: header, schema: {type: integer, minimum: 0}, description: "The last event id the client saw. A missing or malformed value means no replay."}
      responses:
        "200":
          description: The stream.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            Cache-Control: {description: "no-store.", schema: {type: string, enum: [no-store]}}
          content:
            text/event-stream:
              schema:
                type: string
                description: "Server-sent events whose data field is an Event."
        "400":
          $ref: "#/components/responses/InvalidRequest"
          description: "LAI-AGT-020: a types pattern is malformed (details.param is types)."
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/Internal"}
        "503":
          $ref: "#/components/responses/Starting"
          description: "LAI-AGT-024: the agent is stopping, or the event bus is closed."

  /speech/stt:
    post:
      tags: [services]
      operationId: speechToText
      summary: Transcribe audio
      description: |
        Owned by companion-services.md section 3.4 and 4.2.5. The upload is `multipart/form-data` (not JSON) and
        the limit is 25 MiB. The agent decodes the WAV, averages the channels, resamples to 16 kHz and sends it
        to whisper-server (one request in flight, two waiting). The transcript is never logged. Messages and
        fixes follow `X-LocalAI-UI-Language`. agent.md section 3.8.25.
      x-localai-auth: [op, portal]
      x-localai-timeout: "120 s"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: "#/components/schemas/SttRequest"}
      responses:
        "200":
          description: The transcript.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SttResponse"}
              examples:
                english: {value: {text: "How do I clean a deep cut?", language: en, language_probability: 0.97, duration_s: 3.2, model: whisper-small, elapsed_ms: 1840}}
        "400":
          $ref: "#/components/responses/InvalidRequest"
          description: "LAI-SVC-014: not WAV, unsupported encoding, too long, empty or silent (details.reason: not_wav, truncated, no_format_chunk, bad_format_chunk, unsupported_encoding, unsupported_channels, unsupported_rate, no_data_chunk, bad_block_align, empty, too_long, silent; silence also carries the message \"I couldn't hear anything. Try again closer to the microphone.\"); LAI-AGT-020 malformed multipart body, a duplicate audio part, a language that is not auto or a 2 to 3 letter code, or a prompt over 200 characters."
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "413":
          $ref: "#/components/responses/TooLarge"
          description: "LAI-SVC-014 (details.reason too_large): larger than 25 MiB."
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "429":
          $ref: "#/components/responses/RateLimited"
          description: "LAI-SVC-015: 2 requests are already queued."
        "500": {$ref: "#/components/responses/Internal"}
        "503":
          $ref: "#/components/responses/Starting"
          description: "LAI-AGT-024 the agent is starting or stopping; LAI-SVC-010 whisper-server cannot be reached and no model is installed; LAI-SVC-011 the server is down, answered with an error, or whisper.enabled is false (details.reason: connect, status, bad_reply, error_field, disabled)."
        "504":
          $ref: "#/components/responses/GatewayTimeout"
          description: "LAI-SVC-016: whisper took longer than 60 s."

  /speech/tts:
    post:
      tags: [services]
      operationId: textToSpeech
      summary: Synthesize speech
      description: |
        Owned by companion-services.md section 3.4. Produces `audio/wav` by exec'ing piper with a fixed argv; the
        text goes to its stdin, never to its argv. The answer is chunked and starts before synthesis ends: the
        44-byte WAV header carries 0xFFFFFFFF as the RIFF and data sizes (length unknown), followed by 16-bit
        mono PCM at the voice's sample rate. A failure before the first audio is an ordinary error response; one
        after it aborts the connection, so the client sees a truncated stream. Voice rules: companion-services.md
        section 4.3.4; the caller sends its language in `X-LocalAI-UI-Language`. agent.md section 3.8.25.
      x-localai-auth: [op, portal]
      x-localai-timeout: "120 s"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TtsRequest"}
            examples:
              english: {value: {text: "Press firmly on the wound with a clean cloth.", voice: null, language: en, speed: 1.0}}
      responses:
        "200":
          description: The audio.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
            X-LocalAI-Voice: {description: "The voice used, for example piper-en-medium.", schema: {type: string}}
            X-LocalAI-Language: {description: "The language of the voice.", schema: {type: string}}
            X-LocalAI-Fallback: {description: "true when the requested language had no voice.", schema: {type: string, enum: ["true"]}}
          content:
            audio/wav:
              schema: {type: string, format: binary}
        "400":
          $ref: "#/components/responses/InvalidRequest"
          description: "LAI-AGT-020: malformed body, an unknown voice (details.field voice, details.reason unknown_voice), a language other than auto, en or es, a speed outside 0.7 to 1.5, or no text left after cleanup (details.reason empty_after_cleanup)."
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "413":
          $ref: "#/components/responses/TooLarge"
          description: "LAI-SVC-024: the text is over 2000 characters after cleanup (details.chars, details.max), or over 64 KiB before it; LAI-AGT-025 the body is over the limit."
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "429":
          $ref: "#/components/responses/RateLimited"
          description: "LAI-SVC-015: more than 2 concurrent syntheses and 4 queued (Retry-After is set)."
        "500":
          $ref: "#/components/responses/Internal"
          description: "LAI-SVC-023: piper failed (details.reason is exit_status, timeout, empty_audio, start_failed or bad_voice_config; details.exit_code and details.stderr, the first 4 KiB, when it ran); LAI-AGT-099 a bug."
        "503":
          $ref: "#/components/responses/Starting"
          description: "LAI-AGT-024 the agent is starting or stopping; LAI-SVC-020 the voice program is not installed; LAI-SVC-022 no voice is installed (or piper.enabled is false)."

  /speech/voices:
    get:
      tags: [services]
      operationId: listVoices
      summary: The installed voices
      description: Needed by the Portal voice picker. companion-services.md section 3.4. agent.md section 3.8.25.
      x-localai-auth: [op, portal]
      x-localai-timeout: "5 s"
      responses:
        "200":
          description: The voices.
          headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Voices"}
              examples:
                one: {value: {voices: [{id: piper-en-medium, language: en, display_name: "English (US), medium", default: true}]}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/Internal"}

  /cloud:
    get:
      tags: [cloud]
      operationId: getCloud
      summary: The cloud link
      description: When not enrolled only `enrolled` is guaranteed. agent.md section 3.8.26.
      x-localai-auth: op
      x-localai-timeout: "5 s"
      responses:
        "200":
          description: The link.
          headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Cloud"}
              examples:
                linked:
                  value:
                    enrolled: true
                    url: "https://ai.marin.cr"
                    state: linked
                    server_node_id: "00000000-0000-4000-8000-000000000001"
                    name: ai-n3
                    since: "2026-11-01T22:10:00Z"
                    last_heartbeat_at: "2026-11-02T15:03:55Z"
                    last_claim_at: "2026-11-02T15:03:58Z"
                    last_error: null
                    credential: "nod_...a1b2"
                    eligible_types: ["localai.status.refresh"]
                    server_features: [node_host_vitals]
                    state_transport: endpoint
                    inflight: null
                    key_synced: true
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/Internal"}
    delete:
      tags: [cloud]
      operationId: unenrollCloud
      summary: Unenroll from the cloud
      description: Deregisters (3 s, errors ignored), deletes the credential and `cloud/link.json`. Audit `cloud.unenroll`. agent.md section 3.8.26.
      x-localai-auth: admin
      x-localai-timeout: "15 s"
      responses:
        "200":
          description: Unenrolled.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CloudUnenrolled"}
              examples:
                done: {value: {enrolled: false}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          $ref: "#/components/responses/Conflict"
          description: "LAI-AGT-022: another cloud link change is running."
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}

  /cloud/enroll:
    post:
      tags: [cloud]
      operationId: enrollCloud
      summary: Enroll in the cloud
      description: |
        Writes the credential (0600), sets `cloud.url` in node.yaml and registers synchronously (10 s). A
        network failure, or a registration the cloud refused (LAI-CLD-054), answers `200` with `state: backoff`
        (credential kept, the link retries). In offline and survival modes the credential is stored and the
        state is `stopped`. Audit `cloud.enroll`.
        agent.md section 3.8.26.
      x-localai-auth: admin
      x-localai-timeout: "30 s"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CloudEnrollRequest"}
            examples:
              enroll: {value: {url: "https://ai.marin.cr", credential: "<NODE_CREDENTIAL>"}}
      responses:
        "200":
          description: Linked, backing off, or stopped.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CloudEnrolled"}
              examples:
                linked: {value: {state: linked, server_node_id: "00000000-0000-4000-8000-000000000001", reattached: false}}
                backoff: {value: {state: backoff, last_error: "cloud unreachable"}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          $ref: "#/components/responses/Conflict"
          description: "LAI-AGT-022: another cloud link change is running."
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422":
          $ref: "#/components/responses/Unprocessable"
          description: "LAI-CLD-051: the cloud answered 401, the credential is not kept. LAI-CLD-062: the address is not https."
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}

  /cloud/resend-key:
    post:
      tags: [cloud]
      operationId: resendCloudKey
      summary: Push the llama key to the cloud now
      description: agent.md section 3.8.26 (an expansion of the brief's table, needed by cloud-app.md section 3.6).
      x-localai-auth: admin
      x-localai-timeout: "15 s"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EmptyRequest"}
      responses:
        "200":
          description: Pushed.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ResendKeyResult"}
              examples:
                synced: {value: {key_synced: true, fingerprint: "ab12...9f3c"}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          $ref: "#/components/responses/Conflict"
          description: "LAI-AGT-023: the node is not linked."
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}

  /doctor:
    get:
      tags: [status]
      operationId: runDoctor
      summary: Run the doctor checks
      description: |
        Runs the checks concurrently (at most 4 at once), each with its own timeout. Only non-ok results
        appear in `results`. Severity order: info < warning < error < critical. agent.md section 3.8.27.
      x-localai-auth: op
      x-localai-timeout: "60 s"
      parameters:
        - {name: area, in: query, style: form, explode: true, schema: {type: array, items: {type: string}}, description: "Repeatable (a comma-separated list also works) and case-insensitive, for example LLM. It matches the check's area. An area that is not one of the code area prefixes is 400 LAI-AGT-020 with details.param area."}
        - {name: fast, in: query, schema: {type: string, enum: ["0", "1", "true", "false"]}, description: "1 or true runs only the checks marked fast, within 5 s in total. Any other value is 400 LAI-AGT-020 with details.param fast."}
      responses:
        "200":
          description: The report.
          headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DoctorReport"}
              examples:
                battery:
                  value:
                    ran_at: "2026-11-02T15:04:05Z"
                    duration_ms: 2310
                    summary: {ok: 41, info: 1, warning: 2, error: 0, critical: 0}
                    results: [{check: hw.battery, code: LAI-HW-012, severity: warning, title: "Running on battery", fix: "Plug in the charger. A laptop server stops when the battery runs out", details: {battery_percent: 64}}]
                    passed: [agt.config, llm.router_health, net.loopback_only]
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/Internal"}

  /drill:
    post:
      tags: [drill]
      operationId: startDrill
      summary: Start a drill
      description: |
        `trigger: scheduled` is what `localai-drill.service` sends. A manual run a precondition refuses is
        409; a scheduled one answers 202 with `state: skipped`. Owned by drill.md section 3.1. agent.md
        section 3.8.28.
      x-localai-auth: op
      x-localai-timeout: "10 s"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DrillRequest"}
            examples:
              full: {value: {quick: false, only: [], trigger: manual}}
      responses:
        "202":
          description: The drill started.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DrillAccepted"}
              examples:
                run: {value: {run_id: "drl-20261101T043512Z-9c1e"}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          $ref: "#/components/responses/Conflict"
          description: "LAI-DRL-002 a drill or an ark run is active; LAI-DRL-003 survival mode."
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}
    get:
      tags: [drill]
      operationId: getDrill
      summary: The last drill results, or one run
      description: Owned by drill.md section 3.4. agent.md section 3.8.28.
      x-localai-auth: op
      x-localai-timeout: "10 s"
      parameters:
        - {name: run_id, in: query, schema: {type: string}, description: "That run instead of the last one."}
      responses:
        "200":
          description: The results document.
          headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DrillResults"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          $ref: "#/components/responses/NotFound"
          description: "LAI-AGT-021: the run is no longer kept, or no drill has run."
        "500": {$ref: "#/components/responses/Internal"}
    delete:
      tags: [drill]
      operationId: abortDrill
      summary: Abort the running drill
      description: The agent restores state (drill.md section 4.3). agent.md section 3.8.28.
      x-localai-auth: op
      x-localai-timeout: "10 s"
      responses:
        "202":
          description: Aborting.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DrillAccepted"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          $ref: "#/components/responses/NotFound"
          description: "LAI-AGT-021: no drill is running."
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}

  /drill/manual:
    post:
      tags: [drill]
      operationId: recordManualDrill
      summary: Record the quarterly pull-the-plug drill
      description: |
        Stores a results document with `trigger: manual_plug` and no `checks` in the drill directory; it
        never moves `latest.json`. The run id is `drl-<at>-<4 hex>-manual`. `at` defaults to now. Audit
        `drill.record_manual`. Owned by drill.md sections 4.6 and 11. agent.md section 3.8.28.
      x-localai-auth: admin
      x-localai-timeout: "5 s"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DrillManualRequest"}
            examples:
              pass: {value: {result: pass, notes: "Unplugged the AC and the node kept answering.", at: "2026-11-02T15:00:00Z"}}
      responses:
        "201":
          description: Recorded.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DrillAccepted"}
              examples:
                run: {value: {run_id: "drl-20261102T150000Z-ab12-manual"}}
        "400":
          $ref: "#/components/responses/InvalidRequest"
          description: "LAI-AGT-020: `result` is not pass or fail, `notes` is over 2000 characters or has control characters, `at` is not RFC 3339, is in the future or is older than a year."
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403":
          $ref: "#/components/responses/Forbidden"
          description: "LAI-SEC-002: an operator without the PIN grant."
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}

  /docs/index:
    get:
      tags: [docs]
      operationId: getDocsIndex
      summary: The rendered manuals
      description: From the first content root with `docs/index.json` (written by `aictl docs render`), internal root first. An empty list if none. agent.md section 3.8.29.
      x-localai-auth: op
      x-localai-timeout: "5 s"
      responses:
        "200":
          description: The index.
          headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DocsIndex"}
              examples:
                one: {value: {root: /srv/localai/docs, rendered_at: "2026-11-02T03:00:00Z", docs: [{slug: 01-survival-mode, title: "Survival mode", title_es: "Modo de supervivencia", html: /docs/01-survival-mode.html, pdf: /docs/01-survival-mode.pdf}]}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/Internal"}

  /profile:
    get:
      tags: [catalog]
      operationId: getProfile
      summary: The profile and its effective plan
      description: agent.md section 3.8.30.
      x-localai-auth: op
      x-localai-timeout: "5 s"
      responses:
        "200":
          description: The profile.
          headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Profile"}
              examples:
                small:
                  value:
                    profile: small-8gb
                    display_name: "Small GPU laptop (8 GB VRAM)"
                    overrides: {add_models: [], remove_models: [], add_content: [], remove_content: [], budget_bytes: null}
                    suggested: small-8gb
                    match_reasons: ["backend cuda", "vram 8192 MiB in 7000..11999"]
                    effective: {models: [qwen3.5-9b-q4km], content: [wikipedia-en-nopic], skipped: [], planned_bytes: 180000000000, budget_bytes: 220000000000}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422":
          $ref: "#/components/responses/Unprocessable"
          description: "LAI-CAT-003 (the profile of node.yaml is not in the catalog) or LAI-CAT-004 (an id is not in the catalog). details carries the profile, the unknown ids, and the suggested profile with its match_reasons, so a node with a broken node.yaml can still be told what fits."
        "500": {$ref: "#/components/responses/Internal"}
    put:
      tags: [catalog]
      operationId: setProfile
      summary: Change the profile
      description: |
        Either field is optional; `null` overrides means unchanged. Validates, writes node.yaml, regenerates
        `models.ini`, reloads the router and recomputes the plan. Does not start a sync. Audit `profile.set`.
        agent.md section 3.8.30.
      x-localai-auth: admin
      x-localai-timeout: "30 s"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProfileRequest"}
            examples:
              cuda: {value: {profile: cuda-12gb, profile_overrides: null}}
              overrides: {value: {profile_overrides: {add_models: [], remove_models: [], add_content: [], remove_content: [], budget_bytes: 200000000000}}}
      responses:
        "200":
          description: The new profile.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Profile"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422":
          $ref: "#/components/responses/Unprocessable"
          description: "LAI-CAT-003 or LAI-CAT-004: the profile or an override is not in the catalog; nothing is written (details as for GET)."
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}

  /workloads:
    get:
      tags: [models]
      operationId: listWorkloads
      summary: List the workloads
      description: |
        The profile's workloads merged with `node.yaml` `workloads:` (same name replaces, a new name adds), sorted
        by name. A workload that names a model the catalog does not have is left out (`LAI-CAT-020` is a doctor
        finding instead). `active` per entry: exactly that set is loaded (survival models kept beside it in
        survival mode do not count). Top-level `active`: the workload last activated while it is still exactly
        loaded, else null. `fits`: the set passes the fit check; `missing`: its models with no verified copy.
        agent.md section 3.8.34, llama-router.md section 4.16.
      x-localai-auth: op
      x-localai-timeout: "5 s"
      responses:
        "200":
          description: The workloads.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkloadsResponse"}
              examples:
                coding: {value: {workloads: [{name: coding, label: {en: Coding, es: "Programación"}, models: [qwen3.6-35b-a3b-q4km], active: true, fits: true, missing: []}], active: coding}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/Internal"}
  /workloads/{name}/activate:
    post:
      tags: [models]
      operationId: activateWorkload
      summary: Switch the node to a workload
      description: |
        Unloads the loaded models that are not in the set (never a survival model in survival mode), then loads
        the missing ones, each through its engine (llama or acestep), under `modelOpsMu`. A failure restores the
        previous set. With `wait: false` (the default) the answer is `202 {op_id}` and progress follows on
        `/events` as `workload.progress` and `workload.done`. Music is refused in survival mode even with
        `force` (409 LAI-AGT-023). agent.md section 3.8.34, llama-router.md section 4.16. Audit
        `workload.activate`.
      x-localai-auth: op
      x-localai-timeout: "5 s, or with wait load_timeout x (n+2) + 60 s"
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WorkloadActivateRequest"}
            examples:
              wait: {value: {wait: true, force: false}}
      responses:
        "200":
          description: The workload is active (wait true).
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkloadActivated"}
              examples:
                music: {value: {op_id: op_abcdefghijkl, active: music, loaded: [acestep-v15-turbo], unloaded: [qwen3.5-9b-q4km]}}
        "202":
          description: Accepted (wait false); the outcome follows on /events.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkloadAccepted"}
              examples:
                accepted: {value: {op_id: op_abcdefghijkl}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          $ref: "#/components/responses/NotFound"
          description: "LAI-LLM-050 there is no workload with this name."
        "409":
          $ref: "#/components/responses/Conflict"
          description: "LAI-AGT-022 another model operation runs; LAI-LLM-053 survival mode without force; LAI-AGT-023 music in survival mode, or single-model mode."
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422":
          $ref: "#/components/responses/Unprocessable"
          description: "LAI-LLM-051 the set does not fit this node; LAI-LLM-043 an engine is not installed; LAI-LLM-008 files missing."
        "500":
          $ref: "#/components/responses/Internal"
          description: "LAI-LLM-052 the activation failed and the previous set was restored (wait true); LAI-LLM-012 nothing could be restored."
        "502":
          $ref: "#/components/responses/Internal"
          description: "LAI-LLM-004 the AI model service is not answering."
        "503": {$ref: "#/components/responses/Starting"}
components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: "Authorization: Bearer lat_... (the agent token). Yields the operator principal."
    operatorSession:
      type: apiKey
      in: cookie
      name: localai_session
      description: "Operator session (HttpOnly). A mutating request authenticated by it must carry a same-origin Origin."
    portalSession:
      type: apiKey
      in: cookie
      name: lai_portal
      description: "Restricted Portal session, issued only in survival mode (survival-portal.md section 3.3)."
    pinGrant:
      type: apiKey
      in: header
      name: X-LocalAI-Pin-Grant
      description: "A PIN grant from POST /pin/verify: lifts an operator to admin."

  headers:
    XRequestId:
      description: "req_ plus 12 base32 characters. Echoes a valid incoming X-Request-Id."
      schema: {type: string}
    XLocalAIOpId:
      description: "op_ id of the operation the request created, when it created one."
      schema: {type: string}
    RetryAfter:
      description: "Seconds to wait."
      schema: {type: integer, minimum: 0}
    Allow:
      description: "The methods the path accepts."
      schema: {type: string}

  parameters:
    ModelId:
      name: id
      in: path
      required: true
      description: "A catalog model id (or alias)."
      schema: {type: string}
    RootId:
      name: root_id
      in: path
      required: true
      description: "A drive's root id, ark-<8 hex> (ark-sync.md section 2)."
      schema: {type: string}
    ServiceName:
      name: name
      in: path
      required: true
      schema: {type: string, enum: [llama, kiwix, whisper]}
    ServiceAction:
      name: action
      in: path
      required: true
      schema: {type: string, enum: [start, stop, restart]}

  responses:
    SessionCookie:
      description: "No content. Sets the cookie localai_session (43 base64url characters; Path=/; HttpOnly; SameSite=Strict; Max-Age=604800)."
      headers:
        X-Request-Id: {$ref: "#/components/headers/XRequestId"}
        X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
        Set-Cookie: {description: "localai_session=<token>.", schema: {type: string}}
        Cache-Control: {description: "no-store: the response sets a credential.", schema: {type: string, enum: [no-store]}}
    InvalidRequest:
      description: "400 LAI-AGT-020: malformed JSON, unknown field (details.field), invalid value."
      headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}
    Unauthenticated:
      description: "401 LAI-SEC-001 missing or invalid credentials, or LAI-SVC-110 a Portal session used where it is not allowed."
      headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}
    Forbidden:
      description: "403 LAI-SEC-002 admin needed (details.pin_required), LAI-SEC-006 bad Host, LAI-SEC-007 bad Origin, LAI-SEC-013 socket peer is not an operator."
      headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}
    NotFound:
      description: "404 LAI-AGT-021: unknown route, model id, service name or content id."
      headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}
    Conflict:
      description: "409 LAI-AGT-022 another operation is in progress, or LAI-AGT-023 not allowed in the current mode."
      headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}
    TooLarge:
      description: "413 LAI-AGT-025: the body is over the limit (1 MiB; STT 25 MiB)."
      headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}
    UnsupportedMediaType:
      description: "415 LAI-AGT-020: a mutating request without the right Content-Type."
      headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}
    Unprocessable:
      description: "422 a domain code: understood but refused by a rule."
      headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}
    RateLimited:
      description: "429 LAI-SEC-004 too many wrong PIN or login-code attempts, or a queue limit (Retry-After is set)."
      headers:
        X-Request-Id: {$ref: "#/components/headers/XRequestId"}
        Retry-After: {$ref: "#/components/headers/RetryAfter"}
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}
    Internal:
      description: "500 LAI-AGT-099: a bug (details.request_id is always present), or a domain failure code."
      headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}
    BadGateway:
      description: "502 LAI-LLM-004 the router, or LAI-SVC-* another upstream, is not answering."
      headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}
    Starting:
      description: "503 LAI-AGT-024: the agent is starting up or shutting down (Retry-After: 5)."
      headers:
        X-Request-Id: {$ref: "#/components/headers/XRequestId"}
        Retry-After: {$ref: "#/components/headers/RetryAfter"}
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}
    GatewayTimeout:
      description: "504 LAI-LLM-010: an upstream took too long."
      headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}

  schemas:
    ErrorEnvelope:
      description: "The body of every non-2xx response (agent.md section 3.7). `code` is always a doctor code, `fix` one plain-language sentence, `details` an object whose keys are documented per route."
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, fix, details]
          additionalProperties: false
          properties:
            code: {type: string, pattern: "^LAI-[A-Z]{2,3}-[0-9]{3}$"}
            message: {type: string}
            fix: {type: string}
            details: {type: object}
      examples:
        - error: {code: LAI-LLM-009, message: "The model failed to start. The previous model was started again.", fix: "Run aictl logs --unit llama to see why.", details: {model: qwen3.5-9b-q4km, exit_code: 1, rolled_back: true, op_id: op_7k2m9q4r8t1c}}

    EmptyRequest:
      description: "The empty JSON object. The Content-Type is still required."
      type: object
      additionalProperties: false
      properties: {}

    Health:
      description: "GET /health (agent.md section 3.8.1)."
      type: object
      required: [ok, version, mode, starting]
      additionalProperties: false
      properties:
        ok: {type: boolean, description: "True whenever the agent answers."}
        version: {type: string}
        mode: {$ref: "#/components/schemas/ModeValue"}
        starting: {type: boolean, description: "True until startup step 17 completes."}

    ModeValue:
      type: string
      enum: [online, offline, survival]

    SessionCodeRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code: {type: string, pattern: "^[0-9]{6}$", description: "Six decimal digits."}

    UiCode:
      type: object
      required: [code, expires_at]
      additionalProperties: false
      properties:
        code: {type: string, pattern: "^[0-9]{6}$"}
        expires_at: {type: string, format: date-time}

    PinVerifyRequest:
      type: object
      required: [pin]
      additionalProperties: false
      properties:
        pin: {type: string, pattern: "^[0-9]{4,8}$", description: "4 to 8 digits."}

    PinGrant:
      type: object
      required: [grant, expires_at]
      additionalProperties: false
      properties:
        grant: {type: string, pattern: "^pg_[A-Za-z0-9_-]{43}$"}
        expires_at: {type: string, format: date-time}

    Alert:
      description: "An alert raised by the doctor (agent.md section 4.13)."
      type: object
      required: [code, severity, title, fix]
      additionalProperties: false
      properties:
        code: {type: string, pattern: "^LAI-[A-Z]{2,3}-[0-9]{3}$"}
        severity: {$ref: "#/components/schemas/Severity"}
        title: {type: string}
        fix: {type: string}
        action: {$ref: "#/components/schemas/DoctorAction"}
        since: {type: string, format: date-time}
        details: {type: object}

    DoctorAction:
      description: "The button of a fix (doctor-codes.md section 1.7): a closed set. Present on an alert or a capability only when its code has one; not in the state pushed to the cloud."
      type: string
      enum: [ark.import, ensure.run, service.restart:kiwix, service.restart:whisper, portal.brain]

    Severity:
      type: string
      enum: [info, warning, error, critical]

    Service:
      description: |
        One companion service. `name` and `unit` are always present (`unit` is null for piper and maps). The agent
        fields (`active`, `sub`, `since`, `restarts`, `healthy`, `enabled`, `last_exit`) are in agent.md section 3.8.4
        and 3.8.22; the supervisor fields (`state`, `last_check`, `detail`, `books`, `model`, `device`, `voices`,
        `maps`, `problems`) are owned by companion-services.md section 4.6, hence the open object. A service
        without a unit (piper, maps) has no `active`, `sub`, `restarts` or `enabled`. `state` is the health state
        of companion-services.md section 4.6; `problems` is worst first, with LAI-SVC-051 first when the restart
        budget is spent.
      type: object
      required: [name, unit]
      additionalProperties: true
      properties:
        name: {type: string}
        unit: {type: [string, "null"]}
        active: {type: string, description: "systemd ActiveState."}
        sub: {type: string, description: "systemd SubState."}
        since: {type: [string, "null"], format: date-time}
        restarts: {type: integer, minimum: 0}
        healthy: {type: boolean}
        enabled: {type: boolean}
        last_exit:
          type: [object, "null"]
          additionalProperties: false
          properties:
            code: {type: integer}
            at: {type: string, format: date-time}
        state: {type: string, enum: [ok, degraded, down, missing_content, disabled, starting]}
        last_check: {type: string, format: date-time}
        detail: {type: string}
        books:
          type: array
          items:
            type: object
            required: [content_id, name, root]
            additionalProperties: true
            properties:
              content_id: {type: string}
              name: {type: string}
              root: {type: string}
        model: {type: string}
        device: {type: string}
        voices: {type: array, items: {type: string}}
        maps: {type: array, items: {type: string}}
        problems:
          type: array
          items:
            type: object
            required: [code, severity]
            additionalProperties: true
            properties:
              code: {type: string, pattern: "^LAI-[A-Z]+-[0-9]{3}$"}
              severity: {$ref: "#/components/schemas/Severity"}

    ServiceList:
      type: object
      required: [services]
      additionalProperties: false
      properties:
        services: {type: array, items: {$ref: "#/components/schemas/Service"}}

    ServiceActionRequest:
      type: object
      additionalProperties: false
      properties:
        force: {type: boolean, default: false, description: "Needed to stop llama in survival mode."}

    ServiceActionResult:
      type: object
      required: [name, active, op_id]
      additionalProperties: false
      properties:
        name: {type: string}
        active: {type: string}
        restored_models: {type: array, items: {type: string}}
        op_id: {type: string}

    ModeTransition:
      description: "`op_id`, `from` and `warnings` are present in GET /mode (the steps' warnings so far)."
      type: object
      required: [step, started_at]
      additionalProperties: false
      properties:
        op_id: {type: string}
        from: {$ref: "#/components/schemas/ModeValue"}
        target: {$ref: "#/components/schemas/ModeValue"}
        step: {type: string}
        started_at: {type: string, format: date-time}
        warnings:
          type: array
          items:
            type: object
            required: [code, message]
            additionalProperties: false
            properties:
              code: {type: string, pattern: "^LAI-[A-Z]{2,3}-[0-9]{3}$"}
              message: {type: string}

    Status:
      description: "GET /status (agent.md section 3.8.4)."
      type: object
      required: [node, mode, connectivity, hardware, services, models, ark, cloud, tailscale, alerts]
      additionalProperties: false
      properties:
        node:
          type: object
          required: [id, display_name, hostname, profile, agent_version, backend, llama_mode, llama_build, catalog_version, uptime_s, time]
          additionalProperties: false
          properties:
            id: {type: string}
            display_name: {type: string}
            hostname: {type: string}
            profile: {type: [string, "null"]}
            agent_version: {type: string}
            backend: {type: string}
            llama_mode: {type: string, description: "router or single."}
            llama_build: {type: [string, "null"]}
            catalog_version: {type: [string, "null"]}
            uptime_s: {type: integer, minimum: 0}
            time: {type: string, format: date-time}
            counters: {type: object, additionalProperties: true, description: "Only with ?counters=1 (agent.md section 7); the keys belong to their producers."}
        mode:
          type: object
          required: [value, since, transition]
          additionalProperties: false
          properties:
            value: {$ref: "#/components/schemas/ModeValue"}
            since: {type: [string, "null"], format: date-time, description: "Null on a fresh node whose mode was never committed."}
            transition:
              oneOf:
                - {type: "null"}
                - {$ref: "#/components/schemas/ModeTransition"}
        connectivity:
          type: object
          required: [value, checked_at, none_since]
          additionalProperties: false
          properties:
            value: {type: string, description: "For example full or none."}
            checked_at: {type: [string, "null"], format: date-time}
            none_since: {type: [string, "null"], format: date-time}
        hardware:
          type: object
          required: [gpu, vram_total_mib, vram_used_mib, ram_total_mib, ram_available_mib, gpu_temp_c, cpu_temp_c, power]
          additionalProperties: false
          properties:
            gpu: {type: [string, "null"]}
            vram_total_mib: {type: [integer, "null"]}
            vram_used_mib: {type: [integer, "null"]}
            ram_total_mib: {type: integer}
            ram_available_mib: {type: integer}
            gpu_temp_c: {type: [number, "null"]}
            cpu_temp_c: {type: [number, "null"]}
            power: {$ref: "#/components/schemas/Power"}
            gpus:
              description: "Each GPU (this agent always sends it; optional so that a reduced status of an older agent still validates); `processes` is left out of the state pushed to the cloud."
              type: array
              items:
                type: object
                required: [index, vendor, name, vram_total_mib, vram_used_mib, temp_c, util_pct, throttling]
                additionalProperties: false
                properties:
                  index: {type: integer, minimum: 0}
                  vendor: {type: string}
                  name: {type: string}
                  vram_total_mib: {type: integer, minimum: 0}
                  vram_used_mib: {type: integer, minimum: 0}
                  temp_c: {type: [number, "null"]}
                  util_pct: {type: [integer, "null"]}
                  throttling: {type: array, items: {type: string}}
                  processes:
                    type: array
                    items:
                      type: object
                      required: [pid, name, vram_mib]
                      additionalProperties: false
                      properties:
                        pid: {type: integer}
                        name: {type: string}
                        vram_mib: {type: integer, minimum: 0}
        services: {type: array, items: {$ref: "#/components/schemas/Service"}}
        models:
          type: object
          required: [default, loaded, loading, present, loadable, models_max]
          additionalProperties: false
          properties:
            default: {type: [string, "null"]}
            loaded: {type: array, items: {type: string}}
            loading: {type: array, items: {type: string}}
            present: {type: integer, minimum: 0}
            loadable: {type: integer, minimum: 0}
            models_max: {type: integer, minimum: 0}
        ark:
          description: "Summary of ark-sync.md section 4.12.1 and 3.5."
          type: object
          required: [roots, drive, sync]
          additionalProperties: true
          properties:
            roots:
              type: array
              items:
                type: object
                required: [path, kind, status]
                additionalProperties: true
                properties:
                  path: {type: string}
                  kind: {type: string}
                  status: {type: string}
                  ready_pct: {type: integer}
                  updated_at: {type: [string, "null"], format: date-time}
            drive:
              type: object
              required: [mounted]
              additionalProperties: true
              properties:
                mounted: {type: boolean}
            sync:
              type: object
              required: [state]
              additionalProperties: true
              properties:
                state: {type: string}
                last_success_at: {type: [string, "null"], format: date-time}
            metrics:
              description: "The readiness gauges of ark-sync.md section 7: localai_ark_root_overall (0 green, 1 yellow, 2 red), localai_ark_root_free_bytes and localai_ark_reverify_age_days_max, one of each per mounted root (label root)."
              type: array
              items:
                type: object
                required: [name, value]
                additionalProperties: false
                properties:
                  name: {type: string}
                  labels: {type: object, additionalProperties: {type: string}}
                  value: {type: number}
        cloud:
          type: object
          required: [enrolled]
          additionalProperties: false
          properties:
            enrolled: {type: boolean}
            state: {type: string}
            url: {type: [string, "null"]}
            last_heartbeat_at: {type: [string, "null"], format: date-time}
        tailscale:
          type: object
          required: [manage]
          additionalProperties: false
          properties:
            manage: {type: boolean}
            pattern: {type: string, enum: [A, B, none]}
            applied: {type: boolean}
            backend_state: {type: [string, "null"]}
        alerts: {type: array, items: {$ref: "#/components/schemas/Alert"}}

    Power:
      type: object
      required: [source]
      additionalProperties: false
      properties:
        source: {type: string, description: "ac or battery."}
        battery_percent: {type: [integer, "null"], minimum: 0, maximum: 100}
        charging: {type: [boolean, "null"]}
        time_remaining_s: {type: [integer, "null"], minimum: 0}
        profile: {type: [string, "null"]}
        stale: {type: boolean, description: "Present and true when the last probe failed and this is the previous value."}

    PortalStatusV1:
      description: "Owned by survival-portal.md section 3.5. Built by internal/portal from cached views; it never holds a path, key, address, hostname (only the node id), user name, cloud detail, drive id or log."
      type: object
      required: [schema_version, generated_at, node_id, mode, language, emergency_number, session, power, clock_ok, brain, capabilities, first_aid, ark, alerts]
      additionalProperties: false
      properties:
        schema_version: {type: integer}
        generated_at: {type: string, format: date-time}
        node_id: {type: string}
        mode: {$ref: "#/components/schemas/ModeValue"}
        language: {type: string, enum: [en, es]}
        session: {type: string, enum: [none, portal, full]}
        emergency_number: {type: string, maxLength: 20}
        power:
          type: object
          required: [on_ac, battery_pct, minutes_left, state, low, critical]
          additionalProperties: false
          properties:
            on_ac: {type: boolean}
            battery_pct: {type: [integer, "null"], minimum: 0, maximum: 100}
            minutes_left: {type: [integer, "null"], minimum: 0}
            state: {type: string, enum: [discharging, charging, full, no_battery]}
            low: {type: boolean, description: "On battery and under 20 %."}
            critical: {type: boolean, description: "On battery and under 10 %."}
        clock_ok: {type: boolean}
        brain:
          type: object
          required: [loaded, loading, choices]
          additionalProperties: false
          properties:
            loaded: {type: array, items: {$ref: "#/components/schemas/PortalModel"}}
            loading: {type: [object, "null"], description: "The model that is starting, or null.", additionalProperties: false, properties: {id: {type: string}, display_name: {type: string}, roles: {type: array, items: {type: string}}, vision: {type: boolean}}}
            choices:
              description: "Catalog llama models of the profile; survival ones first."
              type: array
              items:
                type: object
                required: [id, display_name, summary, roles, vision, loadable, survival]
                additionalProperties: false
                properties:
                  id: {type: string}
                  display_name: {type: string}
                  summary: {type: string}
                  roles: {type: array, items: {type: string}}
                  vision: {type: boolean}
                  loadable: {type: boolean}
                  survival: {type: boolean}
                  speed_hint: {type: string, enum: [fast, medium, slow]}
        capabilities:
          description: "survival-portal.md section 4.2. code is present only when a problem causes the state (needs_switch has none); action when that code has one (doctor-codes.md section 1.7)."
          type: object
          required: [chat, photo, talk, library, maps, manuals]
          additionalProperties: false
          properties:
            chat:
              type: object
              required: [state]
              additionalProperties: false
              properties:
                state: {type: string, enum: [ready, degraded, unavailable]}
                code: {type: string, pattern: "^LAI-[A-Z]{2,3}-[0-9]{3}$"}
                reason: {type: string}
                action: {$ref: "#/components/schemas/DoctorAction"}
            photo:
              type: object
              required: [state]
              additionalProperties: false
              properties:
                state: {type: string, enum: [ready, degraded, unavailable]}
                code: {type: string, pattern: "^LAI-[A-Z]{2,3}-[0-9]{3}$"}
                reason: {type: string}
                action: {$ref: "#/components/schemas/DoctorAction"}
                vision_model: {type: string, description: "Present with reason needs_switch: the model to switch to."}
            talk:
              type: object
              required: [state, stt, tts_languages]
              additionalProperties: false
              properties:
                state: {type: string, enum: [ready, degraded, unavailable]}
                code: {type: string, pattern: "^LAI-[A-Z]{2,3}-[0-9]{3}$"}
                reason: {type: string}
                action: {$ref: "#/components/schemas/DoctorAction"}
                stt: {type: boolean}
                tts_languages: {type: array, items: {type: string, pattern: "^[a-z]{2,3}$"}}
            library:
              type: object
              required: [state, books]
              additionalProperties: false
              properties:
                state: {type: string, enum: [ready, degraded, unavailable]}
                code: {type: string, pattern: "^LAI-[A-Z]{2,3}-[0-9]{3}$"}
                reason: {type: string}
                action: {$ref: "#/components/schemas/DoctorAction"}
                books:
                  type: array
                  items:
                    type: object
                    required: [content_id, title, book, lang]
                    additionalProperties: false
                    properties:
                      content_id: {type: string}
                      title: {type: string}
                      book: {type: string, description: "The undated kiwix book name."}
                      lang: {type: string}
            maps:
              type: object
              required: [state, search, gps]
              additionalProperties: false
              properties:
                state: {type: string, enum: [ready, degraded, unavailable]}
                code: {type: string, pattern: "^LAI-[A-Z]{2,3}-[0-9]{3}$"}
                reason: {type: string}
                action: {$ref: "#/components/schemas/DoctorAction"}
                search: {type: boolean}
                gps: {type: boolean}
            manuals:
              type: object
              required: [state, items]
              additionalProperties: false
              properties:
                state: {type: string, enum: [ready, degraded, unavailable]}
                code: {type: string, pattern: "^LAI-[A-Z]{2,3}-[0-9]{3}$"}
                reason: {type: string}
                action: {$ref: "#/components/schemas/DoctorAction"}
                items:
                  type: array
                  items:
                    type: object
                    required: [id, title, url]
                    additionalProperties: false
                    properties:
                      id: {type: string}
                      title: {type: string}
                      url: {type: string, pattern: "^/docs/"}
        first_aid:
          description: "Empty until PORTAL-11."
          type: array
          items:
            type: object
            required: [key, title, url, available]
            additionalProperties: false
            properties:
              key: {type: string}
              title: {type: string}
              url: {type: string}
              available: {type: boolean}
        ark:
          type: object
          required: [overall, survival_capable, drive_connected]
          additionalProperties: false
          properties:
            overall: {type: string, enum: [green, yellow, red, unknown]}
            survival_capable: {type: boolean}
            drive_connected: {type: boolean}
        alerts:
          type: array
          items:
            type: object
            required: [code, severity, title, fix]
            additionalProperties: false
            properties:
              code: {type: string, pattern: "^LAI-[A-Z]{2,3}-[0-9]{3}$"}
              severity: {$ref: "#/components/schemas/Severity"}
              title: {type: string}
              fix: {type: string}
              action: {$ref: "#/components/schemas/DoctorAction"}

    PortalModel:
      type: object
      required: [id, display_name, roles, vision]
      additionalProperties: false
      properties:
        id: {type: string}
        display_name: {type: string}
        roles: {type: array, items: {type: string}}
        vision: {type: boolean}

    Hardware:
      description: "GET /hardware (agent.md section 3.8.6)."
      type: object
      required: [sampled_at, gpus, ram, disks, power, thermal, cpu]
      additionalProperties: false
      properties:
        sampled_at: {type: string, format: date-time}
        gpus:
          description: "Empty on a CPU-only node."
          type: array
          items:
            type: object
            required: [index, vendor, name, backend, vram_total_mib, vram_used_mib]
            additionalProperties: false
            properties:
              index: {type: integer, minimum: 0}
              vendor: {type: string, enum: [nvidia, amd, intel, other]}
              name: {type: string}
              backend: {type: string}
              compute_cap: {type: [string, "null"]}
              driver: {type: [string, "null"]}
              unified_memory: {type: boolean}
              vram_total_mib: {type: integer, minimum: 0}
              vram_used_mib: {type: integer, minimum: 0}
              vram_used_by_others_mib: {type: [integer, "null"], minimum: 0}
              temp_c: {type: [number, "null"]}
              util_pct: {type: [number, "null"]}
              power_w: {type: [number, "null"]}
              stale: {type: boolean, description: "Present and true when the last probe failed and this is the previous value."}
              throttling: {type: array, items: {type: string}}
              processes:
                type: array
                items:
                  type: object
                  required: [pid, name, vram_mib]
                  additionalProperties: false
                  properties:
                    pid: {type: integer}
                    name: {type: string}
                    vram_mib: {type: integer, minimum: 0}
        ram:
          type: object
          required: [total_mib, available_mib]
          additionalProperties: false
          properties:
            total_mib: {type: integer, minimum: 0}
            available_mib: {type: integer, minimum: 0}
            swap_total_mib: {type: integer, minimum: 0}
            swap_free_mib: {type: integer, minimum: 0}
            stale: {type: boolean, description: "Present and true when the last probe failed and this is the previous value."}
        disks:
          description: "One entry per role (per drive for drive_root), even when several share a filesystem."
          type: array
          items:
            type: object
            required: [path, role, total_bytes, free_bytes]
            additionalProperties: false
            properties:
              path: {type: string}
              role: {type: string, enum: [internal_root, drive_root, state, opt, etc]}
              fs: {type: string}
              total_bytes: {type: integer, minimum: 0}
              free_bytes: {type: integer, minimum: 0}
              stale: {type: boolean, description: "Present and true when the last probe failed and this is the previous value."}
        power: {$ref: "#/components/schemas/Power"}
        thermal:
          type: object
          additionalProperties: false
          properties:
            cpu_temp_c: {type: [number, "null"]}
            cpu_throttle_events: {type: integer, minimum: 0}
            stale: {type: boolean, description: "Present and true when the last probe failed and this is the previous value."}
            zones:
              type: array
              items:
                type: object
                required: [type, temp_c]
                additionalProperties: false
                properties:
                  type: {type: string}
                  temp_c: {type: number}
        cpu:
          type: object
          required: [model, cores]
          additionalProperties: false
          properties:
            model: {type: string}
            cores: {type: integer, minimum: 0, description: "0 when the probe has not succeeded yet."}
            load1: {type: number}
            stale: {type: boolean, description: "Present and true when the last probe failed and this is the previous value."}

    Model:
      description: "A catalog model merged with local state. `files` and `preset` appear on GET /models/{id} only."
      type: object
      required: [id, display_name, engine, in_profile, present, verified, locations, loadable, loadable_reason, status, loaded, default, aliases]
      additionalProperties: false
      properties:
        id: {type: string}
        display_name: {type: string}
        summary: {type: string}
        engine: {type: string, description: "For example llama."}
        roles: {type: array, items: {type: string}}
        survival_tier: {type: integer}
        in_profile: {type: boolean}
        size_bytes: {type: integer, minimum: 0}
        present: {type: boolean}
        verified: {type: boolean}
        locations:
          type: array
          items:
            type: object
            required: [root, complete]
            additionalProperties: false
            properties:
              root: {type: string}
              complete: {type: boolean}
              verified_at: {type: [string, "null"], format: date-time}
        loadable: {type: boolean}
        loadable_reason:
          description: "Null when loadable. code is LAI-CAT-005 (fit or backend), LAI-LLM-008 (files missing or unverified) or LAI-LLM-004 (router down)."
          type: [object, "null"]
          required: [code, message]
          additionalProperties: false
          properties:
            code: {type: string, pattern: "^LAI-[A-Z]{2,3}-[0-9]{3}$"}
            message: {type: string}
        status: {type: string, enum: [absent, stored, unloaded, loading, loaded, sleeping, failed, n/a]}
        loaded: {type: boolean}
        default: {type: boolean}
        aliases: {type: array, items: {type: string}}
        requirements:
          type: object
          additionalProperties: false
          properties:
            backends: {type: array, items: {type: string}}
            min_vram_mib: {type: integer, minimum: 0}
            min_ram_mib: {type: integer, minimum: 0}
        last_load_ms: {type: [integer, "null"], minimum: 0}
        files:
          type: array
          items:
            type: object
            required: [kind, name, size_bytes, sha256, path]
            additionalProperties: false
            properties:
              kind: {type: string}
              name: {type: string}
              size_bytes: {type: integer, minimum: 0}
              sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
              path: {type: string}
        preset: {type: string, description: "The router INI section text."}

    ModelList:
      type: object
      required: [models_max, default, models]
      additionalProperties: false
      properties:
        models_max: {type: integer, minimum: 0}
        default: {type: [string, "null"]}
        models: {type: array, items: {$ref: "#/components/schemas/Model"}}

    LoadRequest:
      type: object
      additionalProperties: false
      properties:
        wait: {type: boolean, default: true}
        unload_others: {type: boolean, default: true}

    ModelLoaded:
      type: object
      required: [id, status, already_loaded, op_id]
      additionalProperties: false
      properties:
        id: {type: string}
        status: {type: string, enum: [loaded]}
        already_loaded: {type: boolean}
        load_ms: {type: [integer, "null"], minimum: 0, description: "How long the router took to load the model, without the evictions; 0 when it was loaded already."}
        unloaded: {type: array, items: {type: string}, description: "The models stopped to make room, in the order they were stopped."}
        op_id: {type: string}
        warning:
          type: object
          description: "Present when the load went ahead although other programs hold much of the memory (LAI-HW-005, LAI-HW-006)."
          required: [code, message]
          additionalProperties: false
          properties:
            code: {type: string}
            message: {type: string}

    ModelLoading:
      type: object
      required: [id, status, op_id]
      additionalProperties: false
      properties:
        id: {type: string}
        status: {type: string, enum: [loading]}
        op_id: {type: string}
        warning:
          type: object
          description: "Present when the plan already knows the load will go ahead although other programs hold much of the memory (LAI-HW-005, LAI-HW-006). The same notice as in ModelLoaded, so a client that does not wait can show it."
          required: [code, message]
          additionalProperties: false
          properties:
            code: {type: string}
            message: {type: string}

    UnloadRequest:
      type: object
      additionalProperties: false
      properties:
        force: {type: boolean, default: false, description: "Needed to unload the last loaded LLM in survival mode."}

    ModelUnloaded:
      type: object
      required: [id, status, already_unloaded, op_id]
      additionalProperties: false
      properties:
        id: {type: string}
        status: {type: string, enum: [unloaded]}
        already_unloaded: {type: boolean}
        op_id: {type: string}
        restarted: {type: boolean, description: "Present and true when the model would not stop and llama was restarted (LAI-LLM-031)."}
        restored: {type: array, items: {type: string}, description: "Present with restarted: the models loaded again afterwards."}

    DefaultModelRequest:
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id: {type: string}

    DefaultModelResponse:
      type: object
      required: [default, previous, ini_regenerated]
      additionalProperties: false
      properties:
        default: {type: string}
        previous: {type: [string, "null"]}
        ini_regenerated: {type: boolean}

    DownloadRequest:
      type: object
      additionalProperties: false
      properties:
        roots: {type: array, items: {type: string}, description: "Content roots (path or root id). Default: the internal root, plus the drive if its profile includes the model."}
        allow_offline_mode: {type: boolean, default: false}

    DownloadAccepted:
      type: object
      required: [id, sync_run_id, queued]
      additionalProperties: false
      properties:
        id: {type: string}
        sync_run_id: {type: string, pattern: "^run-"}
        queued: {type: boolean}

    DeleteModelResponse:
      type: object
      required: [id, deleted, op_id]
      additionalProperties: false
      properties:
        id: {type: string}
        deleted:
          type: array
          items:
            type: object
            required: [root, bytes]
            additionalProperties: false
            properties:
              root: {type: string}
              bytes: {type: integer, minimum: 0}
        kept:
          description: "Present when a root's copy was left in place: the last verified copy under keep_last, or no copy on that root."
          type: array
          items:
            type: object
            required: [root, reason]
            additionalProperties: false
            properties:
              root: {type: string}
              reason: {type: string, enum: [last_verified_copy, not_present]}
        op_id: {type: string}
        warnings:
          description: "Present when the router reload after the delete had a problem; the files are already deleted."
          type: array
          items:
            type: object
            required: [code, message]
            additionalProperties: false
            properties:
              code: {type: string, pattern: "^LAI-[A-Z]{2,3}-[0-9]{3}$"}
              message: {type: string}

    Key:
      description: "GET /key (agent.md section 3.8.13)."
      type: object
      required: [key, fingerprint, base_urls, models, snippets]
      additionalProperties: false
      properties:
        key: {type: string, pattern: "^[0-9a-f]{64}$"}
        fingerprint: {type: string}
        base_urls:
          type: object
          required: [local, tailnet, public]
          additionalProperties: false
          properties:
            local: {type: string}
            tailnet: {type: [string, "null"]}
            public: {type: [string, "null"]}
        models: {type: array, items: {type: string}}
        snippets:
          type: object
          required: [curl, env]
          additionalProperties: true
          properties:
            curl: {type: string}
            env: {type: string}
            opencode: {type: object, additionalProperties: true}
            openai_python: {type: string}

    KeyRotateRequest:
      type: object
      additionalProperties: false
      properties:
        restart: {type: boolean, default: true}

    KeyRotated:
      type: object
      required: [fingerprint, rotated_at, cloud_synced, restored_models, clients_to_update, op_id]
      additionalProperties: false
      properties:
        fingerprint: {type: string}
        rotated_at: {type: string, format: date-time}
        cloud_synced: {type: boolean}
        restored_models: {type: array, items: {type: string}}
        clients_to_update: {type: array, items: {type: string}}
        op_id: {type: string}

    Mode:
      description: "GET /mode (agent.md section 3.8.15)."
      type: object
      required: [mode, since, transition, allowed_targets, leave_requires_admin, connectivity, suggest_survival]
      additionalProperties: false
      properties:
        mode: {$ref: "#/components/schemas/ModeValue"}
        since: {description: "When the mode was committed; null on a node that never changed mode.", oneOf: [{type: "null"}, {type: string, format: date-time}]}
        transition:
          oneOf:
            - {type: "null"}
            - {$ref: "#/components/schemas/ModeTransition"}
        allowed_targets: {type: array, items: {$ref: "#/components/schemas/ModeValue"}}
        leave_requires_admin: {type: boolean}
        connectivity: {type: string}
        suggest_survival: {type: boolean}

    ModeRequest:
      type: object
      required: [target]
      additionalProperties: false
      properties:
        target: {$ref: "#/components/schemas/ModeValue"}
        wait: {type: boolean, default: false}
        reapply: {type: boolean, default: false}

    ModeAccepted:
      type: object
      required: [op_id, from, target, transition]
      additionalProperties: false
      properties:
        op_id: {type: string}
        from: {$ref: "#/components/schemas/ModeValue"}
        target: {$ref: "#/components/schemas/ModeValue"}
        transition: {$ref: "#/components/schemas/ModeTransition"}

    ModeDone:
      type: object
      required: [op_id, from, mode, warnings]
      additionalProperties: false
      properties:
        op_id: {type: string}
        from: {$ref: "#/components/schemas/ModeValue"}
        mode: {$ref: "#/components/schemas/ModeValue"}
        warnings:
          type: array
          items:
            type: object
            required: [code, message]
            additionalProperties: false
            properties:
              code: {type: string, pattern: "^LAI-[A-Z]{2,3}-[0-9]{3}$"}
              message: {type: string}

    ModeAlready:
      type: object
      required: [mode, already]
      additionalProperties: false
      properties:
        mode: {$ref: "#/components/schemas/ModeValue"}
        already: {type: boolean, enum: [true]}

    SurvivalRequest:
      type: object
      additionalProperties: false
      properties:
        reapply: {type: boolean, default: false}

    SurvivalAccepted:
      type: object
      required: [op_id, target]
      additionalProperties: false
      properties:
        op_id: {type: string}
        target: {type: string, enum: [survival]}
        queued: {type: boolean, description: "True when the request was persisted as pending_mode (before startup step 12, or during shutdown)."}

    SurvivalAlready:
      type: object
      required: [mode, already]
      additionalProperties: false
      properties:
        mode: {type: string, enum: [survival]}
        already: {type: boolean, enum: [true]}

    ArkRoots:
      description: "Owned by ark-sync.md section 3.5 (GET /ark) and 4.12.1 (READY.json)."
      type: object
      required: [roots]
      additionalProperties: false
      properties:
        roots:
          type: array
          items: {$ref: "#/components/schemas/ReadyReport"}

    ReadyReport:
      description: "READY.json, schema v1 (ark-sync.md section 4.12.1): the readiness of one content root. `generated_by.node_id` and `root.path` are dropped before the report goes to the cloud (cloud ReadyReportV1)."
      type: object
      required: [schema_version, generated_at, generated_by, root, overall, survival_capable, clock_wrong, last_sync, last_full_reverify_at, counts, items, problems]
      additionalProperties: true
      properties:
        schema_version: {type: integer, const: 1}
        generated_at: {type: string, format: date-time}
        generated_by:
          type: object
          required: [node_id, agent_version]
          additionalProperties: true
          properties:
            node_id: {type: string}
            agent_version: {type: string}
        root:
          type: object
          required: [id, kind, path, profile, catalog_version, fs_total_bytes, fs_free_bytes, budget_bytes, used_bytes, trash_bytes, read_only]
          additionalProperties: true
          properties:
            id: {type: string}
            kind: {type: string, enum: [internal, ark_drive]}
            path: {type: string}
            profile: {type: string}
            catalog_version: {type: [string, "null"]}
            fs_total_bytes: {type: integer, minimum: 0}
            fs_free_bytes: {type: integer, minimum: 0}
            budget_bytes: {type: integer, minimum: 0}
            used_bytes: {type: integer, minimum: 0}
            trash_bytes: {type: integer, minimum: 0}
            read_only: {type: boolean}
        overall: {type: string, enum: [green, yellow, red]}
        survival_capable: {type: boolean, description: "This root alone holds everything survival needs. The node-level value, over every mounted root, is in GET /status."}
        clock_wrong: {type: boolean, description: "True when the clock is earlier than a time the node has already seen: every item's freshness is then omitted and no age rule is applied."}
        last_sync:
          type: [object, "null"]
          required: [run_id, trigger, finished_at, state, age_days]
          additionalProperties: true
          properties:
            run_id: {type: string}
            trigger: {type: string}
            finished_at: {type: string, format: date-time}
            state: {type: string}
            age_days: {type: integer, minimum: 0}
        last_full_reverify_at: {type: [string, "null"], format: date-time}
        counts:
          type: object
          required: [verified, stale, missing, skipped, failed, quarantined, orphan]
          additionalProperties: false
          properties:
            verified: {type: integer, minimum: 0}
            stale: {type: integer, minimum: 0}
            missing: {type: integer, minimum: 0}
            skipped: {type: integer, minimum: 0}
            failed: {type: integer, minimum: 0}
            quarantined: {type: integer, minimum: 0}
            orphan: {type: integer, minimum: 0}
        items:
          type: array
          items:
            type: object
            required: [id, kind, tier, status]
            additionalProperties: true
            properties:
              id: {type: string}
              kind: {type: string}
              tier: {type: integer, minimum: 1, maximum: 3}
              survival: {type: boolean}
              status: {type: string, enum: [verified, stale, missing, skipped, failed, quarantined, orphan]}
              version: {type: string}
              reason: {type: string}
              code: {type: string, pattern: "^LAI-[A-Z]{3}-[0-9]{3}$"}
              verified_at: {type: string, format: date-time}
              last_reverified_at: {type: string, format: date-time}
              checked_current_at: {type: string, format: date-time}
              age_days: {type: integer, minimum: 0}
              freshness: {type: string, enum: [green, yellow, red]}
              bytes: {type: integer, minimum: 0}
              trust: {type: string, enum: [pinned, sidecar, signed_index, computed, tofu]}
        problems:
          type: array
          items:
            type: object
            required: [code, severity, title]
            additionalProperties: true
            properties:
              code: {type: string, pattern: "^LAI-[A-Z]{3}-[0-9]{3}$"}
              severity: {type: string, enum: [info, warning, error, critical]}
              item: {type: string}
              title: {type: string}

    ArkDrive:
      description: "A drive of GET /ark/drives (ark-sync.md section 3.5). `root_id` is null only when there is no usable filesystem UUID."
      type: object
      required: [root_id, device, mount, state]
      additionalProperties: true
      properties:
        root_id: {type: [string, "null"]}
        device: {type: string}
        mount: {type: [string, "null"]}
        fstype: {type: string}
        label: {type: [string, "null"]}
        size_bytes: {type: integer, minimum: 0}
        free_bytes: {type: integer, minimum: 0}
        state: {type: string, enum: [ready, read_only, unclean, not_mounted, unusable, ejecting, uninitialized]}
        read_only: {type: boolean}
        fs_errors: {type: integer, minimum: 0}
        initialized: {type: boolean}
        profile: {type: [string, "null"]}
        ready:
          type: [object, "null"]
          required: [overall, generated_at]
          additionalProperties: true
          properties:
            overall: {type: string}
            generated_at: {type: string, format: date-time}
        problems:
          type: array
          items:
            type: object
            required: [code, title]
            additionalProperties: true
            properties:
              code: {type: string, pattern: "^LAI-[A-Z]{3}-[0-9]{3}$"}
              severity: {type: string, enum: [info, warning, error, critical]}
              title: {type: string}
              fix: {type: string}
              details: {type: object, additionalProperties: true}
        detail: {type: string, description: "A plain-language note for a state that has no doctor code of its own (a damaged ROOT.json). Not translated."}

    ArkDrives:
      type: object
      required: [drives]
      additionalProperties: false
      properties:
        drives: {type: array, items: {$ref: "#/components/schemas/ArkDrive"}}

    SyncRequest:
      description: "ark-sync.md section 3.5."
      type: object
      additionalProperties: false
      properties:
        roots: {type: array, items: {type: string}, description: "Root paths or ids. Empty or absent: every writable mounted root."}
        items: {type: array, items: {type: string}, description: "Empty: the whole plan."}
        dry_run: {type: boolean, default: false}
        allow_offline_mode: {type: boolean, default: false}
        trigger: {type: string, enum: [manual, scheduled, cloud, mode_online, install, verify, import], default: manual}

    SyncAccepted:
      type: object
      required: [run_id, state, events]
      additionalProperties: false
      properties:
        run_id: {type: string, pattern: "^run-"}
        state: {type: string, enum: [running, skipped], description: "`skipped` for a scheduled run that preflight ended at once (the run is already over)."}
        reason: {type: string, description: "For state skipped: offline, mode, battery, disabled or no_roots."}
        code: {type: string, description: "For state skipped: the doctor code (LAI-SYN-001, -002, -003 or LAI-ARK-001), when there is one."}
        events: {type: string}

    SyncPlan:
      description: "The dry-run plan of one root, owned by ark-sync.md section 4.4.4 (JSON form)."
      type: object
      additionalProperties: true
      properties:
        root: {type: string}
        path: {type: string}
        profile: {type: string}
        catalog_version: {type: string}
        mode: {type: string}
        offline: {type: boolean}
        read_only: {type: boolean}
        budget_bytes: {type: integer}
        planned_bytes: {type: integer}
        fs_free_bytes: {type: integer}
        min_free_bytes: {type: integer}
        peak_bytes: {type: integer}
        free_floor_bytes: {type: integer}
        trash_bytes: {type: integer}
        items: {type: array, items: {type: object, additionalProperties: true}}
        not_for_node: {type: array, items: {type: string}}
        findings: {type: array, items: {type: object, additionalProperties: true}}

    SyncPlans:
      description: "One plan per requested root, in the order of the request (internal first)."
      type: array
      items: {$ref: "#/components/schemas/SyncPlan"}

    SyncRun:
      description: "The active or last run (ark-sync.md section 3.5)."
      type: object
      required: [run_id, trigger, state, started_at, finished_at]
      additionalProperties: true
      properties:
        run_id: {type: string, pattern: "^run-"}
        trigger: {type: string}
        state: {type: string, enum: [running, cancelling, done, cancelled, failed, skipped]}
        reason: {type: string, description: "For state skipped: offline, mode, battery, disabled or no_roots. For a cancelled run switched out of online mode: mode. For a done run stopped by max_run_hours: time_limit."}
        code: {type: string, description: "The doctor code of the end of the run (LAI-SYN-002 for a mode switch, the code of a skip or of a failed plan)."}
        result: {type: string, enum: [ok, partial, failed, cancelled, skipped], description: "Once the run has ended: ok, or partial when an item failed or was left for time, budget or disk."}
        started_at: {type: string, format: date-time}
        finished_at: {type: [string, "null"], format: date-time}
        roots: {type: array, items: {type: string}}
        totals: {type: object, additionalProperties: true}
        active: {type: array, items: {type: object, additionalProperties: true}}
        items: {type: array, items: {type: object, additionalProperties: true}, description: "What became of each item (the ended run): root, item, result (verified, skipped, failed, quarantined), version, reason, code."}
        warnings: {type: array, items: {type: string}}
        ready: {type: object, additionalProperties: {type: string}, description: "The overall READY colour of each root at the end of the run."}

    SyncCancelling:
      type: object
      required: [run_id, state]
      additionalProperties: false
      properties:
        run_id: {type: string}
        state: {type: string, enum: [cancelling, idle], description: "`idle`: no run was active, so nothing was cancelled (run_id is the last run's, or empty)."}

    VerifyRequest:
      type: object
      additionalProperties: false
      properties:
        roots: {type: array, items: {type: string}}
        items: {type: array, items: {type: string}}
        full: {type: boolean, default: false}

    ImportRequest:
      type: object
      additionalProperties: false
      properties:
        from_root: {type: string, description: "A root id. Absent means the only mounted drive; with several mounted it is 409 LAI-ARK-015 (details.roots)."}
        items: {type: array, items: {type: string}, description: "Catalog ids; empty means everything the profile wants that the drive holds."}
        add_to_profile: {type: boolean, default: false, description: "Append the named items the profile does not list to node.yaml profile_overrides. Needs items and admin* (not for a dry run)."}
        catalog: {type: boolean, default: false}
        dry_run: {type: boolean, default: false}

    EjectRequest:
      type: object
      additionalProperties: false
      properties:
        force: {type: boolean, default: false}

    Ejecting:
      type: object
      required: [state]
      additionalProperties: false
      properties:
        state: {type: string, enum: [ejecting]}

    DriveProfileRequest:
      type: object
      required: [profile]
      additionalProperties: false
      properties:
        profile: {type: string}

    DriveProfile:
      type: object
      required: [root_id, profile]
      additionalProperties: false
      properties:
        root_id: {type: string}
        profile: {type: string}

    PruneRequest:
      type: object
      additionalProperties: false
      properties:
        roots: {type: array, items: {type: string}}
        orphans: {type: boolean}
        trash: {type: boolean}
        dry_run: {type: boolean, default: false}

    PruneResult:
      type: object
      required: [deleted, refused, freed_bytes]
      additionalProperties: false
      properties:
        deleted:
          type: array
          items:
            type: object
            required: [root, item, bytes, kind]
            additionalProperties: false
            properties:
              root: {type: string}
              item: {type: string}
              version: {type: string}
              bytes: {type: integer, minimum: 0}
              kind: {type: string, enum: [orphan, trash]}
        refused:
          type: array
          items:
            type: object
            required: [root, item, reason]
            additionalProperties: false
            properties:
              root: {type: string}
              item: {type: string}
              version: {type: string}
              reason: {type: string, enum: [last_verified_copy, read_only, replacement_unverified]}
              kind: {type: string, enum: [orphan, trash]}
        freed_bytes: {type: integer, minimum: 0}

    EnsureRequest:
      type: object
      additionalProperties: false
      properties:
        dry_run: {type: boolean, default: false}
        confirm:
          description: "Step ids with status needs_confirm that the caller confirms (needs admin*)."
          type: array
          maxItems: 8
          items: {type: string, enum: [whisper.build, restart.kiwix]}

    EnsureStep:
      type: object
      required: [id, kind, status, needs_confirmation, title, detail]
      additionalProperties: false
      properties:
        id: {type: string, enum: [apt.packages, tool.kiwix-tools, tool.pmtiles, tool.piper, whisper.restore, whisper.build, restart.kiwix]}
        kind: {type: string, enum: [install_packages, install_tool, restore_whisper, build_whisper, restart_service]}
        status:
          description: "ok: nothing to do. pending: the next pass does it. waiting: the same, but ensure.auto is ask or off. needs_confirm: only with a confirmation. blocked: the kit cannot supply it (reason). running, done, failed (code), cancelled."
          type: string
          enum: [ok, pending, waiting, needs_confirm, blocked, running, done, failed, cancelled]
        target: {type: string}
        item: {type: string}
        version: {type: string}
        from: {type: string}
        packages: {type: array, items: {type: string}}
        needs_confirmation: {type: boolean}
        reason: {type: string, enum: [kit_missing, kit_damaged, not_in_kit]}
        code: {type: string, pattern: "^LAI-[A-Z]{2,3}-[0-9]{3}$"}
        error: {type: string}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        title: {type: string}
        detail: {type: string}

    EnsureView:
      type: object
      required: [state, auto, message, next_action, progress, steps, run, dry_run, checked_at]
      additionalProperties: false
      properties:
        state: {type: string, enum: [complete, installing, needs_you, off]}
        auto: {type: string, enum: ["on", ask, "off"]}
        message: {type: string}
        next_action:
          type: object
          required: [kind, text]
          additionalProperties: false
          properties:
            kind: {type: string, enum: [none, wait, press_button, confirm, sync, fix]}
            text: {type: string}
            step: {type: string}
        progress:
          type: object
          required: [done, total]
          additionalProperties: false
          properties:
            done: {type: integer, minimum: 0}
            total: {type: integer, minimum: 0}
            current: {type: string}
        steps: {type: array, items: {$ref: "#/components/schemas/EnsureStep"}}
        run:
          description: "The running pass, else the latest one; null before the first."
          type: [object, "null"]
          required: [id, trigger, dry_run, started_at]
          additionalProperties: false
          properties:
            id: {type: string}
            trigger: {type: string, enum: [sync_done, start, mode_online, manual]}
            dry_run: {type: boolean}
            started_at: {type: string, format: date-time}
            finished_at: {type: string, format: date-time}
            result: {type: string, enum: [nothing_to_do, ok, partial, failed, cancelled]}
        dry_run: {type: boolean}
        checked_at: {type: string, format: date-time}

    Catalog:
      description: "GET /catalog (agent.md section 3.8.21; catalog.md)."
      type: object
      required: [version, source, models, content]
      additionalProperties: false
      properties:
        version: {type: string}
        source: {type: string, enum: [cloud, github, offline, kit, test]}
        fetched_at: {type: [string, "null"], format: date-time}
        models: {type: array, items: {$ref: "#/components/schemas/Model"}}
        content:
          type: array
          items:
            type: object
            required: [id, kind, display_name, present, verified, in_profile, size_bytes, status]
            additionalProperties: false
            properties:
              id: {type: string}
              kind: {type: string}
              display_name: {type: string}
              present: {type: boolean}
              verified: {type: boolean}
              in_profile: {type: boolean}
              size_bytes: {type: integer, minimum: 0}
              status: {type: string}
        profiles:
          description: "Every profile of the installed catalog and the ids it includes (catalog.md section 4). `aictl profile set` shows them, with sizes from `models` and `content`, before it asks."
          type: array
          items:
            type: object
            required: [id, display_name, include, budget_bytes]
            additionalProperties: false
            properties:
              id: {type: string}
              display_name: {type: string}
              include:
                type: object
                required: [models, content]
                additionalProperties: false
                properties:
                  models: {type: array, items: {type: string}}
                  content: {type: array, items: {type: string}}
              budget_bytes: {type: integer, minimum: 0}

    CatalogRefresh:
      type: object
      required: [version, previous, changed, source]
      additionalProperties: false
      properties:
        version: {type: string}
        previous: {type: [string, "null"]}
        changed: {type: boolean}
        source: {type: string, enum: [cloud, github, offline, kit, test]}
        warnings:
          description: "Present when the router reload after a changed catalog had a problem; the catalog is installed regardless."
          type: array
          items:
            type: object
            required: [code, message]
            additionalProperties: false
            properties:
              code: {type: string, pattern: "^LAI-[A-Z]{2,3}-[0-9]{3}$"}
              message: {type: string}

    Logs:
      type: object
      required: [unit, lines, truncated]
      additionalProperties: false
      properties:
        unit: {type: string}
        lines:
          type: array
          items:
            type: object
            required: [at, priority, message]
            additionalProperties: false
            properties:
              at: {type: string, format: date-time}
              priority: {type: integer, minimum: 0, maximum: 7}
              message: {type: string}
        truncated: {type: boolean}

    Event:
      description: "The JSON in the data field of a server-sent event (agent.md section 3.10); the shape of `data` depends on `type`."
      type: object
      required: [id, type, at, node, data]
      additionalProperties: false
      properties:
        id: {type: integer, minimum: 1}
        type: {type: string}
        at: {type: string, format: date-time}
        node: {type: string}
        op_id: {type: string}
        data: {type: object, additionalProperties: true}
      examples:
        - {id: 1042, type: model.loaded, at: "2026-11-02T15:04:05Z", node: ai-n3, op_id: op_7k2m9q4r8t1c, data: {model: qwen3.5-9b-q4km, load_ms: 7100}}

    SttRequest:
      type: object
      required: [audio]
      additionalProperties: false
      properties:
        audio: {type: string, format: binary, description: "audio/wav (RIFF, PCM 16-bit or 32-bit float, 1 or 2 channels), at most 25 MiB."}
        language: {type: string, description: "auto (default), en, es or a whisper language code."}
        prompt: {type: string, maxLength: 200, description: "Whisper's initial prompt."}

    SttResponse:
      description: "Owned by companion-services.md section 3.4."
      type: object
      required: [text, language]
      additionalProperties: true
      properties:
        text: {type: string}
        language: {type: string}
        language_probability: {type: number, minimum: 0, maximum: 1}
        duration_s: {type: number, minimum: 0}
        model: {type: string}
        elapsed_ms: {type: integer, minimum: 0}

    TtsRequest:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text: {type: string, minLength: 1, description: "1 to 2000 characters after cleanup (Markdown, URLs, code blocks and emoji are removed or replaced); longer is 413 LAI-SVC-024."}
        voice: {type: [string, "null"], description: "A catalog piper model id."}
        language: {type: string, enum: [auto, en, es], default: auto}
        speed: {type: number, minimum: 0.7, maximum: 1.5, default: 1.0}

    Voices:
      type: object
      required: [voices]
      additionalProperties: false
      properties:
        voices:
          type: array
          items:
            type: object
            required: [id, language, display_name, default]
            additionalProperties: false
            properties:
              id: {type: string}
              language: {type: string}
              display_name: {type: string}
              default: {type: boolean}

    Cloud:
      description: "GET /cloud (agent.md section 3.8.26). When not enrolled only `enrolled` is guaranteed."
      type: object
      required: [enrolled]
      additionalProperties: false
      properties:
        enrolled: {type: boolean}
        url: {type: [string, "null"]}
        state: {type: string, enum: [unenrolled, registering, linked, backoff, disabled, revoked, stopped]}
        server_node_id: {type: [string, "null"]}
        name: {type: [string, "null"]}
        since: {type: [string, "null"], format: date-time}
        last_heartbeat_at: {type: [string, "null"], format: date-time}
        last_claim_at: {type: [string, "null"], format: date-time}
        last_error: {type: [string, "null"]}
        credential: {type: [string, "null"], description: "The credential, masked."}
        eligible_types: {type: array, items: {type: string}}
        server_features: {type: array, items: {type: string}}
        state_transport: {type: string, enum: [endpoint, capabilities]}
        inflight: {type: [object, "null"], additionalProperties: true}
        key_synced: {type: boolean}
        paused: {type: boolean, description: "True while a drill runs: the link sends nothing and keeps its session."}

    CloudEnrollRequest:
      type: object
      required: [url, credential]
      additionalProperties: false
      properties:
        url: {type: string}
        credential: {type: string, description: "A nod_ credential."}

    CloudEnrolled:
      type: object
      required: [state]
      additionalProperties: false
      properties:
        state: {type: string, enum: [linked, backoff, stopped]}
        server_node_id: {type: string}
        reattached: {type: boolean}
        last_error: {type: string}

    CloudUnenrolled:
      type: object
      required: [enrolled]
      additionalProperties: false
      properties:
        enrolled: {type: boolean, enum: [false]}

    ResendKeyResult:
      type: object
      required: [key_synced, fingerprint]
      additionalProperties: false
      properties:
        key_synced: {type: boolean}
        fingerprint: {type: string}

    DoctorReport:
      description: "GET /doctor (agent.md section 3.8.27)."
      type: object
      required: [ran_at, duration_ms, summary, results, passed]
      additionalProperties: false
      properties:
        ran_at: {type: string, format: date-time}
        duration_ms: {type: integer, minimum: 0}
        summary:
          type: object
          required: [ok, info, warning, error, critical]
          additionalProperties: false
          properties:
            ok: {type: integer, minimum: 0}
            info: {type: integer, minimum: 0}
            warning: {type: integer, minimum: 0}
            error: {type: integer, minimum: 0}
            critical: {type: integer, minimum: 0}
        results:
          description: "Only non-ok results."
          type: array
          items:
            type: object
            required: [check, code, severity, title, fix]
            additionalProperties: false
            properties:
              check: {type: string}
              code: {type: string, pattern: "^LAI-[A-Z]{2,3}-[0-9]{3}$"}
              severity: {$ref: "#/components/schemas/Severity"}
              title: {type: string}
              fix: {type: string}
              details: {type: object}
        passed: {type: array, items: {type: string}}

    DrillRequest:
      type: object
      additionalProperties: false
      properties:
        quick: {type: boolean, default: false}
        only: {type: array, items: {type: string}, description: "Check ids."}
        trigger: {type: string, enum: [manual, scheduled], default: manual}

    DrillAccepted:
      description: |
        The run id. A scheduled run that a precondition held back answers 202 too, with `state: skipped`,
        the doctor code and a plain reason (the document of that run says the same), and `retry_at` when
        the agent will try again (drill.md section 4.1).
      type: object
      required: [run_id]
      additionalProperties: false
      properties:
        run_id: {type: string, pattern: "^drl-"}
        state: {type: string, enum: [skipped]}
        code: {type: string, description: "LAI-DRL-002, 003, 004 or 005."}
        reason: {type: string}
        retry_at: {type: string, format: date-time}

    DrillResults:
      description: "The results document, owned by drill.md section 3.4."
      type: object
      required: [schema_version, run_id, trigger, started_at, overall]
      additionalProperties: true
      properties:
        schema_version: {type: integer}
        run_id: {type: string, pattern: "^drl-"}
        trigger: {type: string, enum: [scheduled, manual, cloud, manual_plug]}
        started_at: {type: string, format: date-time}
        finished_at: {type: [string, "null"], format: date-time}
        state: {type: string, enum: [running, skipped, aborted], description: "Absent for a run that completed."}
        overall: {type: string, enum: [pass, warn, fail, aborted, skipped, running]}
        survival_ready: {type: boolean}
        checks: {type: array, items: {type: object, additionalProperties: true}}
        code: {type: string, description: "Why a skipped or aborted run did not complete."}
        reason: {type: string}
        retry_at: {type: string, format: date-time}
        notes: {type: string, description: "A manual_plug entry only: the text the person recorded. It stays on the node."}

    DrillManualRequest:
      type: object
      required: [result]
      additionalProperties: false
      properties:
        result: {type: string, enum: [pass, fail]}
        notes: {type: string, maxLength: 2000}
        at: {type: string, format: date-time}

    DocsIndex:
      type: object
      required: [root, rendered_at, docs]
      additionalProperties: false
      properties:
        root: {type: [string, "null"]}
        rendered_at: {type: [string, "null"], format: date-time}
        docs:
          type: array
          items:
            type: object
            required: [slug, title, html]
            additionalProperties: false
            properties:
              slug: {type: string}
              title: {type: string}
              title_es: {type: string}
              html: {type: string}
              pdf: {type: string}

    Profile:
      description: "GET and PUT /profile (agent.md section 3.8.30)."
      type: object
      required: [profile, display_name, overrides, suggested, match_reasons, effective]
      additionalProperties: false
      properties:
        profile: {type: string}
        display_name: {type: string}
        overrides:
          description: "node.yaml profile_overrides, with empty lists instead of null."
          type: object
          additionalProperties: true
          properties:
            add_models: {type: array, items: {type: string}}
            remove_models: {type: array, items: {type: string}}
            add_content: {type: array, items: {type: string}}
            remove_content: {type: array, items: {type: string}}
            budget_bytes: {type: [integer, "null"], minimum: 1}
        suggested: {type: [string, "null"], description: "The profile the hardware matches; null only when the catalog has no profile that fits (not even cpu-only)."}
        match_reasons: {type: array, items: {type: string}}
        effective:
          description: "What the plan keeps after the budget (catalog.md section 4); never filtered by hardware fit."
          type: object
          required: [models, content, planned_bytes, budget_bytes]
          additionalProperties: false
          properties:
            models: {type: array, items: {type: string}}
            content: {type: array, items: {type: string}}
            skipped:
              description: "What the budget dropped, in the order it was dropped; this agent always sends it (an empty list when nothing was dropped)."
              type: array
              items:
                type: object
                required: [kind, id, reason, size_bytes]
                additionalProperties: false
                properties:
                  kind: {type: string, enum: [model, content]}
                  id: {type: string}
                  reason: {type: string, enum: [budget]}
                  size_bytes: {type: integer, minimum: 0}
            planned_bytes: {type: integer, minimum: 0}
            budget_bytes: {type: integer, minimum: 0}
        warnings:
          description: "PUT only, present when the router reload had a problem. node.yaml is already written; the next reload retries."
          type: array
          items:
            type: object
            required: [code, message]
            additionalProperties: false
            properties:
              code: {type: string, pattern: "^LAI-[A-Z]{2,3}-[0-9]{3}$"}
              message: {type: string}

    ProfileRequest:
      type: object
      additionalProperties: false
      properties:
        profile: {type: [string, "null"], minLength: 1, description: "null or absent means unchanged."}
        profile_overrides:
          description: "Replaces the whole profile_overrides block; null or absent means unchanged."
          type: [object, "null"]
          additionalProperties: false
          properties:
            add_models: {type: array, items: {type: string}}
            remove_models: {type: array, items: {type: string}}
            add_content: {type: array, items: {type: string}}
            remove_content: {type: array, items: {type: string}}
            budget_bytes: {type: [integer, "null"], minimum: 1}
    WorkloadsResponse:
      type: object
      additionalProperties: false
      required: [workloads, active]
      properties:
        workloads:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, label, models, active, fits, missing]
            properties:
              name: {type: string}
              label:
                type: object
                additionalProperties: false
                required: [en, es]
                properties:
                  en: {type: string}
                  es: {type: string}
              models: {type: array, items: {type: string}}
              active: {type: boolean}
              fits: {type: boolean}
              missing: {type: array, items: {type: string}}
        active: {type: [string, "null"]}
    WorkloadActivateRequest:
      type: object
      additionalProperties: false
      properties:
        wait: {type: boolean}
        force: {type: boolean}
    WorkloadActivated:
      type: object
      additionalProperties: false
      required: [op_id, active, loaded, unloaded]
      properties:
        op_id: {type: string}
        active: {type: string}
        loaded: {type: array, items: {type: string}}
        unloaded: {type: array, items: {type: string}}
    WorkloadAccepted:
      type: object
      additionalProperties: false
      required: [op_id]
      properties:
        op_id: {type: string}
