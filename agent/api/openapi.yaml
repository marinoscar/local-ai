openapi: 3.1.0
info:
  title: Local AI node agent API
  version: 1.0.0
  summary: The wire contract of the aiagent REST API (agent.md section 3.8).
  description: |
    Hand-written, and the contract: the local UI, the Survival Portal, ai-desktop and the cloud generate
    their TypeScript types from this file, and `internal/api/openapi_test.go` fails when a route, an auth
    level or a field exists on one side only. Workflow: docs/specs/agent.md section 4.14. A change to any
    `/api/v1` route edits the spec and this file in the same PR.

    Conventions (agent.md section 3.7):
    - Same routes on TCP `127.0.0.1:<ports.agent>` and on the unix socket `/run/localai/agent.sock`.
    - Bodies are `application/json; charset=utf-8`, except SSE (`text/event-stream`), the STT upload
      (`multipart/form-data`) and TTS (`audio/wav`).
    - A mutating request (every method except GET) must send `Content-Type: application/json`, even with
      an empty body `{}`, else `415 LAI-AGT-020`. The body limit is 1 MiB (STT 25 MiB), else `413 LAI-AGT-025`.
      Decoding is strict: an unknown field is `400 LAI-AGT-020` with `details.field`.
    - Times are RFC 3339 UTC with `Z` (`format: date-time`). Sizes are integer bytes. Durations are integers
      with an `_ms` or `_s` suffix.
    - Every response carries `X-Request-Id`. A mutating response carries `X-LocalAI-Op-Id` when an
      operation was created. `Retry-After` is set on 429 and on the 503 `LAI-AGT-024`.
    - Every non-2xx response is an `ErrorEnvelope`. `OPTIONS` is answered `405` and no `Access-Control-*`
      header is ever sent. A `405` also lists the allowed methods in `Allow` and `details.allow`.
    - `Accept-Language: es` localizes `message` and `fix`; codes and field names never change.
    - Repeating a request whose effect is already in place answers `200` with a flag (`already_loaded`),
      not an error.

    Extensions:
    - `x-localai-auth`: the level an operation requires: `none`, `op`, `portal`, `admin` or `admin*`; a list
      when several principals are accepted (`[op, portal]`). One of them is enough. Must equal the route's
      auth in `api.Routes()`.
    - `x-localai-auth-note`: free text for a restriction the level cannot express.
    - `x-localai-timeout`: the server-side handler deadline (agent.md section 3.8 column "Timeout"), informational.
    - `x-localai-status: planned`: documented, not implemented yet. It lands in the issue named by
      `x-localai-issue`, whose PR removes both extensions. A planned operation must not be registered, and a
      registered operation must not be planned (this is the allowlist the bijection test uses).
    - `x-localai-gate-exempt: true`: the mutating-route gate does not hold the route back (POST /mode/survival).
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
    description: Same origin on TCP 127.0.0.1:<ports.agent> (default 7070) and on unix:/run/localai/agent.sock.
tags:
  - {name: health, description: "Liveness."}
  - {name: auth, description: "Sessions, UI codes and the admin PIN."}
  - {name: status, description: "Node snapshot, hardware, doctor, logs and events."}
  - {name: models, description: "Models and the llama router."}
  - {name: key, description: "The llama API key."}
  - {name: mode, description: "Online, offline and survival modes."}
  - {name: ark, description: "Content roots, drives and sync (owned by ark-sync.md)."}
  - {name: catalog, description: "The catalog and the profile."}
  - {name: services, description: "Companion services and speech."}
  - {name: cloud, description: "The cloud link."}
  - {name: drill, description: "The offline-readiness drill (owned by drill.md)."}
  - {name: docs, description: "The rendered manuals index."}
  - {name: ensure, description: "Keeping the node complete: installing what the kit holds (ADR-0010)."}

paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness
      description: |
        No auth. Never touches upstreams. `ok` is true whenever the agent answers; a damaged state is
        reported as an alert, not here. `starting` stays true until startup step 17 (mutations open after
        step 12). The status is always 200. agent.md section 3.8.1.
      x-localai-auth: none
      x-localai-timeout: "2 s"
      responses:
        "200":
          description: The agent is alive.
          headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Health"}
              examples:
                online: {value: {ok: true, version: "0.1.0", mode: online, starting: false}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/Internal"}

  /session:
    post:
      tags: [auth]
      operationId: createSession
      summary: Exchange the agent token for a session cookie
      description: "Header `Authorization: Bearer lat_...`, body `{}`. Sets the cookie `localai_session` (HttpOnly, SameSite=Strict, 7 days). agent.md section 3.8.2."
      x-localai-auth: op
      x-localai-auth-note: Bearer token only; a cookie or Portal session cannot mint a session.
      x-localai-timeout: "5 s"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EmptyRequest"}
      responses:
        "204": {$ref: "#/components/responses/SessionCookie"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}
    delete:
      tags: [auth]
      operationId: deleteSession
      summary: End the session
      description: Answers 204 and clears the cookie (`Set-Cookie`, `Max-Age=0`). agent.md section 3.8.2.
      x-localai-auth: op
      x-localai-auth-note: Session cookie.
      x-localai-timeout: "5 s"
      responses:
        "204":
          description: The session ended.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
            Set-Cookie: {description: "localai_session= with Max-Age=0.", schema: {type: string}}
            Cache-Control: {description: "no-store.", schema: {type: string, enum: [no-store]}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}

  /session/code:
    post:
      tags: [auth]
      operationId: createSessionFromCode
      summary: Exchange a one-time UI code for a session cookie
      description: The code comes from `POST /ui-code`. Single use, 5 minutes. agent.md section 3.8.2.
      x-localai-auth: none
      x-localai-timeout: "5 s"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SessionCodeRequest"}
            examples:
              code: {value: {code: "482913"}}
      responses:
        "204": {$ref: "#/components/responses/SessionCookie"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401":
          $ref: "#/components/responses/Unauthenticated"
          description: "LAI-SEC-008: the code is wrong, expired or already used."
        "403": {$ref: "#/components/responses/Forbidden"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "429":
          $ref: "#/components/responses/RateLimited"
          description: "LAI-SEC-004: 5 failures in 5 minutes (global, not per client)."
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}

  /ui-code:
    post:
      tags: [auth]
      operationId: createUiCode
      summary: Mint a one-time UI code
      description: At most 3 unexpired codes exist; minting a 4th invalidates the oldest. Audit event `ui_code.mint`. agent.md section 3.8.2.
      x-localai-auth: "admin*"
      x-localai-timeout: "5 s"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EmptyRequest"}
      responses:
        "200":
          description: The code.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
            Cache-Control: {description: "no-store: the body carries a credential.", schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UiCode"}
              examples:
                code: {value: {code: "482913", expires_at: "2026-11-02T15:09:05Z"}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}

  /pin/verify:
    post:
      tags: [auth]
      operationId: verifyPin
      summary: Verify the admin PIN and get a grant
      description: |
        The grant is bound to the principal that obtained it and is sent as `X-LocalAI-Pin-Grant` on admin
        routes; it lasts 5 minutes. Audit events `pin.verify.ok` and `pin.verify.fail`. agent.md section 3.8.3.
      x-localai-auth: op
      x-localai-timeout: "5 s"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PinVerifyRequest"}
            examples:
              pin: {value: {pin: "4821"}}
      responses:
        "200":
          description: The grant.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
            Cache-Control: {description: "no-store: the body carries a credential.", schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PinGrant"}
              examples:
                grant: {value: {grant: "pg_0123456789abcdefghijklmnopqrstuvwxyzABCDEFG", expires_at: "2026-11-02T15:09:05Z"}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401":
          $ref: "#/components/responses/Unauthenticated"
          description: "LAI-SEC-001 missing credentials; LAI-SEC-003 wrong PIN (details.remaining_attempts)."
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          $ref: "#/components/responses/Conflict"
          description: "LAI-SEC-005: no PIN is set (fix: sudo aictl pin set)."
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "429":
          $ref: "#/components/responses/RateLimited"
          description: "LAI-SEC-004: too many wrong PINs; Retry-After in seconds."
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}

  /status:
    get:
      tags: [status]
      operationId: getStatus
      summary: The full node snapshot
      description: |
        Also the body pushed to the cloud (agent.md section 4.8.4), minus `alerts[].details` and
        `hardware.gpus[].processes`. Built from cached values only, so it answers within the deadline even when
        the router or Tailscale hang; a subsystem that is not available has its documented empty state (empty
        lists, `null`), never an error. Alert titles and fixes follow `Accept-Language` or `ui.language`.
        agent.md section 3.8.4.
      x-localai-auth: op
      x-localai-timeout: "5 s"
      parameters:
        - name: counters
          in: query
          description: "1 adds `node.counters` (agent.md section 7); 0 or absent leaves it out. Any other value is 400."
          schema: {type: string, enum: ["0", "1"]}
      responses:
        "200":
          description: The snapshot.
          headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Status"}
              examples:
                snapshot:
                  value:
                    node: {id: ai-n3, display_name: "HP ZBook (ai-n3)", hostname: hp-linux, profile: small-8gb, agent_version: "0.1.0", backend: cuda, llama_mode: router, llama_build: "f3586e66b-cuda", catalog_version: "2026.11.02-1", uptime_s: 86400, time: "2026-11-02T15:04:05Z"}
                    mode: {value: online, since: "2026-11-01T22:10:00Z", transition: null}
                    connectivity: {value: full, checked_at: "2026-11-02T15:04:00Z", none_since: null}
                    hardware: {gpu: "NVIDIA GeForce RTX 2070 with Max-Q Design", vram_total_mib: 8192, vram_used_mib: 6791, ram_total_mib: 14336, ram_available_mib: 5120, gpu_temp_c: 61, cpu_temp_c: 72, power: {source: ac, battery_percent: 100, charging: false, time_remaining_s: null, profile: performance}, gpus: [{index: 0, vendor: nvidia, name: "NVIDIA GeForce RTX 2070 with Max-Q Design", vram_total_mib: 8192, vram_used_mib: 6791, temp_c: 61, util_pct: 0, throttling: [], processes: [{pid: 4242, name: llama-server, vram_mib: 6581}]}]}
                    services:
                      - {name: llama, unit: "localai-llama.service", active: active, sub: running, since: "2026-11-02T08:00:05Z", restarts: 0, healthy: true}
                      - {name: whisper, unit: "localai-whisper.service", active: inactive, sub: dead, since: null, restarts: 0, healthy: false}
                    models: {default: qwen3.5-9b-q4km, loaded: [qwen3.5-9b-q4km], loading: [], present: 5, loadable: 4, models_max: 1}
                    ark:
                      roots: [{path: /srv/localai, kind: internal, status: partial, ready_pct: 82, updated_at: "2026-11-02T03:12:00Z"}]
                      drive: {mounted: false}
                      sync: {state: idle, last_success_at: "2026-11-02T03:12:00Z"}
                    cloud: {enrolled: true, state: linked, url: "https://ai.marin.cr", last_heartbeat_at: "2026-11-02T15:03:55Z"}
                    tailscale: {manage: true, pattern: B, applied: true, backend_state: Running}
                    alerts:
                      - {code: LAI-HW-012, severity: warning, title: "Running on battery", fix: "Plug in the charger. A laptop server stops when the battery runs out.", since: "2026-11-02T08:00:30Z", details: {battery_percent: 64}}
        "400":
          $ref: "#/components/responses/InvalidRequest"
          description: "LAI-AGT-020: counters is not 0 or 1 (details.field is counters)."
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/Internal"}

  /portal/status:
    get:
      tags: [status]
      operationId: getPortalStatus
      summary: The reduced, localized status of the Survival Portal
      description: |
        No auth. The schema and example are owned by survival-portal.md section 3.5 (AGENT-14 provides the
        route and the 2 s cache; PORTAL-01 the full schema and the capability model). It never contains paths, keys,
        hostnames, ids beyond model ids, or cloud details. Cached for 2 s per language and session kind.
        The language is `?lang=`, else `portal.language` (when `en` or `es`), else the profile's
        `survival.portal_language`, else `Accept-Language` or `ui.language`. `session` tells the SPA what it may
        call: `none`, `portal` (a Portal session cookie) or `full` (an operator or admin credential).
        agent.md section 3.8.5.
      x-localai-auth: none
      x-localai-timeout: "5 s"
      parameters:
        - name: lang
          in: query
          description: "en or es overrides the resolved language. Any other value is 400."
          schema: {type: string, enum: [en, es]}
      responses:
        "200":
          description: The Portal status.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            Cache-Control: {description: "no-store: the body is rebuilt at most every 2 s and must not be kept by a cache.", schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PortalStatusV1"}
              examples:
                survival:
                  value:
                    schema_version: 1
                    generated_at: "2026-11-02T14:05:11Z"
                    node_id: ai-n3
                    mode: survival
                    language: es
                    emergency_number: "911"
                    session: portal
                    power: {on_ac: false, battery_pct: 72, minutes_left: 145, state: discharging, low: false, critical: false}
                    clock_ok: true
                    brain:
                      loaded: [{id: qwen3.5-9b-q4km, display_name: "Qwen 3.5 9B", roles: [chat, reasoning, coder], vision: false}]
                      loading: null
                      choices:
                        - {id: qwen3.5-9b-q4km, display_name: "Qwen 3.5 9B", summary: "Asistente general rápido", roles: [chat], vision: false, loadable: true, survival: true}
                    capabilities:
                      chat: {state: ready}
                      photo: {state: degraded, reason: needs_switch, vision_model: qwen3.5-4b-q4km}
                      talk: {state: ready, stt: true, tts_languages: [en, es]}
                      library: {state: ready, books: [{content_id: wikimed-en, title: "WikiMed (English)", book: mdwiki_en_all, lang: en}]}
                      maps: {state: ready, search: true, gps: false}
                      manuals: {state: ready, items: [{id: 01-survival-mode, title: "Modo supervivencia", url: /docs/01-survival-mode.html}]}
                    first_aid: []
                    ark: {overall: yellow, survival_capable: true, drive_connected: true}
                    alerts: [{code: LAI-SVC-013, severity: info, title: "El reconocimiento de voz usa el procesador.", fix: "Nada que hacer."}]
        "400":
          $ref: "#/components/responses/InvalidRequest"
          description: "LAI-AGT-020: lang is not en or es (details.field is lang)."
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/Internal"}

  /hardware:
    get:
      tags: [status]
      operationId: getHardware
      summary: Hardware sample
      description: GPU UUIDs and serial numbers are never collected. agent.md section 3.8.6.
      x-localai-auth: op
      x-localai-timeout: "10 s"
      parameters:
        - name: fresh
          in: query
          description: "1 forces a new sample, at most one per 2 s across all clients (a request inside the window gets the previous forced sample, never an error); 0 or absent answers the cached snapshot. Any other value is 400. API clients only."
          schema: {type: string, enum: ["0", "1"]}
      responses:
        "400":
          $ref: "#/components/responses/InvalidRequest"
          description: "LAI-AGT-020: fresh is not 0 or 1 (details.field is fresh)."

        "200":
          description: The sample.
          headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Hardware"}
              examples:
                nvidia:
                  value:
                    sampled_at: "2026-11-02T15:04:00Z"
                    gpus:
                      - {index: 0, vendor: nvidia, name: "NVIDIA GeForce RTX 2070 with Max-Q Design", backend: cuda, compute_cap: "7.5", driver: "595.99.02", unified_memory: false, vram_total_mib: 8192, vram_used_mib: 6791, vram_used_by_others_mib: 210, temp_c: 61, util_pct: 0, power_w: 1.46, throttling: [], processes: [{pid: 4242, name: llama-server, vram_mib: 6581}]}
                    ram: {total_mib: 14336, available_mib: 5120, swap_total_mib: 4096, swap_free_mib: 4000}
                    disks:
                      - {path: /srv/localai, role: internal_root, fs: ext4, total_bytes: 342000000000, free_bytes: 293000000000}
                      - {path: /var/lib/localai, role: state, fs: ext4, total_bytes: 342000000000, free_bytes: 293000000000}
                    power: {source: ac, battery_percent: 100, charging: false, time_remaining_s: null, profile: performance}
                    thermal: {cpu_temp_c: 72, cpu_throttle_events: 0, zones: [{type: x86_pkg_temp, temp_c: 72}]}
                    cpu: {model: "Intel(R) Core(TM) i7-10850H CPU @ 2.70GHz", cores: 12, load1: 0.4}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/Internal"}

  /models:
    get:
      tags: [models]
      operationId: listModels
      summary: Catalog models merged with local state
      description: "All engines. `?loadable=1` keeps `loadable: true`; `?engine=llama` filters by engine. agent.md section 3.8.7."
      x-localai-auth: op
      x-localai-timeout: "5 s"
      parameters:
        - {name: loadable, in: query, schema: {type: string, enum: ["0", "1"]}, description: "1 keeps the models with loadable true; 0 or absent keeps all."}
        - {name: engine, in: query, schema: {type: string, enum: [llama, whisper, piper]}, description: "Keeps one engine."}
      responses:
        "200":
          description: The models.
          headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ModelList"}
              examples:
                two:
                  value:
                    models_max: 1
                    default: qwen3.5-9b-q4km
                    models:
                      - {id: qwen3.5-9b-q4km, display_name: "Qwen 3.5 9B", summary: "Fast general assistant", engine: llama, roles: [chat, reasoning, coder], survival_tier: 1, in_profile: true, size_bytes: 5868826976, present: true, verified: true, locations: [{root: /srv/localai, complete: true, verified_at: "2026-11-02T03:10:00Z"}], loadable: true, loadable_reason: null, status: loaded, loaded: true, default: true, aliases: [qwen3.5-9b], requirements: {backends: [cuda, vulkan, cpu], min_vram_mib: 6400, min_ram_mib: 8192}, last_load_ms: 7100}
                      - {id: qwen3.6-35b-a3b-q4km, display_name: "Qwen 3.6 35B A3B", engine: llama, in_profile: false, present: false, verified: false, locations: [], loadable: false, loadable_reason: {code: LAI-CAT-005, message: "Needs 11.0 GB of graphics memory; this computer has 8.0 GB."}, status: absent, loaded: false, default: false, aliases: []}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/Internal"}

  /models/default:
    put:
      tags: [models]
      operationId: setDefaultModel
      summary: Set the default model
      description: |
        The model must be `present` and `loadable` (422 otherwise). Sets `state.models.default`, regenerates
        `models.ini` (`load-on-startup`) and tells the router under the reload-safety rule, so a running
        model whose preset did not change stays loaded; it never loads or unloads a model. `previous` is
        the default in force before (the recorded one, else the profile's), `null` when there was none.
        `ini_regenerated` is false when the file already said this. llama-router.md section 4.6.
        agent.md section 3.8.10. Audit `model.set_default`.
      x-localai-auth: op
      x-localai-timeout: "5 s"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DefaultModelRequest"}
            examples:
              default: {value: {id: qwen3.5-9b-q4km}}
      responses:
        "200":
          description: The new default.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DefaultModelResponse"}
              examples:
                changed: {value: {default: qwen3.5-9b-q4km, previous: small-vlm-q4km, ini_regenerated: true}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422":
          $ref: "#/components/responses/Unprocessable"
          description: "LAI-CAT-005 the model does not fit, or the engine is not llama; LAI-LLM-008 its files are missing or unverified."
        "500":
          $ref: "#/components/responses/Internal"
          description: "LAI-LLM-007 the model list could not be written, so the default was not changed; LAI-AGT-099 a bug."
        "503": {$ref: "#/components/responses/Starting"}
        "504":
          $ref: "#/components/responses/GatewayTimeout"
          description: "LAI-AGT-099 with details.reason deadline_exceeded: the handler ran past its 5 s deadline."

  /models/{id}:
    parameters:
      - {$ref: "#/components/parameters/ModelId"}
    get:
      tags: [models]
      operationId: getModel
      summary: One model, with its files and router preset
      description: Like a `GET /models` entry plus `files` and `preset`. An unknown id is `404 LAI-AGT-021`. agent.md section 3.8.7.
      x-localai-auth: op
      x-localai-timeout: "5 s"
      responses:
        "200":
          description: The model.
          headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Model"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/Internal"}
    delete:
      tags: [models]
      operationId: deleteModel
      summary: Delete a model's files
      description: |
        Query `root` (default all roots) and `keep_last` (default true). A loaded model is refused
        (409 LAI-AGT-022, "Unload it first"). With `keep_last=true` it refuses to remove the last verified copy
        across all mounted roots (409 LAI-SYN-044). Audit `model.delete`. agent.md section 3.8.12.
      x-localai-auth: admin
      x-localai-timeout: "60 s"
      parameters:
        - {name: root, in: query, schema: {type: string}, description: "A content root path or root id."}
        - {name: keep_last, in: query, schema: {type: boolean, default: true}}
      responses:
        "200":
          description: What was deleted.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DeleteModelResponse"}
              examples:
                deleted: {value: {id: qwen3.5-9b-q4km, deleted: [{root: /srv/localai, bytes: 5868826976}], op_id: op_7k2m9q4r8t1c}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          $ref: "#/components/responses/Conflict"
          description: "LAI-AGT-022 another model operation is running (details.op_id), or the model is loaded (details.reason loaded); LAI-SYN-044 the last verified copy would be removed."
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}
        "504":
          $ref: "#/components/responses/GatewayTimeout"
          description: "LAI-AGT-099 with details.reason deadline_exceeded: the delete ran past its 60 s deadline."

  /models/{id}/load:
    parameters:
      - {$ref: "#/components/parameters/ModelId"}
    post:
      tags: [models]
      operationId: loadModel
      summary: Load a model
      description: |
        Orchestration: llama-router.md section 4.4. The body is optional; `wait` and `unload_others` default
        to true. With `wait: false` it answers 202 as soon as the load is planned and progress arrives on
        `/events` (`model.loading`, `model.loaded`, `model.failed`, with the same `op_id`). A Portal session
        may only load `loadable` models and its body is forced to `wait: false` with the planner deciding
        what to unload (survival-portal.md section 3.3). A failed load is rolled back to the previous
        models (`details.rolled_back`, `details.restored`). `warning` is present when the load went ahead
        although other programs hold much of the memory (LAI-HW-005, LAI-HW-006). Audit `model.load`.
        agent.md section 3.8.8.
      x-localai-auth: [op, portal]
      x-localai-auth-note: "Portal: restricted to loadable models, body forced (survival-portal.md section 3.3)."
      x-localai-timeout: "load_timeout x (n+2) + 30 s"
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoadRequest"}
            examples:
              defaults: {value: {wait: true, unload_others: true}}
      responses:
        "200":
          description: Loaded (or already loaded).
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ModelLoaded"}
              examples:
                loaded: {value: {id: qwen3.5-9b-q4km, status: loaded, already_loaded: false, load_ms: 7100, unloaded: [small-vlm-q4km], op_id: op_7k2m9q4r8t1c}}
        "202":
          description: "Loading started (`wait: false`)."
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ModelLoading"}
              examples:
                loading: {value: {id: qwen3.5-9b-q4km, status: loading, op_id: op_7k2m9q4r8t1c}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          $ref: "#/components/responses/Conflict"
          description: "LAI-AGT-022 another model operation is running (details.op_id); LAI-LLM-011 unload_others is false and there is no room."
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422":
          $ref: "#/components/responses/Unprocessable"
          description: "LAI-CAT-005 does not fit, backend unsupported, or the engine is not llama; LAI-LLM-008 files missing or unverified."
        "500":
          $ref: "#/components/responses/Internal"
          description: "LAI-LLM-009 the load failed and the previous model was restored (details.rolled_back, details.restored, details.cause, details.exit_code); LAI-LLM-012 no model could be loaded, not even the previous one; LAI-LLM-007 the router does not list the model; LAI-AGT-099 a bug."
        "502":
          $ref: "#/components/responses/BadGateway"
          description: "LAI-LLM-004: the router is running but not answering; LAI-LLM-005: it rejects this node's key."
        "503": {$ref: "#/components/responses/Starting"}
        "504":
          $ref: "#/components/responses/GatewayTimeout"
          description: "LAI-LLM-010: the load timed out and the previous model was restored."

  /models/{id}/unload:
    parameters:
      - {$ref: "#/components/parameters/ModelId"}
    post:
      tags: [models]
      operationId: unloadModel
      summary: Unload a model
      description: |
        Unloading the default model is allowed. In survival mode, unloading the last loaded LLM answers
        `409 LAI-AGT-023` unless `force` is true. A model that is not running answers `already_unloaded`.
        If the router still reports the model running after 60 s, llama is restarted, the other models
        are loaded again and LAI-LLM-031 is raised; the answer is then 200 with `restarted` and
        `restored`. llama-router.md section 4.5. Audit `model.unload`. agent.md section 3.8.9.
      x-localai-auth: op
      x-localai-timeout: "90 s"
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UnloadRequest"}
      responses:
        "200":
          description: Unloaded (or already unloaded).
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ModelUnloaded"}
              examples:
                unloaded: {value: {id: qwen3.5-9b-q4km, status: unloaded, already_unloaded: false, op_id: op_7k2m9q4r8t1c}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          $ref: "#/components/responses/Conflict"
          description: "LAI-AGT-022 another model operation is running (details.op_id); LAI-AGT-023 survival mode and this is the last loaded LLM (send force)."
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422":
          $ref: "#/components/responses/Unprocessable"
          description: "LAI-CAT-005 the model is not a llama model."
        "500":
          $ref: "#/components/responses/Internal"
          description: "LAI-LLM-012 the model would not stop, llama was restarted and no model could be loaded afterwards; LAI-AGT-099 a bug."
        "502":
          $ref: "#/components/responses/BadGateway"
          description: "LAI-LLM-004: the router is running but not answering, or the model would not stop and llama could not be restarted; LAI-LLM-005: it rejects this node's key."
        "503": {$ref: "#/components/responses/Starting"}
        "504":
          $ref: "#/components/responses/GatewayTimeout"
          description: "LAI-LLM-031: the model would not stop in time."

  /models/{id}/download:
    parameters:
      - {$ref: "#/components/parameters/ModelId"}
    post:
      tags: [models]
      operationId: downloadModel
      summary: Queue a model download through the sync engine
      description: |
        Delegates to the sync engine with `items: [id]` (ark-sync.md). Default roots: the internal root, plus
        the drive if its profile includes the model. agent.md section 3.8.11.
      x-localai-auth: op
      x-localai-timeout: "10 s"
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DownloadRequest"}
      responses:
        "202":
          description: Queued.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DownloadAccepted"}
              examples:
                queued: {value: {id: qwen3.5-9b-q4km, sync_run_id: "run-20261102T031500Z-a1f3", queued: true}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          $ref: "#/components/responses/Conflict"
          description: "LAI-SYN-010 survival mode; LAI-AGT-023 offline mode without allow_offline_mode; LAI-SYN-005 a run is already active."
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422":
          $ref: "#/components/responses/Unprocessable"
          description: "LAI-ARK-001: there is no writable content root."
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}

  /key:
    get:
      tags: [key]
      operationId: getKey
      summary: The llama API key
      description: |
        The only route that returns the full llama key. Writes audit `key.show` with the principal.
        `Cache-Control: no-store`. Snippets embed `$KEY` placeholders, never the key. agent.md section 3.8.13.
        There is deliberately no example: a 64-hex key literal in the repository trips scripts/check-redaction.sh.
      x-localai-auth: op
      x-localai-timeout: "5 s"
      responses:
        "200":
          description: The key and how to use it.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            Cache-Control: {description: "no-store.", schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Key"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/Internal"}

  /key/rotate:
    post:
      tags: [key]
      operationId: rotateKey
      summary: Rotate the llama API key
      description: |
        Generates a new key, writes `/etc/localai/api-key` atomically, restarts llama (unless `restart` is
        false), restores `models.desired_loaded` and pushes the key to the cloud. If the llama restart
        fails the new key stays and the answer is `500 LAI-LLM-001` with `details.key_rotated: true`.
        Audit `key.rotate`. agent.md section 3.8.14.
      x-localai-auth: admin
      x-localai-timeout: "15 min"
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/KeyRotateRequest"}
      responses:
        "200":
          description: Rotated.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KeyRotated"}
              examples:
                rotated:
                  value:
                    fingerprint: "c0de...77aa"
                    rotated_at: "2026-11-02T15:10:00Z"
                    cloud_synced: true
                    restored_models: [qwen3.5-9b-q4km]
                    clients_to_update: ["OpenCode on this computer: ~/.config/opencode/llama-api-key", "Any script that uses the old key directly"]
                    op_id: op_7k2m9q4r8t1c
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          $ref: "#/components/responses/Conflict"
          description: "LAI-AGT-022: another model operation is running (details.op_id); the old key stays."
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "500":
          $ref: "#/components/responses/Internal"
          description: "LAI-LLM-001: the llama restart failed; the new key stays (details.key_rotated is true, details.fingerprint names it). LAI-AGT-099: a bug, or the key file could not be written (details.key_rotated is false and the old key stays)."
        "502":
          $ref: "#/components/responses/BadGateway"
          description: "LAI-LLM-004: the router did not answer while the models were restored; the new key stays (details.key_rotated is true)."
        "503": {$ref: "#/components/responses/Starting"}
        "504":
          $ref: "#/components/responses/GatewayTimeout"
          description: "LAI-AGT-099 with details.reason deadline_exceeded: the handler ran past its 15 min deadline; a rotation that already wrote the key stays."

  /mode:
    get:
      tags: [mode]
      operationId: getMode
      summary: The current mode
      description: agent.md section 3.8.15.
      x-localai-auth: op
      x-localai-timeout: "5 s"
      responses:
        "200":
          description: The mode.
          headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Mode"}
              examples:
                online: {value: {mode: online, since: "2026-11-01T22:10:00Z", transition: null, allowed_targets: [offline, survival], leave_requires_admin: false, connectivity: full, suggest_survival: false}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/Internal"}
    post:
      tags: [mode]
      operationId: setMode
      summary: Request a mode transition
      description: |
        `reapply: true` re-runs every step of the current mode's transition even when `target` equals the
        current mode; without it a same-target request answers `200 {already: true}`. Cloud principals may only
        request `offline`. agent.md section 3.8.15.
      x-localai-auth: op
      x-localai-auth-note: "admin* is required to leave survival (LAI-SEC-002)."
      x-localai-timeout: "20 min if wait, else 5 s"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ModeRequest"}
            examples:
              offline: {value: {target: offline, wait: false, reapply: false}}
      responses:
        "200":
          description: "Done (`wait: true`), or already in the target mode."
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: "#/components/schemas/ModeDone"}
                  - {$ref: "#/components/schemas/ModeAlready"}
              examples:
                done: {value: {op_id: op_7k2m9q4r8t1c, from: online, mode: offline, warnings: []}}
                already: {value: {mode: offline, already: true}}
        "202":
          description: The transition started.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ModeAccepted"}
              examples:
                started: {value: {op_id: op_7k2m9q4r8t1c, from: online, target: offline, transition: {step: link_stop, started_at: "2026-11-02T15:04:05Z"}}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403":
          $ref: "#/components/responses/Forbidden"
          description: "LAI-SEC-002: leaving survival needs admin*; plus the generic 403 codes."
        "409":
          $ref: "#/components/responses/Conflict"
          description: "LAI-AGT-022 another transition is running (a request for survival preempts it); with `wait: true`, also the answer to a transition that survival preempted (`details.preempted` is true, `details.op_id` is the survival operation)."
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}

  /mode/survival:
    post:
      tags: [mode]
      operationId: enterSurvival
      summary: Enter survival mode
      description: |
        No auth, loopback only, still subject to the Host and Origin checks. The Content-Type is still
        required. Before startup step 12 and during shutdown the request is queued (`pending_mode` in
        state.json) and answered `202` with `queued: true`. It never refuses for any other reason, so it
        has no 503. agent.md section 3.8.16.
      x-localai-auth: none
      x-localai-timeout: "5 s"
      x-localai-gate-exempt: true
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SurvivalRequest"}
            examples:
              plain: {value: {}}
      responses:
        "200":
          description: Already in survival mode.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SurvivalAlready"}
              examples:
                already: {value: {mode: survival, already: true}}
        "202":
          description: The transition started, or the request was queued.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SurvivalAccepted"}
              examples:
                started: {value: {op_id: op_7k2m9q4r8t1c, target: survival}}
                queued: {value: {op_id: op_7k2m9q4r8t1c, target: survival, queued: true}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "500": {$ref: "#/components/responses/Internal"}

  /ark:
    get:
      tags: [ark]
      operationId: getArk
      summary: The readiness report of every mounted root
      description: |
        Shape owned by ark-sync.md section 3.5 and 4.12.1. agent.md section 3.8.17. One report per mounted
        content root, internal first: the `READY.json` of the root, with the title of every problem in the
        language of the request (Accept-Language, else `ui.language`). The report of a read-only root is
        computed and kept in memory, never written to the drive. A node with no mounted root answers an
        empty list.
      x-localai-auth: op
      x-localai-timeout: "10 s"
      responses:
        "200":
          description: One READY.json per mounted root.
          headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ArkRoots"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/Internal"}

  /ark/drives:
    get:
      tags: [ark]
      operationId: listArkDrives
      summary: Detected AI-ARK drives
      description: |
        Shape owned by ark-sync.md section 3.5 and 4.1.2. agent.md section 3.8.17. Every drive whose
        filesystem label is exactly `AI-ARK`, mounted or only plugged in: the mounted ones in mount
        order (the best-copy order), then the ones that are not mounted. `problems[].title` and `.fix`
        are in the language of the request (Accept-Language, else `ui.language`). `root_id` is null
        only when there is no usable filesystem UUID (a drive that is not ext4); `mount` is null for a
        drive that is not mounted; `ready` is null until a readiness report exists for the root. A node
        with no AI-ARK drive answers an empty list.
      x-localai-auth: op
      x-localai-timeout: "10 s"
      responses:
        "200":
          description: The drives.
          headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ArkDrives"}
              examples:
                two:
                  value:
                    drives:
                      - {root_id: ark-3f9c0a12, device: /dev/sdb1, mount: /media/operator/AI-ARK, fstype: ext4, label: AI-ARK, size_bytes: 2000398934016, free_bytes: 812345678901, state: ready, read_only: false, fs_errors: 0, initialized: true, profile: ark-drive-full, ready: {overall: yellow, generated_at: "2026-11-01T04:02:10Z"}, problems: []}
                      - {root_id: null, device: /dev/sdc1, mount: /media/operator/AI-ARK1, fstype: exfat, label: AI-ARK, state: unusable, problems: [{code: LAI-ARK-002, title: "This drive is not formatted as ext4"}]}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/Internal"}

  /ark/sync:
    post:
      tags: [ark]
      operationId: startArkSync
      summary: Start a sync run
      description: |
        `roots` empty or absent means every writable mounted root; `items` empty means the whole plan. With
        `dry_run: true` the answer is `200` with one plan per root and nothing is written (the dry run needs no
        run slot and is allowed in every mode). Until the run engine is wired a real start answers `503`. The agent
        only routes; schemas and errors are owned by ark-sync.md section 3.5. agent.md section 3.8.18.
      x-localai-auth: op
      x-localai-timeout: "10 s"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SyncRequest"}
            examples:
              manual: {value: {roots: [], items: [], dry_run: false, allow_offline_mode: false, trigger: manual}}
      responses:
        "200":
          description: "One plan per root (`dry_run: true`)."
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SyncPlans"}
        "202":
          description: The run started.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SyncAccepted"}
              examples:
                running: {value: {run_id: "run-20261102T031500Z-a1f3", state: running, events: "/api/v1/events?types=sync.*"}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          $ref: "#/components/responses/Conflict"
          description: "LAI-SYN-010 survival mode; LAI-SYN-011 offline mode without allow_offline_mode; LAI-SYN-005 a run is already active (details.run_id); LAI-ARK-001 no writable content root."
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422":
          $ref: "#/components/responses/Unprocessable"
          description: "LAI-CAT-003 the profile of a root is not in the catalog (dry run)."
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}
    get:
      tags: [ark]
      operationId: getArkSync
      summary: The active or last sync run
      description: |
        The active run, or the last one (it survives an agent restart). `totals.rate_bps` and `eta_s` are 0
        once the run has ended. Shape owned by ark-sync.md section 3.5. agent.md section 3.8.18.
      x-localai-auth: op
      x-localai-timeout: "10 s"
      responses:
        "200":
          description: The run.
          headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SyncRun"}
              examples:
                running:
                  value:
                    run_id: "run-20261102T031500Z-a1f3"
                    trigger: scheduled
                    state: running
                    started_at: "2026-11-02T03:15:02Z"
                    finished_at: null
                    roots: [internal, ark-3f9c0a12]
                    totals: {items: 31, done: 22, skipped: 6, failed: 0, bytes_total: 61234567890, bytes_done: 40211223344, rate_bps: 18874368, eta_s: 1105}
                    active: [{root: ark-3f9c0a12, item: wikipedia-en-maxi, state: downloading, version: "2026-10", bytes_done: 61200000000, bytes_total: 110000000000, rate_bps: 18874368, attempt: 1}]
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          $ref: "#/components/responses/NotFound"
          description: "LAI-AGT-021: no run has happened yet."
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}
    delete:
      tags: [ark]
      operationId: cancelArkSync
      summary: Cancel the active run
      description: |
        Idempotent. Every active transfer stops at the next 1 MiB boundary and checkpoints, leaving its `.part`
        files for the next run. With no run active the answer is still `202`, with the state `idle` and the id
        of the last run (empty when there never was one). agent.md section 3.8.18.
      x-localai-auth: op
      x-localai-timeout: "10 s"
      responses:
        "202":
          description: Cancelling.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SyncCancelling"}
              examples:
                cancelling: {value: {run_id: "run-20261102T031500Z-a1f3", state: cancelling}}
                idle: {value: {run_id: "run-20261102T031500Z-a1f3", state: idle}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}

  /ark/verify:
    post:
      tags: [ark]
      operationId: verifyArk
      summary: Re-verify content (bit rot)
      description: |
        Starts a run of trigger `verify` that re-hashes what is stored, oldest `last_reverified_at` first, and
        shares the run slot with sync (`409 LAI-SYN-005`). It reads local disks only, so it is allowed in every
        mode. Without `full` and `items` it checks the copies not checked in `sync.reverify_days`, within
        `sync.reverify_budget_minutes`; `full: true` checks everything with no budget; a named item is checked
        whatever its age. A copy that no longer matches its MANIFEST is `LAI-SYN-025`: on a writable root it is
        moved to quarantine (an older version in `.trash` is put back first), on a read-only root it is excluded
        in memory and nothing is written. ark-sync.md sections 3.5 and 4.13. agent.md section 3.8.19.
      x-localai-auth: op
      x-localai-timeout: "10 s"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VerifyRequest"}
            examples:
              quick: {value: {roots: [], items: [], full: false}}
      responses:
        "202":
          description: The run started.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SyncAccepted"}
              examples:
                run: {value: {run_id: "run-20261102T031500Z-a1f3", state: running, events: "/api/v1/events?types=sync.*"}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          $ref: "#/components/responses/Conflict"
          description: "LAI-SYN-005: a run is already active (details.run_id). LAI-ARK-001: no root can be read."
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}

  /ark/import:
    post:
      tags: [ark]
      operationId: importArk
      summary: Import content from another root
      description: |
        Copies verified items from an AI-ARK drive to the internal root. Works in every mode (no network is
        used, and the downloader of an import refuses every dial). With `dry_run: true` the answer is `200`
        with the plan (a list with the plan of the internal root; nothing is written) and no run slot is
        taken. `from_root` absent and several drives mounted is `409 LAI-ARK-015` with `details.roots`.
        `catalog: true` installs the drive's catalog first when it is newer and valid (an invalid one is
        `LAI-CAT-002` in the run's `warnings` and the import goes on). An item the profile does not list is
        refused (`not_in_profile`) unless `add_to_profile` is set, which needs `items` and admin* (`403`
        with `details.pin_required` for an operator without the PIN; not needed for a dry run). The run has
        trigger `import`. A Portal session (the **Copy from the AI-ARK drive** button) has its body ignored and
        replaced by the safe default: a real import of the profile's items from the first connected drive
        that can be read (several drives are never `LAI-ARK-015`; none is `409 LAI-SVC-118`), no catalog, no
        `add_to_profile`, never a dry run; 3 per hour per session (`429 LAI-SVC-117`). An import never
        deletes anything. ark-sync.md sections 3.5 and 4.14. agent.md section 3.8.20. survival-portal.md
        section 3.3.
      x-localai-auth: [op, portal]
      x-localai-auth-note: "Portal: body ignored and replaced by the safe default (first usable drive, profile items, nothing deleted), 3 per hour (survival-portal.md section 3.3)."
      x-localai-timeout: "10 s"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ImportRequest"}
            examples:
              import: {value: {from_root: ark-3f9c0a12, items: [], add_to_profile: false, catalog: false, dry_run: false}}
      responses:
        "200":
          description: "The plan (`dry_run: true`)."
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/SyncPlan"}
        "202":
          description: The run started.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SyncAccepted"}
              examples:
                run: {value: {run_id: "run-20261102T031500Z-b7c2", state: running, events: "/api/v1/events?types=sync.*"}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          $ref: "#/components/responses/Conflict"
          description: "LAI-SYN-005 a run is already active (details.run_id); LAI-ARK-015 several drives are mounted and from_root is absent (details.roots); LAI-ARK-004 the drive is unclean; LAI-ARK-001 the internal root cannot be written; LAI-SVC-118 (Portal session) no AI-ARK drive that can be read is connected."
        "422":
          $ref: "#/components/responses/Unprocessable"
          description: "LAI-CAT-003: the profile of the internal root is not in the catalog."
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "429":
          $ref: "#/components/responses/RateLimited"
          description: "LAI-SVC-117: a Portal session made 3 imports in the last hour (Retry-After)."
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}

  /ark/drives/{root_id}/eject:
    parameters:
      - {$ref: "#/components/parameters/RootId"}
    post:
      tags: [ark]
      operationId: ejectArkDrive
      summary: Safely eject a drive
      description: |
        Stops using the drive, syncs, flushes and unmounts. The checks (the agent's own transfers, the drive
        users such as the router, and a walk of `/proc/*/fd` and `/proc/*/cwd`) run before the answer: if
        something still uses the drive the answer is `409 LAI-ARK-009` with the blockers and the drive goes back
        to the state it had. Otherwise the answer is `202` and the unmount (`syncfs`, `umount`, power-off)
        follows; the event `drive.unmounted` with `safe_to_unplug: true` says the drive can be unplugged. If that
        unmount then fails, the drive goes back to its state, no event is published and `LAI-ARK-009` is raised
        as an alert. `force: true` unloads models whose only copy is on the drive instead of refusing; it
        never overrides a program that has a file open. A drive that is mounted but not set up (state
        `uninitialized`) can be ejected too. ark-sync.md section 3.5 and 4.1.5. agent.md section 3.8.20a.
      x-localai-auth: op
      x-localai-timeout: "60 s"
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EjectRequest"}
      responses:
        "202":
          description: Ejecting.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Ejecting"}
              examples:
                ejecting: {value: {state: ejecting}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          $ref: "#/components/responses/Conflict"
          description: "LAI-ARK-009: something still uses the drive (details.blockers: kind process, model or sync, name, pid). LAI-AGT-020: the drive is not mounted, or is already ejecting (details.state). LAI-AGT-022: another action is running on the drive."
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}

  /ark/drives/{root_id}/init:
    parameters:
      - {$ref: "#/components/parameters/RootId"}
    post:
      tags: [ark]
      operationId: initArkDrive
      summary: Initialize an empty AI-ARK filesystem
      description: |
        Creates `localai/` with the full layout and a valid `ROOT.json` (kind `ark_drive`, the default drive
        profile), then writes the drive extras (`START-HERE.html`, the inventory copy). Only for a drive in
        state `uninitialized`; any other state is `409 LAI-AGT-020` with `details.state`. Refused (the same
        code, `details.reason: localai_exists`) if `<mount>/localai` already holds anything; an empty
        directory counts as none. It never formats and never removes anything. ark-sync.md section 3.5.
        agent.md section 3.8.20a.
      x-localai-auth: op
      x-localai-timeout: "60 s"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EmptyRequest"}
      responses:
        "200":
          description: The drive, now `ready`.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ArkDrive"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          $ref: "#/components/responses/Conflict"
          description: "LAI-AGT-020: the drive is not uninitialized (details.state), or localai/ already holds content (details.reason localai_exists). LAI-AGT-022: another action is running on the drive. LAI-ARK-003, LAI-ARK-014, LAI-SYN-040: the drive could not be written (read-only, I/O error, full)."
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}

  /ark/drives/{root_id}/mount:
    parameters:
      - {$ref: "#/components/parameters/RootId"}
    post:
      tags: [ark]
      operationId: mountArkDrive
      summary: Mount a detected but unmounted AI-ARK filesystem
      description: |
        Runs `udisksctl mount --no-user-interaction -b <device>` for a plugged-in AI-ARK filesystem that is not
        mounted. Only for state `not_mounted`; other states are `409 LAI-AGT-020` with `details.state`. A mount
        udisksctl refuses is `409 LAI-ARK-005` with `details.reason` and `details.error`. The agent never
        mounts a drive on its own. ark-sync.md section 3.5. agent.md section 3.8.20a.
      x-localai-auth: op
      x-localai-timeout: "60 s"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EmptyRequest"}
      responses:
        "200":
          description: The drive, once mountinfo shows the mount.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ArkDrive"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          $ref: "#/components/responses/Conflict"
          description: "LAI-AGT-020: the drive is not in state not_mounted (details.state). LAI-ARK-005: udisksctl could not mount it (details.reason, details.error). LAI-AGT-022: another action is running on the drive."
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}

  /ark/drives/{root_id}/profile:
    parameters:
      - {$ref: "#/components/parameters/RootId"}
    put:
      tags: [ark]
      operationId: setArkDriveProfile
      summary: Set the profile a drive follows
      description: |
        Checks the profile id against the catalog and writes it into the drive's `ROOT.json`; keys the agent
        does not know are kept. The drive must be mounted, set up and writable (`409 LAI-AGT-020` with
        `details.state`, or `409 LAI-ARK-003` for a read-only drive). ark-sync.md section 3.5. agent.md section
        3.8.20a.
      x-localai-auth: admin
      x-localai-timeout: "60 s"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DriveProfileRequest"}
            examples:
              full: {value: {profile: ark-drive-full}}
      responses:
        "200":
          description: The profile is set.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DriveProfile"}
              examples:
                set: {value: {root_id: ark-3f9c0a12, profile: ark-drive-full}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          $ref: "#/components/responses/Conflict"
          description: "LAI-AGT-020: the drive is not mounted, not set up or ejecting (details.state). LAI-ARK-003: the drive is read-only. LAI-CAT-001: no catalog is loaded (details.reason no_catalog). LAI-AGT-022: another action is running on the drive."
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422":
          $ref: "#/components/responses/Unprocessable"
          description: "LAI-CAT-003: unknown profile id."
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}

  /ark/prune:
    post:
      tags: [ark]
      operationId: pruneArk
      summary: Delete orphans and trash
      description: |
        Deletes the verified copies the profile no longer wants (`orphans`) and the superseded versions in
        `.trash` (`trash`), on the writable mounted roots (or the named ones). At least one of the two is
        required. It never deletes the last verified copy of an item, however it is asked: that entry is
        listed in `refused` with `reason: last_verified_copy`, and there is no field that overrides it.
        A read-only root is never modified (`read_only`); a trash entry whose replacement is not verified
        yet stays (`replacement_unverified`). With `dry_run` nothing is deleted and `deleted` lists what a
        real run would delete. ark-sync.md sections 3.5 and 4.10. agent.md section 3.8.20a.
      x-localai-auth: admin
      x-localai-timeout: "60 s"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PruneRequest"}
            examples:
              orphans: {value: {roots: [internal], orphans: true, trash: false, dry_run: false}}
      responses:
        "200":
          description: What was (or with dry_run would be) deleted.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PruneResult"}
              examples:
                pruned:
                  value:
                    deleted: [{root: internal, item: osm-north-america, version: "20260501", bytes: 11200000000, kind: orphan}]
                    refused: [{root: internal, item: gutenberg-en, version: "20260501", reason: last_verified_copy, kind: orphan}]
                    freed_bytes: 11200000000
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          $ref: "#/components/responses/Conflict"
          description: "LAI-SYN-005: a sync run is active (wait for it, or cancel it). LAI-CAT-001: no catalog is loaded, so orphans cannot be told apart (details.reason no_catalog)."
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}

  /ensure:
    get:
      tags: [ensure]
      operationId: getEnsure
      summary: What this computer is missing, and what the agent is doing about it
      description: |
        The picture a node card or the Portal shows: `state` is `complete` (nothing left to install),
        `installing` (a pass runs, or one is about to), `needs_you` (a step needs a person: a confirmation, a
        failure, a kit item that is missing, or `ensure.auto: ask`) or `off` (`ensure.auto: off` and something is
        missing). `message` and `next_action.text` are plain words in the language of the request; `steps` lists
        each thing the profile wants with its status. It reads the disk and the kit's manifests only (nothing is
        hashed, nothing is changed) and is cached for a few seconds. agent.md section 3.8.33. rebuild-kit.md
        section 4.5.
      x-localai-auth: [op, portal]
      x-localai-timeout: "5 s"
      responses:
        "200":
          description: The picture.
          headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EnsureView"}
              examples:
                complete:
                  value:
                    state: complete
                    auto: "on"
                    message: "Complete: this computer has everything it needs."
                    next_action: {kind: none, text: "Nothing to do."}
                    progress: {done: 0, total: 0}
                    steps:
                      - {id: tool.kiwix-tools, kind: install_tool, status: ok, target: kiwix-tools, item: kit-kiwix-tools, version: "3.7.0-2", needs_confirmation: false, title: "Library tools (kiwix-tools)", detail: "Installed (3.7.0-2)."}
                    run: null
                    dry_run: false
                    checked_at: "2026-11-10T12:00:00Z"
                installing:
                  value:
                    state: installing
                    auto: "on"
                    message: "Installing what's missing (2 of 3)"
                    next_action: {kind: wait, text: "Wait: it keeps going by itself. You can cancel it."}
                    progress: {done: 1, total: 3, current: tool.pmtiles}
                    steps:
                      - {id: apt.packages, kind: install_packages, status: done, target: packages, item: kit-debs, packages: [cmake, git], needs_confirmation: false, title: "System packages for the AI engine", detail: "Installed from the kit."}
                      - {id: tool.pmtiles, kind: install_tool, status: running, target: pmtiles, item: kit-pmtiles, version: "1.22.1", needs_confirmation: false, title: "Map tools (pmtiles)", detail: "Installing now."}
                      - {id: tool.piper, kind: install_tool, status: pending, target: piper, item: kit-piper, version: "2023.11.14-2", needs_confirmation: false, title: "Voice tools (piper)", detail: "Install version 2023.11.14-2 from the kit."}
                    run: {id: "ens-1793534400000000000", trigger: sync_done, dry_run: false, started_at: "2026-11-10T12:00:00Z"}
                    dry_run: false
                    checked_at: "2026-11-10T12:00:03Z"
                needs_you:
                  value:
                    state: needs_you
                    auto: "on"
                    message: "Needs you: building the speech-to-text program takes a long time and needs your OK."
                    next_action: {kind: confirm, text: "Confirm it when you are ready.", step: whisper.build}
                    progress: {done: 0, total: 1}
                    steps:
                      - {id: whisper.build, kind: build_whisper, status: needs_confirm, target: whisper, item: kit-whisper-cpp, needs_confirmation: true, title: "Speech-to-text program (build from source)", detail: "Building it takes a long time, so it starts only when you confirm."}
                    run: null
                    dry_run: false
                    checked_at: "2026-11-10T12:00:00Z"
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}
    post:
      tags: [ensure]
      operationId: startEnsure
      summary: Install what is missing, now
      description: |
        Starts one pass over the steps that wait (the button **Install what's missing**, `aictl ensure`).
        Everything from the kit is installed one step at a time, only from a kit item that verifies at that
        moment, through a fixed list of actions. Answers `202` with the picture when a pass runs (started now or
        already running: asking twice is not an error), `200` with the picture for `dry_run: true` (nothing is
        written, the steps that would run are `pending`) and when there was nothing to do. `confirm` names steps
        with status `needs_confirm` (`whisper.build`, `restart.kiwix`): compiling and restarting a service that
        runs never happen without it, and sending it needs admin* (`403` with `details.pin_required` for an
        operator without the PIN; not needed for a dry run). A confirmation that names no step waiting for one
        is `400`. A Portal session has its body ignored and replaced by the safe default: the automatic steps,
        nothing that needs a confirmation, never a dry run. Allowed in every mode (it uses only what is on disk).
        agent.md section 3.8.33.
      x-localai-auth: [op, portal]
      x-localai-auth-note: "Portal: body ignored and replaced by the safe default (the automatic steps only). confirm needs admin*."
      x-localai-timeout: "10 s"
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EnsureRequest"}
            examples:
              start: {value: {dry_run: false, confirm: []}}
              compile: {value: {confirm: [whisper.build]}}
      responses:
        "200":
          description: The picture (dry run, or nothing to do).
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EnsureView"}
        "202":
          description: A pass is running; poll `GET /ensure`.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EnsureView"}
        "400":
          $ref: "#/components/responses/InvalidRequest"
          description: "LAI-AGT-020: a `confirm` entry is not a step id or names no step waiting for a confirmation (details.field confirm, details.reason unknown_step or not_waiting, details.step)."
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          $ref: "#/components/responses/Conflict"
          description: "LAI-SYN-005: a sync, verify or import run is active (the kit may be changing; try again when it ends). LAI-AGT-022: a mode change is in flight."
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}
    delete:
      tags: [ensure]
      operationId: cancelEnsure
      summary: Stop installing
      description: |
        Cancels the running pass: the program it runs is stopped, the steps not started are not started
        (`cancelled`), and what was installed stays (every step is complete or not done at all). `202` with the
        picture when a pass was running, `200` when none was (cancelling twice is not an error). The next pass
        starts from what the computer has. agent.md section 3.8.33.
      x-localai-auth: [op, portal]
      x-localai-timeout: "10 s"
      responses:
        "200":
          description: Nothing was running.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EnsureView"}
        "202":
          description: The pass was stopped.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EnsureView"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}

  /catalog:
    get:
      tags: [catalog]
