            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SurvivalAlready"}
              examples:
                already: {value: {mode: survival, already: true}}
        "202":
          description: The transition started, or the request was queued.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SurvivalAccepted"}
              examples:
                started: {value: {op_id: op_7k2m9q4r8t1c, target: survival}}
                queued: {value: {op_id: op_7k2m9q4r8t1c, target: survival, queued: true}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "500": {$ref: "#/components/responses/Internal"}

