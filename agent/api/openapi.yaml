    SttRequest:
      type: object
      required: [audio]
      additionalProperties: false
      properties:
        audio: {type: string, format: binary, description: "audio/wav (RIFF, PCM 16-bit or 32-bit float, 1 or 2 channels), at most 25 MiB."}
        language: {type: string, description: "auto (default), en, es or a whisper language code."}
        prompt: {type: string, maxLength: 200, description: "Whisper's initial prompt."}

    SttResponse:
      description: "Owned by companion-services.md section 3.4."
      type: object
      required: [text, language]
      additionalProperties: true
      properties:
        text: {type: string}
        language: {type: string}
        language_probability: {type: number, minimum: 0, maximum: 1}
        duration_s: {type: number, minimum: 0}
        model: {type: string}
        elapsed_ms: {type: integer, minimum: 0}

    TtsRequest:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text: {type: string, minLength: 1, maxLength: 2000}
        voice: {type: [string, "null"], description: "A catalog piper model id."}
        language: {type: string, enum: [auto, en, es], default: auto}
        speed: {type: number, minimum: 0.7, maximum: 1.5, default: 1.0}

    Voices:
      type: object
      required: [voices]
      additionalProperties: false
      properties:
        voices:
          type: array
          items:
            type: object
            required: [id, language, display_name, default]
            additionalProperties: false
            properties:
              id: {type: string}
              language: {type: string}
              display_name: {type: string}
              default: {type: boolean}

    Cloud:
      description: "GET /cloud (agent.md section 3.8.26). When not enrolled only `enrolled` is guaranteed."
      type: object
      required: [enrolled]
      additionalProperties: false
      properties:
        enrolled: {type: boolean}
        url: {type: [string, "null"]}
