          content:
            application/json:
              schema: {$ref: "#/components/schemas/ServiceList"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/Internal"}

  /services/{name}/{action}:
    parameters:
      - {$ref: "#/components/parameters/ServiceName"}
      - {$ref: "#/components/parameters/ServiceAction"}
    post:
      tags: [services]
      operationId: controlService
      summary: Start, stop or restart a service
      description: |
        Waits until the unit is `active` (or `inactive` for stop), at most 60 s; for `llama` it also waits for
        the router health and restores `models.desired_loaded`. Stopping `llama` in survival mode needs
        `force: true` (`409 LAI-AGT-023`). agent.md section 3.8.22.
      x-localai-auth: op
      x-localai-timeout: "120 s"
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ServiceActionRequest"}
      responses:
        "200":
          description: Done.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ServiceActionResult"}
              examples:
                restarted: {value: {name: llama, active: active, restored_models: [qwen3.5-9b-q4km], op_id: op_7k2m9q4r8t1c}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          $ref: "#/components/responses/NotFound"
          description: "LAI-AGT-021: unknown service name or action."
        "409":
          $ref: "#/components/responses/Conflict"
          description: "LAI-AGT-022 another operation is running; LAI-AGT-023 stopping llama in survival mode without force."
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "500":
          $ref: "#/components/responses/Internal"
          description: "LAI-AGT-099: a stop that did not stop, an allowlist violation or a bug (details service, unit, action, reason, active, sub, op_id)."
        "502":
          $ref: "#/components/responses/BadGateway"
          description: "The start or restart left the unit not running: LAI-LLM-001 for llama, LAI-SVC-002 for kiwix, LAI-SVC-011 for whisper (details.reason is job_failed, timeout, wrong_state or unavailable)."
        "503": {$ref: "#/components/responses/Starting"}
        "504": {$ref: "#/components/responses/GatewayTimeout"}

  /services/kiwix/restart:
    post:
      tags: [services]
      operationId: restartKiwix
      summary: Restart the library (kiwix)
      description: |
        The same restart as `POST /services/kiwix/restart` through `/services/{name}/{action}`, as its own route so
        a Portal session can reach it (the **Restart the library** button, survival-portal.md section 3.3) while the
        generic route stays operator-only: never llama, never a stop. The body is ignored. A Portal session
        may restart 6 times per hour, kiwix and the other service together (`429 LAI-SVC-117`). Audit
        `service.restart`. agent.md section 3.8.22.
      x-localai-auth: [op, portal]
      x-localai-auth-note: "Portal: restart only, 6 per hour shared with the other restart route (survival-portal.md section 3.3)."
      x-localai-timeout: "120 s"
      responses:
        "200":
          description: Restarted.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ServiceActionResult"}
              examples:
                restarted: {value: {name: kiwix, active: active, restored_models: [], op_id: op_7k2m9q4r8t1c}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          $ref: "#/components/responses/Conflict"
          description: "LAI-AGT-022 another operation is running."
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "429":
          $ref: "#/components/responses/RateLimited"
          description: "LAI-SVC-117: a Portal session made 6 restarts in the last hour (Retry-After)."
        "500": {$ref: "#/components/responses/Internal"}
        "502":
          $ref: "#/components/responses/BadGateway"
          description: "LAI-SVC-002: the restart left the unit not running (details.reason is job_failed, timeout, wrong_state or unavailable)."
        "503": {$ref: "#/components/responses/Starting"}
        "504": {$ref: "#/components/responses/GatewayTimeout"}

  /services/whisper/restart:
    post:
      tags: [services]
      operationId: restartWhisper
      summary: Restart speech recognition (whisper)
      description: |
