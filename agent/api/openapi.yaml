            application/json:
              schema: {$ref: "#/components/schemas/Catalog"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/Internal"}

  /catalog/refresh:
    post:
      tags: [catalog]
      operationId: refreshCatalog
      summary: Fetch a newer catalog
      description: Needs network; `aictl catalog restore` works offline. A rejected new catalog keeps the previous one. agent.md section 3.8.21.
      x-localai-auth: op
      x-localai-timeout: "120 s"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EmptyRequest"}
      responses:
        "200":
          description: Refreshed (or unchanged).
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CatalogRefresh"}
              examples:
                changed: {value: {version: "2026.11.02-1", previous: "2026.10.20-2", changed: true, source: cloud}}
                unchanged: {value: {version: "2026.11.02-1", previous: "2026.11.02-1", changed: false, source: github}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          $ref: "#/components/responses/Conflict"
          description: "LAI-AGT-023: offline or survival mode (refresh needs network)."
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422":
          $ref: "#/components/responses/Unprocessable"
          description: "LAI-CAT-002: the new catalog was rejected; the previous one is kept (details.problems lists the first ten)."
        "500": {$ref: "#/components/responses/Internal"}
        "502":
          $ref: "#/components/responses/BadGateway"
          description: "LAI-CLD-013: no source could deliver a catalog (details.reason is no_source or fetch_failed); the node keeps its catalog."
        "503": {$ref: "#/components/responses/Starting"}

  /services:
    get:
      tags: [services]
