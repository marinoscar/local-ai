                running:
                  value:
                    run_id: "run-20261102T031500Z-a1f3"
                    trigger: scheduled
                    state: running
                    started_at: "2026-11-02T03:15:02Z"
                    finished_at: null
                    roots: [internal, ark-3f9c0a12]
                    totals: {items: 31, done: 22, skipped: 6, failed: 0, bytes_total: 61234567890, bytes_done: 40211223344, rate_bps: 18874368, eta_s: 1105}
                    active: [{root: ark-3f9c0a12, item: wikipedia-en-maxi, state: downloading, version: "2026-10", bytes_done: 61200000000, bytes_total: 110000000000, rate_bps: 18874368, attempt: 1}]
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          $ref: "#/components/responses/NotFound"
          description: "LAI-AGT-021: no run has happened yet."
        "500": {$ref: "#/components/responses/Internal"}
    delete:
      tags: [ark]
      operationId: cancelArkSync
      summary: Cancel the active run
      description: Idempotent. Every active transfer stops at the next 1 MiB boundary and checkpoints. agent.md section 3.8.18.
      x-localai-auth: op
      x-localai-timeout: "10 s"
      x-localai-status: planned
      x-localai-issue: SYNC-07
      responses:
        "202":
          description: Cancelling.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SyncCancelling"}
              examples:
                cancelling: {value: {run_id: "run-20261102T031500Z-a1f3", state: cancelling}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}

  /ark/verify:
    post:
      tags: [ark]
      operationId: verifyArk
      summary: Re-verify content (bit rot)
      description: Runs as a run of trigger `verify`, sharing the run slot with sync. ark-sync.md section 3.5. agent.md section 3.8.19.
      x-localai-auth: op
      x-localai-timeout: "10 s"
      x-localai-status: planned
      x-localai-issue: SYNC-13
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VerifyRequest"}
            examples:
              quick: {value: {roots: [], items: [], full: false}}
      responses:
        "202":
          description: The run started.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RunAccepted"}
              examples:
                run: {value: {run_id: "run-20261102T031500Z-a1f3"}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          $ref: "#/components/responses/Conflict"
          description: "LAI-SYN-005: a run is already active."
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}

  /ark/import:
    post:
      tags: [ark]
      operationId: importArk
      summary: Import content from another root
      description: |
        Works in every mode (no network). With `dry_run: true` the answer is `200` with the plan. `from_root`
        absent and several drives mounted is `409 LAI-ARK-015` with `details.roots`. ark-sync.md section 3.5
        and 4.14. agent.md section 3.8.20.
      x-localai-auth: op
      x-localai-timeout: "10 s"
      x-localai-status: planned
      x-localai-issue: SYNC-13
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ImportRequest"}
            examples:
              import: {value: {from_root: ark-3f9c0a12, items: [], add_to_profile: false, catalog: false, dry_run: false}}
      responses:
        "200":
          description: "The plan (`dry_run: true`)."
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SyncPlan"}
        "202":
          description: The run started.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RunAccepted"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          $ref: "#/components/responses/Conflict"
          description: "LAI-SYN-005 a run is already active; LAI-ARK-015 several drives are mounted and from_root is absent (details.roots)."
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}

  /ark/drives/{root_id}/eject:
    parameters:
      - {$ref: "#/components/parameters/RootId"}
    post:
      tags: [ark]
      operationId: ejectArkDrive
      summary: Safely eject a drive
      description: |
        Stops using the drive, syncs, flushes and unmounts. `force: true` unloads models whose only copy is on
        the drive instead of refusing. The event `drive.unmounted` follows. ark-sync.md section 3.5 and 4.1.5.
        agent.md section 3.8.20a.
      x-localai-auth: op
      x-localai-timeout: "60 s"
      x-localai-status: planned
      x-localai-issue: SYNC-03
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EjectRequest"}
      responses:
        "202":
          description: Ejecting.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Ejecting"}
              examples:
                ejecting: {value: {state: ejecting}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          $ref: "#/components/responses/Conflict"
          description: "LAI-ARK-009: something still uses the drive (details.blockers: kind process, model or sync, name, pid)."
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}

  /ark/drives/{root_id}/init:
    parameters:
      - {$ref: "#/components/parameters/RootId"}
    post:
      tags: [ark]
      operationId: initArkDrive
      summary: Initialize an empty AI-ARK filesystem
      description: |
        Creates `localai/` and `ROOT.json`. Only for a drive in state `uninitialized`; any other state is
        `409 LAI-AGT-020` with `details.state`. Refused if `<mount>/localai` already exists. ark-sync.md
        section 3.5. agent.md section 3.8.20a.
      x-localai-auth: op
      x-localai-timeout: "60 s"
      x-localai-status: planned
      x-localai-issue: SYNC-03
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EmptyRequest"}
      responses:
        "200":
          description: The drive, now `ready`.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ArkDrive"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          $ref: "#/components/responses/Conflict"
          description: "LAI-AGT-020: the drive is not uninitialized (details.state), or localai/ already exists."
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}

  /ark/drives/{root_id}/mount:
    parameters:
      - {$ref: "#/components/parameters/RootId"}
    post:
      tags: [ark]
      operationId: mountArkDrive
      summary: Mount a detected but unmounted AI-ARK filesystem
      description: Only for state `not_mounted`; other states are `409 LAI-AGT-020` with `details.state`. ark-sync.md section 3.5. agent.md section 3.8.20a.
      x-localai-auth: op
      x-localai-timeout: "60 s"
      x-localai-status: planned
      x-localai-issue: SYNC-03
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EmptyRequest"}
      responses:
        "200":
          description: The drive, once mountinfo shows the mount.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ArkDrive"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          $ref: "#/components/responses/Conflict"
          description: "LAI-AGT-020: the drive is not in state not_mounted (details.state)."
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}

  /ark/drives/{root_id}/profile:
    parameters:
      - {$ref: "#/components/parameters/RootId"}
    put:
      tags: [ark]
      operationId: setArkDriveProfile
      summary: Set the profile a drive follows
      description: ark-sync.md section 3.5. agent.md section 3.8.20a.
      x-localai-auth: admin
      x-localai-timeout: "60 s"
      x-localai-status: planned
      x-localai-issue: SYNC-03
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DriveProfileRequest"}
            examples:
              full: {value: {profile: ark-drive-full}}
      responses:
        "200":
          description: The profile is set.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DriveProfile"}
              examples:
                set: {value: {root_id: ark-3f9c0a12, profile: ark-drive-full}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422":
          $ref: "#/components/responses/Unprocessable"
          description: "LAI-CAT-003: unknown profile id."
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}

  /ark/prune:
    post:
      tags: [ark]
      operationId: pruneArk
      summary: Delete orphans and trash
      description: Never the last verified copy (it is listed in `refused`). ark-sync.md section 3.5. agent.md section 3.8.20a.
      x-localai-auth: admin
      x-localai-timeout: "60 s"
      x-localai-status: planned
      x-localai-issue: SYNC-08
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PruneRequest"}
            examples:
              orphans: {value: {roots: [internal], orphans: true, trash: false, dry_run: false}}
      responses:
        "200":
          description: What was (or with dry_run would be) deleted.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PruneResult"}
              examples:
                pruned:
                  value:
                    deleted: [{root: internal, item: osm-north-america, version: "20260501", bytes: 11200000000, kind: orphan}]
                    refused: [{root: internal, item: gutenberg-en, reason: last_verified_copy}]
                    freed_bytes: 11200000000
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          $ref: "#/components/responses/Conflict"
          description: "LAI-SYN-005: a run is active."
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}

  /catalog:
    get:
      tags: [catalog]
      operationId: getCatalog
      summary: The installed catalog merged with local state
      description: catalog.md section 1 defines the sources. agent.md section 3.8.21.
      x-localai-auth: op
      x-localai-timeout: "5 s"
      responses:
        "200":
          description: The catalog.
          headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Catalog"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/Internal"}

  /catalog/refresh:
    post:
      tags: [catalog]
      operationId: refreshCatalog
      summary: Fetch a newer catalog
      description: Needs network; `aictl catalog restore` works offline. A rejected new catalog keeps the previous one. agent.md section 3.8.21.
      x-localai-auth: op
      x-localai-timeout: "120 s"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EmptyRequest"}
      responses:
        "200":
          description: Refreshed (or unchanged).
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CatalogRefresh"}
              examples:
                changed: {value: {version: "2026.11.02-1", previous: "2026.10.20-2", changed: true, source: cloud}}
                unchanged: {value: {version: "2026.11.02-1", previous: "2026.11.02-1", changed: false, source: github}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          $ref: "#/components/responses/Conflict"
          description: "LAI-AGT-023: offline or survival mode (refresh needs network)."
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422":
          $ref: "#/components/responses/Unprocessable"
          description: "LAI-CAT-002: the new catalog was rejected; the previous one is kept (details.problems lists the first ten)."
        "500": {$ref: "#/components/responses/Internal"}
        "502":
          $ref: "#/components/responses/BadGateway"
          description: "LAI-CLD-013: no source could deliver a catalog (details.reason is no_source or fetch_failed); the node keeps its catalog."
        "503": {$ref: "#/components/responses/Starting"}

  /services:
    get:
      tags: [services]
      operationId: listServices
      summary: The companion services
      description: |
        The `services` of `/status` plus `enabled` and `last_exit`, and the per-service fields of
        companion-services.md section 4.6 (kiwix `books`, whisper `model` and `device`, piper `voices`, maps
        `maps`). agent.md section 3.8.22.
      x-localai-auth: op
      x-localai-timeout: "5 s"
      responses:
        "200":
          description: The services.
          headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ServiceList"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/Internal"}

  /services/{name}/{action}:
    parameters:
      - {$ref: "#/components/parameters/ServiceName"}
      - {$ref: "#/components/parameters/ServiceAction"}
    post:
      tags: [services]
      operationId: controlService
      summary: Start, stop or restart a service
      description: |
        Waits until the unit is `active` (or `inactive` for stop), at most 60 s; for `llama` it also waits for
        the router health and restores `models.desired_loaded`. Stopping `llama` in survival mode needs
        `force: true` (`409 LAI-AGT-023`). agent.md section 3.8.22.
      x-localai-auth: op
      x-localai-timeout: "120 s"
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ServiceActionRequest"}
      responses:
        "200":
          description: Done.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ServiceActionResult"}
              examples:
                restarted: {value: {name: llama, active: active, restored_models: [qwen3.5-9b-q4km], op_id: op_7k2m9q4r8t1c}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          $ref: "#/components/responses/NotFound"
          description: "LAI-AGT-021: unknown service name or action."
        "409":
          $ref: "#/components/responses/Conflict"
          description: "LAI-AGT-022 another operation is running; LAI-AGT-023 stopping llama in survival mode without force."
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "500":
          $ref: "#/components/responses/Internal"
          description: "LAI-AGT-099: a stop that did not stop, an allowlist violation or a bug (details service, unit, action, reason, active, sub, op_id)."
        "502":
          $ref: "#/components/responses/BadGateway"
          description: "The start or restart left the unit not running: LAI-LLM-001 for llama, LAI-SVC-002 for kiwix, LAI-SVC-011 for whisper (details.reason is job_failed, timeout, wrong_state or unavailable)."
        "503": {$ref: "#/components/responses/Starting"}
        "504": {$ref: "#/components/responses/GatewayTimeout"}

  /logs:
    get:
      tags: [status]
      operationId: getLogs
      summary: Recent log lines of a unit
      description: |
        `journalctl -u <unit> -n <lines> [--since <t>] -o json --no-pager`, 5 s timeout, 4 MiB cap; each
        message passes the scrubber. agent.md section 3.8.23.
      x-localai-auth: op
      x-localai-timeout: "10 s"
      parameters:
        - {name: unit, in: query, required: true, schema: {type: string, enum: [agent, llama, kiwix, whisper, sync, drill]}}
        - {name: lines, in: query, schema: {type: integer, minimum: 1, maximum: 2000, default: 200}}
        - {name: since, in: query, schema: {type: string, format: date-time}, description: "RFC 3339."}
      responses:
        "200":
          description: The lines.
          headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Logs"}
              examples:
                llama: {value: {unit: "localai-llama.service", lines: [{at: "2026-11-02T08:00:12Z", priority: 6, message: "llama_server: model loaded"}], truncated: false}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500":
          $ref: "#/components/responses/Internal"
          description: "LAI-AGT-099: journalctl failed (details.reason is journalctl_failed, details.exit_code) or a bug."
        "504":
          $ref: "#/components/responses/GatewayTimeout"
          description: "LAI-AGT-099: journalctl took longer than 5 s (details.reason is journalctl_timeout)."

  /events:
    get:
      tags: [status]
      operationId: streamEvents
      summary: Server-sent events
      description: |
        `text/event-stream`, `Cache-Control: no-store`, `X-Accel-Buffering: no`. Each event is `id: <n>`,
        `event: <type>` and `data: <Event as JSON>`; the `resync` and `shutdown` frames carry only their
        payload as data (`{"reason":"gap"}`, `{}`). A reconnecting client sends `Last-Event-ID`; the first event is
        `resync` when the gap is too old or the agent restarted. A keepalive comment `: ping` every 15 s. A
        Portal session only receives `mode.*`, `model.*`, `service.state`, `drive.*` and `alert.*`; the rest
        of its `types` is dropped silently. The event catalog is agent.md section 3.10. It is a GET, so the
        starting gate does not hold it back; a request while the agent is stopping answers 503. After the
        stream started an error cannot be reported as an envelope.
      x-localai-auth: [op, portal]
      x-localai-auth-note: "Portal: types limited to mode.*, model.*, service.state, drive.* and alert.* (survival-portal.md section 3.3)."
      x-localai-timeout: none
      parameters:
        - {name: types, in: query, schema: {type: string}, description: "Comma-separated, may repeat; each pattern is an exact type or ends in a single *, for example model.*,mode.changed. Default: all."}
        - {name: Last-Event-ID, in: header, schema: {type: integer, minimum: 0}, description: "The last event id the client saw. A missing or malformed value means no replay."}
      responses:
        "200":
          description: The stream.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            Cache-Control: {description: "no-store.", schema: {type: string, enum: [no-store]}}
          content:
            text/event-stream:
              schema:
                type: string
                description: "Server-sent events whose data field is an Event."
        "400":
          $ref: "#/components/responses/InvalidRequest"
          description: "LAI-AGT-020: a types pattern is malformed (details.param is types)."
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/Internal"}
        "503":
          $ref: "#/components/responses/Starting"
          description: "LAI-AGT-024: the agent is stopping, or the event bus is closed."

  /speech/stt:
    post:
      tags: [services]
      operationId: speechToText
      summary: Transcribe audio
      description: |
        Owned by companion-services.md section 3.4; the agent only routes it to whisper-server. The upload is
        `multipart/form-data` (not JSON) and the limit is 25 MiB. agent.md section 3.8.25.
      x-localai-auth: [op, portal]
      x-localai-timeout: "120 s"
      x-localai-status: planned
      x-localai-issue: SVC-07
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: "#/components/schemas/SttRequest"}
      responses:
        "200":
          description: The transcript.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SttResponse"}
              examples:
                english: {value: {text: "How do I clean a deep cut?", language: en, language_probability: 0.97, duration_s: 3.2, model: whisper-small, elapsed_ms: 1840}}
        "400":
          $ref: "#/components/responses/InvalidRequest"
          description: "LAI-SVC-014: not WAV, unsupported encoding, too long, empty or silent; LAI-AGT-020 malformed request."
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "413":
          $ref: "#/components/responses/TooLarge"
          description: "LAI-SVC-014 or LAI-AGT-025: larger than 25 MiB."
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "429":
          $ref: "#/components/responses/RateLimited"
          description: "LAI-SVC-015: 2 requests are already queued."
        "500": {$ref: "#/components/responses/Internal"}
        "503":
          $ref: "#/components/responses/Starting"
          description: "LAI-AGT-024 the agent is starting or stopping; LAI-SVC-010 no model; LAI-SVC-011 the server is down."
        "504":
          $ref: "#/components/responses/GatewayTimeout"
          description: "LAI-SVC-016: whisper took longer than 60 s."

  /speech/tts:
    post:
      tags: [services]
      operationId: textToSpeech
      summary: Synthesize speech
      description: |
        Owned by companion-services.md section 3.4. Produces `audio/wav` by exec'ing piper with a fixed argv.
        agent.md section 3.8.25.
      x-localai-auth: [op, portal]
      x-localai-timeout: "120 s"
      x-localai-status: planned
      x-localai-issue: SVC-08
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TtsRequest"}
            examples:
              english: {value: {text: "Press firmly on the wound with a clean cloth.", voice: null, language: en, speed: 1.0}}
      responses:
        "200":
          description: The audio.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
            X-LocalAI-Voice: {description: "The voice used, for example piper-en-medium.", schema: {type: string}}
            X-LocalAI-Language: {description: "The language of the voice.", schema: {type: string}}
            X-LocalAI-Fallback: {description: "true when the requested language had no voice.", schema: {type: string, enum: ["true"]}}
          content:
            audio/wav:
              schema: {type: string, format: binary}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "413":
          $ref: "#/components/responses/TooLarge"
          description: "LAI-SVC-024: the text is over 2000 characters after cleanup; LAI-AGT-025 the body is over the limit."
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "429":
          $ref: "#/components/responses/RateLimited"
          description: "LAI-SVC-015: more than 2 concurrent syntheses and 4 queued."
        "500":
          $ref: "#/components/responses/Internal"
          description: "LAI-SVC-023: piper failed; LAI-AGT-099 a bug."
        "503":
          $ref: "#/components/responses/Starting"
          description: "LAI-AGT-024 the agent is starting or stopping; LAI-SVC-022 no voice."

  /speech/voices:
    get:
      tags: [services]
      operationId: listVoices
      summary: The installed voices
      description: Needed by the Portal voice picker. companion-services.md section 3.4. agent.md section 3.8.25.
      x-localai-auth: [op, portal]
      x-localai-timeout: "5 s"
      x-localai-status: planned
      x-localai-issue: SVC-08
      responses:
        "200":
          description: The voices.
          headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Voices"}
              examples:
                one: {value: {voices: [{id: piper-en-medium, language: en, display_name: "English (US), medium", default: true}]}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/Internal"}

  /cloud:
    get:
      tags: [cloud]
      operationId: getCloud
      summary: The cloud link
      description: When not enrolled only `enrolled` is guaranteed. agent.md section 3.8.26.
      x-localai-auth: op
      x-localai-timeout: "5 s"
      responses:
        "200":
          description: The link.
          headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Cloud"}
              examples:
                linked:
                  value:
                    enrolled: true
                    url: "https://ai.marin.cr"
                    state: linked
                    server_node_id: "00000000-0000-4000-8000-000000000001"
                    name: ai-n3
                    since: "2026-11-01T22:10:00Z"
                    last_heartbeat_at: "2026-11-02T15:03:55Z"
                    last_claim_at: "2026-11-02T15:03:58Z"
                    last_error: null
                    credential: "nod_...a1b2"
                    eligible_types: ["localai.status.refresh"]
                    server_features: [node_host_vitals]
                    state_transport: endpoint
                    inflight: null
                    key_synced: true
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/Internal"}
    delete:
      tags: [cloud]
      operationId: unenrollCloud
      summary: Unenroll from the cloud
      description: Deregisters (3 s, errors ignored), deletes the credential and `cloud/link.json`. Audit `cloud.unenroll`. agent.md section 3.8.26.
      x-localai-auth: admin
      x-localai-timeout: "15 s"
      responses:
        "200":
          description: Unenrolled.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CloudUnenrolled"}
              examples:
                done: {value: {enrolled: false}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          $ref: "#/components/responses/Conflict"
          description: "LAI-AGT-022: another cloud link change is running."
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}

  /cloud/enroll:
    post:
      tags: [cloud]
      operationId: enrollCloud
      summary: Enroll in the cloud
      description: |
        Writes the credential (0600), sets `cloud.url` in node.yaml and registers synchronously (10 s). A
        network failure, or a registration the cloud refused (LAI-CLD-054), answers `200` with `state: backoff`
        (credential kept, the link retries). In offline and survival modes the credential is stored and the
        state is `stopped`. Audit `cloud.enroll`.
        agent.md section 3.8.26.
      x-localai-auth: admin
      x-localai-timeout: "30 s"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CloudEnrollRequest"}
            examples:
              enroll: {value: {url: "https://ai.marin.cr", credential: "<NODE_CREDENTIAL>"}}
      responses:
        "200":
          description: Linked, backing off, or stopped.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CloudEnrolled"}
              examples:
                linked: {value: {state: linked, server_node_id: "00000000-0000-4000-8000-000000000001", reattached: false}}
                backoff: {value: {state: backoff, last_error: "cloud unreachable"}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          $ref: "#/components/responses/Conflict"
          description: "LAI-AGT-022: another cloud link change is running."
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422":
          $ref: "#/components/responses/Unprocessable"
          description: "LAI-CLD-051: the cloud answered 401, the credential is not kept. LAI-CLD-062: the address is not https."
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}

  /cloud/resend-key:
    post:
      tags: [cloud]
      operationId: resendCloudKey
      summary: Push the llama key to the cloud now
      description: agent.md section 3.8.26 (an expansion of the brief's table, needed by cloud-app.md section 3.6).
      x-localai-auth: admin
      x-localai-timeout: "15 s"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EmptyRequest"}
      responses:
        "200":
          description: Pushed.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ResendKeyResult"}
              examples:
                synced: {value: {key_synced: true, fingerprint: "ab12...9f3c"}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          $ref: "#/components/responses/Conflict"
          description: "LAI-AGT-023: the node is not linked."
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}

  /doctor:
    get:
      tags: [status]
      operationId: runDoctor
      summary: Run the doctor checks
      description: |
        Runs the checks concurrently (at most 4 at once), each with its own timeout. Only non-ok results
        appear in `results`. Severity order: info < warning < error < critical. agent.md section 3.8.27.
      x-localai-auth: op
      x-localai-timeout: "60 s"
      parameters:
        - {name: area, in: query, style: form, explode: true, schema: {type: array, items: {type: string}}, description: "Repeatable (a comma-separated list also works) and case-insensitive, for example LLM. It matches the check's area. An area that is not one of the code area prefixes is 400 LAI-AGT-020 with details.param area."}
        - {name: fast, in: query, schema: {type: string, enum: ["0", "1", "true", "false"]}, description: "1 or true runs only the checks marked fast, within 5 s in total. Any other value is 400 LAI-AGT-020 with details.param fast."}
      responses:
        "200":
          description: The report.
          headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DoctorReport"}
              examples:
                battery:
                  value:
                    ran_at: "2026-11-02T15:04:05Z"
                    duration_ms: 2310
                    summary: {ok: 41, info: 1, warning: 2, error: 0, critical: 0}
                    results: [{check: hw.battery, code: LAI-HW-012, severity: warning, title: "Running on battery", fix: "Plug in the charger. A laptop server stops when the battery runs out", details: {battery_percent: 64}}]
                    passed: [agt.config, llm.router_health, net.loopback_only]
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/Internal"}

  /drill:
    post:
      tags: [drill]
      operationId: startDrill
      summary: Start a drill
      description: |
        `trigger: scheduled` is what `localai-drill.service` sends. Owned by drill.md section 3.1. agent.md
        section 3.8.28.
      x-localai-auth: op
      x-localai-timeout: "10 s"
      x-localai-status: planned
      x-localai-issue: DRILL-01
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DrillRequest"}
            examples:
              full: {value: {quick: false, only: [], trigger: manual}}
      responses:
        "202":
          description: The drill started.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DrillAccepted"}
              examples:
                run: {value: {run_id: "drl-20261101T043512Z-9c1e"}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          $ref: "#/components/responses/Conflict"
          description: "LAI-DRL-002 a drill or an ark run is active; LAI-DRL-003 survival mode."
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}
    get:
      tags: [drill]
      operationId: getDrill
      summary: The last drill results, or one run
      description: Owned by drill.md section 3.4. agent.md section 3.8.28.
      x-localai-auth: op
      x-localai-timeout: "10 s"
      x-localai-status: planned
      x-localai-issue: DRILL-01
      parameters:
        - {name: run_id, in: query, schema: {type: string}, description: "That run instead of the last one."}
      responses:
        "200":
          description: The results document.
          headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DrillResults"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          $ref: "#/components/responses/NotFound"
          description: "LAI-AGT-021: the run is no longer kept, or no drill has run."
        "500": {$ref: "#/components/responses/Internal"}
    delete:
      tags: [drill]
      operationId: abortDrill
      summary: Abort the running drill
      description: The agent restores state (drill.md section 4.3). agent.md section 3.8.28.
      x-localai-auth: op
      x-localai-timeout: "10 s"
      x-localai-status: planned
      x-localai-issue: DRILL-01
      responses:
        "202":
          description: Aborting.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DrillAccepted"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          $ref: "#/components/responses/NotFound"
          description: "LAI-AGT-021: no drill is running."
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}

  /drill/manual:
    post:
      tags: [drill]
      operationId: recordManualDrill
      summary: Record the quarterly pull-the-plug drill
      description: |
        Stores a results document with `trigger: manual_plug` and no `checks`. Audit `drill.record_manual`.
        Owned by drill.md sections 4.6 and 11. agent.md section 3.8.28.
      x-localai-auth: admin
      x-localai-timeout: "5 s"
      x-localai-status: planned
      x-localai-issue: DRILL-06
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DrillManualRequest"}
            examples:
              pass: {value: {result: pass, notes: "Unplugged the AC and the node kept answering.", at: "2026-11-02T15:00:00Z"}}
      responses:
        "201":
          description: Recorded.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DrillAccepted"}
              examples:
                run: {value: {run_id: "drl-20261102T150000Z-manual"}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}

  /docs/index:
    get:
      tags: [docs]
      operationId: getDocsIndex
      summary: The rendered manuals
      description: From the first content root with `docs/index.json` (written by `aictl docs render`), internal root first. An empty list if none. agent.md section 3.8.29.
      x-localai-auth: op
      x-localai-timeout: "5 s"
      x-localai-status: planned
      x-localai-issue: AGENT-16
      responses:
        "200":
          description: The index.
          headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DocsIndex"}
              examples:
                one: {value: {root: /srv/localai/docs, rendered_at: "2026-11-02T03:00:00Z", docs: [{slug: 01-survival-mode, title: "Survival mode", title_es: "Modo de supervivencia", html: /docs/01-survival-mode.html, pdf: /docs/01-survival-mode.pdf}]}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/Internal"}

  /profile:
    get:
      tags: [catalog]
      operationId: getProfile
      summary: The profile and its effective plan
      description: agent.md section 3.8.30.
      x-localai-auth: op
      x-localai-timeout: "5 s"
      responses:
        "200":
          description: The profile.
          headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Profile"}
              examples:
                small:
                  value:
                    profile: small-8gb
                    display_name: "Small GPU laptop (8 GB VRAM)"
                    overrides: {add_models: [], remove_models: [], add_content: [], remove_content: [], budget_bytes: null}
                    suggested: small-8gb
                    match_reasons: ["backend cuda", "vram 8192 MiB in 7000..11999"]
                    effective: {models: [qwen3.5-9b-q4km], content: [wikipedia-en-nopic], skipped: [], planned_bytes: 180000000000, budget_bytes: 220000000000}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422":
          $ref: "#/components/responses/Unprocessable"
          description: "LAI-CAT-003 (the profile of node.yaml is not in the catalog) or LAI-CAT-004 (an id is not in the catalog). details carries the profile, the unknown ids, and the suggested profile with its match_reasons, so a node with a broken node.yaml can still be told what fits."
        "500": {$ref: "#/components/responses/Internal"}
    put:
      tags: [catalog]
      operationId: setProfile
      summary: Change the profile
      description: |
        Either field is optional; `null` overrides means unchanged. Validates, writes node.yaml, regenerates
        `models.ini`, reloads the router and recomputes the plan. Does not start a sync. Audit `profile.set`.
        agent.md section 3.8.30.
      x-localai-auth: admin
      x-localai-timeout: "30 s"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProfileRequest"}
            examples:
              cuda: {value: {profile: cuda-12gb, profile_overrides: null}}
              overrides: {value: {profile_overrides: {add_models: [], remove_models: [], add_content: [], remove_content: [], budget_bytes: 200000000000}}}
      responses:
        "200":
          description: The new profile.
          headers:
            X-Request-Id: {$ref: "#/components/headers/XRequestId"}
            X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Profile"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422":
          $ref: "#/components/responses/Unprocessable"
          description: "LAI-CAT-003 or LAI-CAT-004: the profile or an override is not in the catalog; nothing is written (details as for GET)."
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/Starting"}

components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: "Authorization: Bearer lat_... (the agent token). Yields the operator principal."
    operatorSession:
      type: apiKey
      in: cookie
      name: localai_session
      description: "Operator session (HttpOnly). A mutating request authenticated by it must carry a same-origin Origin."
    portalSession:
      type: apiKey
      in: cookie
      name: lai_portal
      description: "Restricted Portal session, issued only in survival mode (survival-portal.md section 3.3)."
    pinGrant:
      type: apiKey
      in: header
      name: X-LocalAI-Pin-Grant
      description: "A PIN grant from POST /pin/verify: lifts an operator to admin."

  headers:
    XRequestId:
      description: "req_ plus 12 base32 characters. Echoes a valid incoming X-Request-Id."
      schema: {type: string}
    XLocalAIOpId:
      description: "op_ id of the operation the request created, when it created one."
      schema: {type: string}
    RetryAfter:
      description: "Seconds to wait."
      schema: {type: integer, minimum: 0}
    Allow:
      description: "The methods the path accepts."
      schema: {type: string}

  parameters:
    ModelId:
      name: id
      in: path
      required: true
      description: "A catalog model id (or alias)."
      schema: {type: string}
    RootId:
      name: root_id
      in: path
      required: true
      description: "A drive's root id, ark-<8 hex> (ark-sync.md section 2)."
      schema: {type: string}
    ServiceName:
      name: name
      in: path
      required: true
      schema: {type: string, enum: [llama, kiwix, whisper]}
    ServiceAction:
      name: action
      in: path
      required: true
      schema: {type: string, enum: [start, stop, restart]}

  responses:
    SessionCookie:
      description: "No content. Sets the cookie localai_session (43 base64url characters; Path=/; HttpOnly; SameSite=Strict; Max-Age=604800)."
      headers:
        X-Request-Id: {$ref: "#/components/headers/XRequestId"}
        X-LocalAI-Op-Id: {$ref: "#/components/headers/XLocalAIOpId"}
        Set-Cookie: {description: "localai_session=<token>.", schema: {type: string}}
        Cache-Control: {description: "no-store: the response sets a credential.", schema: {type: string, enum: [no-store]}}
    InvalidRequest:
      description: "400 LAI-AGT-020: malformed JSON, unknown field (details.field), invalid value."
      headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}
    Unauthenticated:
      description: "401 LAI-SEC-001 missing or invalid credentials, or LAI-SVC-110 a Portal session used where it is not allowed."
      headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}
    Forbidden:
      description: "403 LAI-SEC-002 admin needed (details.pin_required), LAI-SEC-006 bad Host, LAI-SEC-007 bad Origin, LAI-SEC-013 socket peer is not an operator."
      headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}
    NotFound:
      description: "404 LAI-AGT-021: unknown route, model id, service name or content id."
      headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}
    Conflict:
      description: "409 LAI-AGT-022 another operation is in progress, or LAI-AGT-023 not allowed in the current mode."
      headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}
    TooLarge:
      description: "413 LAI-AGT-025: the body is over the limit (1 MiB; STT 25 MiB)."
      headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}
    UnsupportedMediaType:
      description: "415 LAI-AGT-020: a mutating request without the right Content-Type."
      headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}
    Unprocessable:
      description: "422 a domain code: understood but refused by a rule."
      headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}
    RateLimited:
      description: "429 LAI-SEC-004 too many wrong PIN or login-code attempts, or a queue limit (Retry-After is set)."
      headers:
        X-Request-Id: {$ref: "#/components/headers/XRequestId"}
        Retry-After: {$ref: "#/components/headers/RetryAfter"}
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}
    Internal:
      description: "500 LAI-AGT-099: a bug (details.request_id is always present), or a domain failure code."
      headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}
    BadGateway:
      description: "502 LAI-LLM-004 the router, or LAI-SVC-* another upstream, is not answering."
      headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}
    Starting:
      description: "503 LAI-AGT-024: the agent is starting up or shutting down (Retry-After: 5)."
      headers:
        X-Request-Id: {$ref: "#/components/headers/XRequestId"}
        Retry-After: {$ref: "#/components/headers/RetryAfter"}
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}
    GatewayTimeout:
      description: "504 LAI-LLM-010: an upstream took too long."
      headers: {X-Request-Id: {$ref: "#/components/headers/XRequestId"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}

  schemas:
    ErrorEnvelope:
      description: "The body of every non-2xx response (agent.md section 3.7). `code` is always a doctor code, `fix` one plain-language sentence, `details` an object whose keys are documented per route."
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, fix, details]
          additionalProperties: false
          properties:
            code: {type: string, pattern: "^LAI-[A-Z]{2,3}-[0-9]{3}$"}
            message: {type: string}
            fix: {type: string}
            details: {type: object}
      examples:
        - error: {code: LAI-LLM-009, message: "The model failed to start. The previous model was started again.", fix: "Run aictl logs --unit llama to see why.", details: {model: qwen3.5-9b-q4km, exit_code: 1, rolled_back: true, op_id: op_7k2m9q4r8t1c}}

    EmptyRequest:
      description: "The empty JSON object. The Content-Type is still required."
      type: object
      additionalProperties: false
      properties: {}

    Health:
      description: "GET /health (agent.md section 3.8.1)."
      type: object
      required: [ok, version, mode, starting]
      additionalProperties: false
      properties:
        ok: {type: boolean, description: "True whenever the agent answers."}
        version: {type: string}
        mode: {$ref: "#/components/schemas/ModeValue"}
        starting: {type: boolean, description: "True until startup step 17 completes."}

    ModeValue:
      type: string
      enum: [online, offline, survival]

    SessionCodeRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code: {type: string, pattern: "^[0-9]{6}$", description: "Six decimal digits."}

    UiCode:
      type: object
      required: [code, expires_at]
      additionalProperties: false
      properties:
        code: {type: string, pattern: "^[0-9]{6}$"}
        expires_at: {type: string, format: date-time}

    PinVerifyRequest:
      type: object
      required: [pin]
      additionalProperties: false
      properties:
        pin: {type: string, pattern: "^[0-9]{4,8}$", description: "4 to 8 digits."}

    PinGrant:
      type: object
      required: [grant, expires_at]
      additionalProperties: false
      properties:
        grant: {type: string, pattern: "^pg_[A-Za-z0-9_-]{43}$"}
        expires_at: {type: string, format: date-time}

    Alert:
      description: "An alert raised by the doctor (agent.md section 4.13)."
      type: object
      required: [code, severity, title, fix]
      additionalProperties: false
      properties:
        code: {type: string, pattern: "^LAI-[A-Z]{2,3}-[0-9]{3}$"}
        severity: {$ref: "#/components/schemas/Severity"}
        title: {type: string}
        fix: {type: string}
        since: {type: string, format: date-time}
        details: {type: object}

    Severity:
      type: string
      enum: [info, warning, error, critical]

    Service:
      description: |
        One companion service. `name` and `unit` are always present (`unit` is null for piper and maps). The agent
        fields (`active`, `sub`, `since`, `restarts`, `healthy`, `enabled`, `last_exit`) are in agent.md section 3.8.4
        and 3.8.22; the supervisor fields (`state`, `last_check`, `detail`, `books`, `model`, `device`, `voices`,
        `maps`, `problems`) are owned by companion-services.md section 4.6, hence the open object.
      type: object
      required: [name, unit]
      additionalProperties: true
      properties:
        name: {type: string}
        unit: {type: [string, "null"]}
        active: {type: string, description: "systemd ActiveState."}
        sub: {type: string, description: "systemd SubState."}
        since: {type: [string, "null"], format: date-time}
        restarts: {type: integer, minimum: 0}
        healthy: {type: boolean}
        enabled: {type: boolean}
        last_exit:
          type: [object, "null"]
          additionalProperties: false
          properties:
            code: {type: integer}
            at: {type: string, format: date-time}
        state: {type: string, enum: [ok, degraded, down, missing_content, disabled, starting]}
        last_check: {type: string, format: date-time}
        detail: {type: string}
        books: {type: array, items: {type: object, additionalProperties: true}}
        model: {type: string}
        device: {type: string}
        voices: {type: array, items: {type: string}}
        maps: {type: array, items: {type: string}}
        problems: {type: array, items: {type: object, additionalProperties: true}}

    ServiceList:
      type: object
      required: [services]
      additionalProperties: false
      properties:
        services: {type: array, items: {$ref: "#/components/schemas/Service"}}

    ServiceActionRequest:
      type: object
      additionalProperties: false
      properties:
        force: {type: boolean, default: false, description: "Needed to stop llama in survival mode."}

    ServiceActionResult:
      type: object
      required: [name, active, op_id]
      additionalProperties: false
      properties:
        name: {type: string}
        active: {type: string}
        restored_models: {type: array, items: {type: string}}
        op_id: {type: string}

    ModeTransition:
      description: "`op_id`, `from` and `warnings` are present in GET /mode (the steps' warnings so far)."
      type: object
      required: [step, started_at]
      additionalProperties: false
      properties:
        op_id: {type: string}
        from: {$ref: "#/components/schemas/ModeValue"}
        target: {$ref: "#/components/schemas/ModeValue"}
        step: {type: string}
        started_at: {type: string, format: date-time}
        warnings:
          type: array
          items:
            type: object
            required: [code, message]
            additionalProperties: false
            properties:
              code: {type: string, pattern: "^LAI-[A-Z]{2,3}-[0-9]{3}$"}
              message: {type: string}

    Status:
      description: "GET /status (agent.md section 3.8.4)."
      type: object
      required: [node, mode, connectivity, hardware, services, models, ark, cloud, tailscale, alerts]
      additionalProperties: false
      properties:
        node:
          type: object
          required: [id, display_name, hostname, profile, agent_version, backend, llama_mode, llama_build, catalog_version, uptime_s, time]
          additionalProperties: false
          properties:
            id: {type: string}
            display_name: {type: string}
            hostname: {type: string}
            profile: {type: [string, "null"]}
            agent_version: {type: string}
            backend: {type: string}
            llama_mode: {type: string, description: "router or single."}
            llama_build: {type: [string, "null"]}
            catalog_version: {type: [string, "null"]}
            uptime_s: {type: integer, minimum: 0}
            time: {type: string, format: date-time}
            counters: {type: object, additionalProperties: true, description: "Only with ?counters=1 (agent.md section 7); the keys belong to their producers."}
        mode:
          type: object
          required: [value, since, transition]
          additionalProperties: false
          properties:
            value: {$ref: "#/components/schemas/ModeValue"}
            since: {type: [string, "null"], format: date-time, description: "Null on a fresh node whose mode was never committed."}
            transition:
              oneOf:
                - {type: "null"}
                - {$ref: "#/components/schemas/ModeTransition"}
        connectivity:
          type: object
          required: [value, checked_at, none_since]
          additionalProperties: false
          properties:
            value: {type: string, description: "For example full or none."}
            checked_at: {type: [string, "null"], format: date-time}
            none_since: {type: [string, "null"], format: date-time}
        hardware:
          type: object
          required: [gpu, vram_total_mib, vram_used_mib, ram_total_mib, ram_available_mib, gpu_temp_c, cpu_temp_c, power]
          additionalProperties: false
          properties:
            gpu: {type: [string, "null"]}
            vram_total_mib: {type: [integer, "null"]}
            vram_used_mib: {type: [integer, "null"]}
            ram_total_mib: {type: integer}
            ram_available_mib: {type: integer}
            gpu_temp_c: {type: [number, "null"]}
            cpu_temp_c: {type: [number, "null"]}
            power: {$ref: "#/components/schemas/Power"}
            gpus:
              description: "Each GPU (this agent always sends it; optional so that a reduced status of an older agent still validates); `processes` is left out of the state pushed to the cloud."
              type: array
              items:
                type: object
                required: [index, vendor, name, vram_total_mib, vram_used_mib, temp_c, util_pct, throttling]
                additionalProperties: false
                properties:
                  index: {type: integer, minimum: 0}
                  vendor: {type: string}
                  name: {type: string}
                  vram_total_mib: {type: integer, minimum: 0}
                  vram_used_mib: {type: integer, minimum: 0}
                  temp_c: {type: [number, "null"]}
                  util_pct: {type: [integer, "null"]}
                  throttling: {type: array, items: {type: string}}
                  processes:
                    type: array
                    items:
                      type: object
                      required: [pid, name, vram_mib]
                      additionalProperties: false
                      properties:
                        pid: {type: integer}
                        name: {type: string}
                        vram_mib: {type: integer, minimum: 0}
        services: {type: array, items: {$ref: "#/components/schemas/Service"}}
        models:
          type: object
          required: [default, loaded, loading, present, loadable, models_max]
          additionalProperties: false
          properties:
            default: {type: [string, "null"]}
            loaded: {type: array, items: {type: string}}
            loading: {type: array, items: {type: string}}
            present: {type: integer, minimum: 0}
            loadable: {type: integer, minimum: 0}
            models_max: {type: integer, minimum: 0}
        ark:
          description: "Summary of ark-sync.md section 4.12.1 and 3.5."
          type: object
          required: [roots, drive, sync]
          additionalProperties: true
          properties:
            roots:
              type: array
              items:
                type: object
                required: [path, kind, status]
                additionalProperties: true
                properties:
                  path: {type: string}
                  kind: {type: string}
                  status: {type: string}
                  ready_pct: {type: integer}
                  updated_at: {type: [string, "null"], format: date-time}
            drive:
              type: object
              required: [mounted]
              additionalProperties: true
              properties:
                mounted: {type: boolean}
            sync:
              type: object
              required: [state]
              additionalProperties: true
              properties:
                state: {type: string}
                last_success_at: {type: [string, "null"], format: date-time}
        cloud:
          type: object
          required: [enrolled]
          additionalProperties: false
          properties:
            enrolled: {type: boolean}
            state: {type: string}
            url: {type: [string, "null"]}
            last_heartbeat_at: {type: [string, "null"], format: date-time}
        tailscale:
          type: object
          required: [manage]
          additionalProperties: false
          properties:
            manage: {type: boolean}
            pattern: {type: string, enum: [A, B, none]}
            applied: {type: boolean}
            backend_state: {type: [string, "null"]}
        alerts: {type: array, items: {$ref: "#/components/schemas/Alert"}}

    Power:
      type: object
      required: [source]
      additionalProperties: false
      properties:
        source: {type: string, description: "ac or battery."}
        battery_percent: {type: [integer, "null"], minimum: 0, maximum: 100}
        charging: {type: [boolean, "null"]}
        time_remaining_s: {type: [integer, "null"], minimum: 0}
        profile: {type: [string, "null"]}
        stale: {type: boolean, description: "Present and true when the last probe failed and this is the previous value."}

    PortalStatus:
      description: "Owned by survival-portal.md section 3.5; only the keys every build sets are required here."
      type: object
      required: [schema_version, generated_at, node_id, mode, language, session, brain, capabilities, alerts]
      additionalProperties: true
      properties:
        schema_version: {type: integer}
        generated_at: {type: string, format: date-time}
        node_id: {type: string}
        mode: {$ref: "#/components/schemas/ModeValue"}
        language: {type: string, enum: [en, es]}
        session: {type: string, enum: [none, portal, full]}
        emergency_number: {type: string}
        power:
          type: object
          required: [on_ac, battery_pct, minutes_left, state, low, critical]
          additionalProperties: false
          properties:
            on_ac: {type: boolean}
            battery_pct: {type: [integer, "null"], minimum: 0, maximum: 100}
            minutes_left: {type: [integer, "null"], minimum: 0}
            state: {type: string, enum: [discharging, charging, full, no_battery]}
            low: {type: boolean, description: "On battery and under 20 %."}
            critical: {type: boolean, description: "On battery and under 10 %."}
        clock_ok: {type: boolean}
        brain:
          type: object
          required: [loaded, loading, choices]
          additionalProperties: true
          properties:
            loaded: {type: array, items: {type: object, additionalProperties: true}}
            loading: {type: [object, "null"], additionalProperties: true}
            choices: {type: array, items: {type: object, additionalProperties: true}}
        capabilities: {type: object, additionalProperties: true}
        first_aid: {type: array, items: {type: object, additionalProperties: true}}
        alerts:
          type: array
          items:
            type: object
            required: [code, severity, title, fix]
            additionalProperties: false
            properties:
              code: {type: string, pattern: "^LAI-[A-Z]{2,3}-[0-9]{3}$"}
              severity: {$ref: "#/components/schemas/Severity"}
              title: {type: string}
              fix: {type: string}

    Hardware:
      description: "GET /hardware (agent.md section 3.8.6)."
      type: object
      required: [sampled_at, gpus, ram, disks, power, thermal, cpu]
      additionalProperties: false
      properties:
        sampled_at: {type: string, format: date-time}
        gpus:
          description: "Empty on a CPU-only node."
          type: array
          items:
            type: object
            required: [index, vendor, name, backend, vram_total_mib, vram_used_mib]
            additionalProperties: false
            properties:
              index: {type: integer, minimum: 0}
              vendor: {type: string, enum: [nvidia, amd, intel, other]}
              name: {type: string}
              backend: {type: string}
              compute_cap: {type: [string, "null"]}
              driver: {type: [string, "null"]}
              unified_memory: {type: boolean}
              vram_total_mib: {type: integer, minimum: 0}
              vram_used_mib: {type: integer, minimum: 0}
              vram_used_by_others_mib: {type: [integer, "null"], minimum: 0}
              temp_c: {type: [number, "null"]}
              util_pct: {type: [number, "null"]}
              power_w: {type: [number, "null"]}
              stale: {type: boolean, description: "Present and true when the last probe failed and this is the previous value."}
              throttling: {type: array, items: {type: string}}
              processes:
                type: array
                items:
                  type: object
                  required: [pid, name, vram_mib]
                  additionalProperties: false
                  properties:
                    pid: {type: integer}
                    name: {type: string}
                    vram_mib: {type: integer, minimum: 0}
        ram:
          type: object
          required: [total_mib, available_mib]
          additionalProperties: false
          properties:
            total_mib: {type: integer, minimum: 0}
            available_mib: {type: integer, minimum: 0}
            swap_total_mib: {type: integer, minimum: 0}
            swap_free_mib: {type: integer, minimum: 0}
            stale: {type: boolean, description: "Present and true when the last probe failed and this is the previous value."}
        disks:
          description: "One entry per role (per drive for drive_root), even when several share a filesystem."
          type: array
          items:
            type: object
            required: [path, role, total_bytes, free_bytes]
            additionalProperties: false
            properties:
              path: {type: string}
              role: {type: string, enum: [internal_root, drive_root, state, opt, etc]}
              fs: {type: string}
              total_bytes: {type: integer, minimum: 0}
              free_bytes: {type: integer, minimum: 0}
              stale: {type: boolean, description: "Present and true when the last probe failed and this is the previous value."}
        power: {$ref: "#/components/schemas/Power"}
        thermal:
          type: object
          additionalProperties: false
          properties:
            cpu_temp_c: {type: [number, "null"]}
            cpu_throttle_events: {type: integer, minimum: 0}
            stale: {type: boolean, description: "Present and true when the last probe failed and this is the previous value."}
            zones:
              type: array
              items:
                type: object
                required: [type, temp_c]
                additionalProperties: false
                properties:
                  type: {type: string}
                  temp_c: {type: number}
        cpu:
          type: object
          required: [model, cores]
          additionalProperties: false
          properties:
            model: {type: string}
            cores: {type: integer, minimum: 0, description: "0 when the probe has not succeeded yet."}
            load1: {type: number}
            stale: {type: boolean, description: "Present and true when the last probe failed and this is the previous value."}

    Model:
      description: "A catalog model merged with local state. `files` and `preset` appear on GET /models/{id} only."
      type: object
      required: [id, display_name, engine, in_profile, present, verified, locations, loadable, loadable_reason, status, loaded, default, aliases]
      additionalProperties: false
      properties:
        id: {type: string}
        display_name: {type: string}
        summary: {type: string}
        engine: {type: string, description: "For example llama."}
        roles: {type: array, items: {type: string}}
        survival_tier: {type: integer}
        in_profile: {type: boolean}
        size_bytes: {type: integer, minimum: 0}
        present: {type: boolean}
        verified: {type: boolean}
        locations:
          type: array
          items:
            type: object
            required: [root, complete]
            additionalProperties: false
            properties:
              root: {type: string}
              complete: {type: boolean}
              verified_at: {type: [string, "null"], format: date-time}
        loadable: {type: boolean}
        loadable_reason:
          description: "Null when loadable. code is LAI-CAT-005 (fit or backend), LAI-LLM-008 (files missing or unverified) or LAI-LLM-004 (router down)."
          type: [object, "null"]
          required: [code, message]
          additionalProperties: false
          properties:
            code: {type: string, pattern: "^LAI-[A-Z]{2,3}-[0-9]{3}$"}
            message: {type: string}
        status: {type: string, enum: [absent, stored, unloaded, loading, loaded, sleeping, failed, n/a]}
        loaded: {type: boolean}
        default: {type: boolean}
        aliases: {type: array, items: {type: string}}
        requirements:
          type: object
          additionalProperties: false
          properties:
            backends: {type: array, items: {type: string}}
            min_vram_mib: {type: integer, minimum: 0}
            min_ram_mib: {type: integer, minimum: 0}
        last_load_ms: {type: [integer, "null"], minimum: 0}
        files:
          type: array
          items:
            type: object
            required: [kind, name, size_bytes, sha256, path]
            additionalProperties: false
            properties:
              kind: {type: string}
              name: {type: string}
              size_bytes: {type: integer, minimum: 0}
              sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
              path: {type: string}
        preset: {type: string, description: "The router INI section text."}

    ModelList:
      type: object
      required: [models_max, default, models]
      additionalProperties: false
      properties:
        models_max: {type: integer, minimum: 0}
        default: {type: [string, "null"]}
        models: {type: array, items: {$ref: "#/components/schemas/Model"}}

    LoadRequest:
      type: object
      additionalProperties: false
      properties:
        wait: {type: boolean, default: true}
        unload_others: {type: boolean, default: true}

    ModelLoaded:
      type: object
      required: [id, status, already_loaded, op_id]
      additionalProperties: false
      properties:
        id: {type: string}
        status: {type: string, enum: [loaded]}
        already_loaded: {type: boolean}
        load_ms: {type: [integer, "null"], minimum: 0, description: "How long the router took to load the model, without the evictions; 0 when it was loaded already."}
        unloaded: {type: array, items: {type: string}, description: "The models stopped to make room, in the order they were stopped."}
        op_id: {type: string}
        warning:
          type: object
          description: "Present when the load went ahead although other programs hold much of the memory (LAI-HW-005, LAI-HW-006)."
          required: [code, message]
          additionalProperties: false
          properties:
            code: {type: string}
            message: {type: string}

    ModelLoading:
      type: object
      required: [id, status, op_id]
      additionalProperties: false
      properties:
        id: {type: string}
        status: {type: string, enum: [loading]}
        op_id: {type: string}

    UnloadRequest:
      type: object
      additionalProperties: false
      properties:
        force: {type: boolean, default: false, description: "Needed to unload the last loaded LLM in survival mode."}

    ModelUnloaded:
      type: object
      required: [id, status, already_unloaded, op_id]
      additionalProperties: false
      properties:
        id: {type: string}
        status: {type: string, enum: [unloaded]}
        already_unloaded: {type: boolean}
        op_id: {type: string}
        restarted: {type: boolean, description: "Present and true when the model would not stop and llama was restarted (LAI-LLM-031)."}
        restored: {type: array, items: {type: string}, description: "Present with restarted: the models loaded again afterwards."}

    DefaultModelRequest:
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id: {type: string}

    DefaultModelResponse:
      type: object
      required: [default, previous, ini_regenerated]
      additionalProperties: false
      properties:
        default: {type: string}
        previous: {type: [string, "null"]}
        ini_regenerated: {type: boolean}

    DownloadRequest:
      type: object
      additionalProperties: false
      properties:
        roots: {type: array, items: {type: string}, description: "Content roots (path or root id). Default: the internal root, plus the drive if its profile includes the model."}
        allow_offline_mode: {type: boolean, default: false}

    DownloadAccepted:
      type: object
      required: [id, sync_run_id, queued]
      additionalProperties: false
      properties:
        id: {type: string}
        sync_run_id: {type: string, pattern: "^run-"}
        queued: {type: boolean}

    DeleteModelResponse:
      type: object
      required: [id, deleted, op_id]
      additionalProperties: false
      properties:
        id: {type: string}
        deleted:
          type: array
          items:
            type: object
            required: [root, bytes]
            additionalProperties: false
            properties:
              root: {type: string}
              bytes: {type: integer, minimum: 0}
        op_id: {type: string}

    Key:
      description: "GET /key (agent.md section 3.8.13)."
      type: object
      required: [key, fingerprint, base_urls, models, snippets]
      additionalProperties: false
      properties:
        key: {type: string, pattern: "^[0-9a-f]{64}$"}
        fingerprint: {type: string}
        base_urls:
          type: object
          required: [local, tailnet, public]
          additionalProperties: false
          properties:
            local: {type: string}
            tailnet: {type: [string, "null"]}
            public: {type: [string, "null"]}
        models: {type: array, items: {type: string}}
        snippets:
          type: object
          required: [curl, env]
          additionalProperties: true
          properties:
            curl: {type: string}
            env: {type: string}
            opencode: {type: object, additionalProperties: true}
            openai_python: {type: string}

    KeyRotateRequest:
      type: object
      additionalProperties: false
      properties:
        restart: {type: boolean, default: true}

    KeyRotated:
      type: object
      required: [fingerprint, rotated_at, cloud_synced, restored_models, clients_to_update, op_id]
      additionalProperties: false
      properties:
        fingerprint: {type: string}
        rotated_at: {type: string, format: date-time}
        cloud_synced: {type: boolean}
        restored_models: {type: array, items: {type: string}}
        clients_to_update: {type: array, items: {type: string}}
        op_id: {type: string}

    Mode:
      description: "GET /mode (agent.md section 3.8.15)."
      type: object
      required: [mode, since, transition, allowed_targets, leave_requires_admin, connectivity, suggest_survival]
      additionalProperties: false
      properties:
        mode: {$ref: "#/components/schemas/ModeValue"}
        since: {description: "When the mode was committed; null on a node that never changed mode.", oneOf: [{type: "null"}, {type: string, format: date-time}]}
        transition:
          oneOf:
            - {type: "null"}
            - {$ref: "#/components/schemas/ModeTransition"}
        allowed_targets: {type: array, items: {$ref: "#/components/schemas/ModeValue"}}
        leave_requires_admin: {type: boolean}
        connectivity: {type: string}
        suggest_survival: {type: boolean}

    ModeRequest:
      type: object
      required: [target]
      additionalProperties: false
      properties:
        target: {$ref: "#/components/schemas/ModeValue"}
        wait: {type: boolean, default: false}
        reapply: {type: boolean, default: false}

    ModeAccepted:
      type: object
      required: [op_id, from, target, transition]
      additionalProperties: false
      properties:
        op_id: {type: string}
        from: {$ref: "#/components/schemas/ModeValue"}
        target: {$ref: "#/components/schemas/ModeValue"}
        transition: {$ref: "#/components/schemas/ModeTransition"}

    ModeDone:
      type: object
      required: [op_id, from, mode, warnings]
      additionalProperties: false
      properties:
        op_id: {type: string}
        from: {$ref: "#/components/schemas/ModeValue"}
        mode: {$ref: "#/components/schemas/ModeValue"}
        warnings:
          type: array
          items:
            type: object
            required: [code, message]
            additionalProperties: false
            properties:
              code: {type: string, pattern: "^LAI-[A-Z]{2,3}-[0-9]{3}$"}
              message: {type: string}

    ModeAlready:
      type: object
      required: [mode, already]
      additionalProperties: false
      properties:
        mode: {$ref: "#/components/schemas/ModeValue"}
        already: {type: boolean, enum: [true]}

    SurvivalRequest:
      type: object
      additionalProperties: false
      properties:
        reapply: {type: boolean, default: false}

    SurvivalAccepted:
      type: object
      required: [op_id, target]
      additionalProperties: false
      properties:
        op_id: {type: string}
        target: {type: string, enum: [survival]}
        queued: {type: boolean, description: "True when the request was persisted as pending_mode (before startup step 12, or during shutdown)."}

    SurvivalAlready:
      type: object
      required: [mode, already]
      additionalProperties: false
      properties:
        mode: {type: string, enum: [survival]}
        already: {type: boolean, enum: [true]}

    ArkRoots:
      description: "Owned by ark-sync.md section 4.12.1 (READY.json)."
      type: object
      required: [roots]
      additionalProperties: false
      properties:
        roots:
          type: array
          items:
            type: object
            required: [schema_version, generated_at, root, overall]
            additionalProperties: true
            properties:
              schema_version: {type: integer}
              generated_at: {type: string, format: date-time}
              root: {type: object, additionalProperties: true}
              overall: {type: string, enum: [green, yellow, red]}

    ArkDrive:
      description: "A drive of GET /ark/drives (ark-sync.md section 3.5). `root_id` is null only when there is no usable filesystem UUID."
      type: object
      required: [root_id, device, mount, state]
      additionalProperties: true
      properties:
        root_id: {type: [string, "null"]}
        device: {type: string}
        mount: {type: [string, "null"]}
        fstype: {type: string}
        label: {type: [string, "null"]}
        size_bytes: {type: integer, minimum: 0}
        free_bytes: {type: integer, minimum: 0}
        state: {type: string, enum: [ready, read_only, unclean, not_mounted, unusable, ejecting, uninitialized]}
        read_only: {type: boolean}
        fs_errors: {type: integer, minimum: 0}
        initialized: {type: boolean}
        profile: {type: [string, "null"]}
        ready:
          type: object
          required: [overall, generated_at]
          additionalProperties: true
          properties:
            overall: {type: string}
            generated_at: {type: string, format: date-time}
        problems: {type: array, items: {type: object, additionalProperties: true}}

    ArkDrives:
      type: object
      required: [drives]
      additionalProperties: false
      properties:
        drives: {type: array, items: {$ref: "#/components/schemas/ArkDrive"}}

    SyncRequest:
      description: "ark-sync.md section 3.5."
      type: object
      additionalProperties: false
      properties:
        roots: {type: array, items: {type: string}, description: "Root paths or ids. Empty or absent: every writable mounted root."}
        items: {type: array, items: {type: string}, description: "Empty: the whole plan."}
        dry_run: {type: boolean, default: false}
        allow_offline_mode: {type: boolean, default: false}
        trigger: {type: string, enum: [manual, scheduled, cloud, mode_online, install, verify, import], default: manual}

    SyncAccepted:
      type: object
      required: [run_id, state, events]
      additionalProperties: false
      properties:
        run_id: {type: string, pattern: "^run-"}
        state: {type: string, enum: [running]}
        events: {type: string}

    SyncPlan:
      description: "The dry-run plan, owned by ark-sync.md section 4.4.4 (JSON form)."
      type: object
      additionalProperties: true
      properties:
        root: {type: string}
        profile: {type: string}
        catalog_version: {type: string}
        budget_bytes: {type: integer}
        planned_bytes: {type: integer}
        items: {type: array, items: {type: object, additionalProperties: true}}

    SyncRun:
      description: "The active or last run (ark-sync.md section 3.5)."
      type: object
      required: [run_id, trigger, state, started_at, finished_at]
      additionalProperties: true
      properties:
        run_id: {type: string, pattern: "^run-"}
        trigger: {type: string}
        state: {type: string, enum: [running, cancelling, done, cancelled, failed, skipped]}
        reason: {type: string, description: "For state skipped: offline, mode, battery, disabled or no_roots."}
        started_at: {type: string, format: date-time}
        finished_at: {type: [string, "null"], format: date-time}
        roots: {type: array, items: {type: string}}
        totals: {type: object, additionalProperties: true}
        active: {type: array, items: {type: object, additionalProperties: true}}

    SyncCancelling:
      type: object
      required: [run_id, state]
      additionalProperties: false
      properties:
        run_id: {type: string}
        state: {type: string, enum: [cancelling]}

    RunAccepted:
      type: object
      required: [run_id]
      additionalProperties: false
      properties:
        run_id: {type: string, pattern: "^run-"}

    VerifyRequest:
      type: object
      additionalProperties: false
      properties:
        roots: {type: array, items: {type: string}}
        items: {type: array, items: {type: string}}
        full: {type: boolean, default: false}

    ImportRequest:
      type: object
      additionalProperties: false
      properties:
        from_root: {type: string, description: "A root id. Absent with several drives mounted is 409 LAI-ARK-015."}
        items: {type: array, items: {type: string}}
        add_to_profile: {type: boolean, default: false}
        catalog: {type: boolean, default: false}
        dry_run: {type: boolean, default: false}

    EjectRequest:
      type: object
      additionalProperties: false
      properties:
        force: {type: boolean, default: false}

    Ejecting:
      type: object
      required: [state]
      additionalProperties: false
      properties:
        state: {type: string, enum: [ejecting]}

    DriveProfileRequest:
      type: object
      required: [profile]
      additionalProperties: false
      properties:
        profile: {type: string}

    DriveProfile:
      type: object
      required: [root_id, profile]
      additionalProperties: false
      properties:
        root_id: {type: string}
        profile: {type: string}

    PruneRequest:
      type: object
      additionalProperties: false
      properties:
        roots: {type: array, items: {type: string}}
        orphans: {type: boolean}
        trash: {type: boolean}
        dry_run: {type: boolean, default: false}

    PruneResult:
      type: object
      required: [deleted, refused, freed_bytes]
      additionalProperties: false
      properties:
        deleted:
          type: array
          items:
            type: object
            required: [root, item, bytes, kind]
            additionalProperties: false
            properties:
              root: {type: string}
              item: {type: string}
              version: {type: string}
              bytes: {type: integer, minimum: 0}
              kind: {type: string, enum: [orphan, trash]}
        refused:
          type: array
          items:
            type: object
            required: [root, item, reason]
            additionalProperties: false
            properties:
              root: {type: string}
              item: {type: string}
              reason: {type: string}
        freed_bytes: {type: integer, minimum: 0}

    Catalog:
      description: "GET /catalog (agent.md section 3.8.21; catalog.md)."
      type: object
      required: [version, source, models, content]
      additionalProperties: false
      properties:
        version: {type: string}
        source: {type: string, enum: [cloud, github, offline, kit, test]}
        fetched_at: {type: [string, "null"], format: date-time}
        models: {type: array, items: {$ref: "#/components/schemas/Model"}}
        content:
          type: array
          items:
            type: object
            required: [id, kind, display_name, present, verified, in_profile, size_bytes, status]
            additionalProperties: false
            properties:
              id: {type: string}
              kind: {type: string}
              display_name: {type: string}
              present: {type: boolean}
              verified: {type: boolean}
              in_profile: {type: boolean}
              size_bytes: {type: integer, minimum: 0}
              status: {type: string}
        profiles:
          description: "Every profile of the installed catalog and the ids it includes (catalog.md section 4). `aictl profile set` shows them, with sizes from `models` and `content`, before it asks."
          type: array
          items:
            type: object
            required: [id, display_name, include, budget_bytes]
            additionalProperties: false
            properties:
              id: {type: string}
              display_name: {type: string}
              include:
                type: object
                required: [models, content]
                additionalProperties: false
                properties:
                  models: {type: array, items: {type: string}}
                  content: {type: array, items: {type: string}}
              budget_bytes: {type: integer, minimum: 0}

    CatalogRefresh:
      type: object
      required: [version, previous, changed, source]
      additionalProperties: false
      properties:
        version: {type: string}
        previous: {type: [string, "null"]}
        changed: {type: boolean}
        source: {type: string, enum: [cloud, github, offline, kit, test]}
        warnings:
          description: "Present when the router reload after a changed catalog had a problem; the catalog is installed regardless."
          type: array
          items:
            type: object
            required: [code, message]
            additionalProperties: false
            properties:
              code: {type: string, pattern: "^LAI-[A-Z]{2,3}-[0-9]{3}$"}
              message: {type: string}

    Logs:
      type: object
      required: [unit, lines, truncated]
      additionalProperties: false
      properties:
        unit: {type: string}
        lines:
          type: array
          items:
            type: object
            required: [at, priority, message]
            additionalProperties: false
            properties:
              at: {type: string, format: date-time}
              priority: {type: integer, minimum: 0, maximum: 7}
              message: {type: string}
        truncated: {type: boolean}

    Event:
