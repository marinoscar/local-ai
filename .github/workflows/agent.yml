name: agent
# Go pipeline for agent/ (ADR-0001: one static binary, vendored deps so the rebuild kit can build offline).
# The logic lives in scripts/agent-ci.sh so it runs identically by hand. Until AGENT-01 creates agent/go.mod
# the "go" job detects the missing module and does nothing; the script's own tests always run.
#
# The UI (agent/ui) is built before the Go checks because its dist/ is embedded; its own tests are in ui.yml.
on:
  pull_request:
    paths: ['agent/**', 'catalog/**', 'packages/ui/**', 'docs/specs/agent.md', 'docs/specs/doctor-codes.md', 'scripts/agent-ci.sh', 'scripts/tests/test-agent-ci.sh', 'scripts/check-offline-assets.mjs', 'scripts/testdata/offline-assets/**', '.github/workflows/agent.yml']
  push:
    branches: [main]
    paths: ['agent/**', 'catalog/**', 'packages/ui/**', 'docs/specs/agent.md', 'docs/specs/doctor-codes.md', 'scripts/agent-ci.sh', 'scripts/tests/test-agent-ci.sh', 'scripts/check-offline-assets.mjs', 'scripts/testdata/offline-assets/**', '.github/workflows/agent.yml']
permissions:
  contents: read
jobs:
  script-tests:
    # Proves the pipeline itself: stale vendor is red, builds are static and reproducible.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.24'
      - run: scripts/tests/test-agent-ci.sh
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Detect the agent module
        id: detect
        run: |
          if [ -f agent/go.mod ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "agent/go.mod not found yet (AGENT-01): nothing to check"; fi
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: steps.detect.outputs.present == 'true'
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: agent/ui/package-lock.json
      - name: Build the UI (agent/ui/dist is embedded with go:embed, so it is built before go test)
        if: steps.detect.outputs.present == 'true'
        working-directory: agent/ui
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: vet, test -race, staticcheck, vendor is current
        if: steps.detect.outputs.present == 'true'
        run: scripts/agent-ci.sh check
      - name: OpenAPI conformance (agent/api/openapi.yaml against the routes, the spec table and the recorded responses)
        if: steps.detect.outputs.present == 'true'
        working-directory: agent
        run: go test ./api/... ./internal/api/...
      - name: Static builds for linux/amd64 and linux/arm64
        if: steps.detect.outputs.present == 'true'
        run: scripts/agent-ci.sh build
      - name: Reproducible (build twice, compare sha256)
        if: steps.detect.outputs.present == 'true'
        run: scripts/agent-ci.sh repro
      - name: Builds offline from the vendored tree
        if: steps.detect.outputs.present == 'true'
        working-directory: agent
        env:
          GOPROXY: 'off'
          GOFLAGS: -mod=vendor
        run: go build ./...
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: steps.detect.outputs.present == 'true'
        with:
          name: aiagent-linux-amd64
          path: agent/dist/aiagent-linux-amd64
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: steps.detect.outputs.present == 'true'
        with:
          name: aiagent-linux-arm64
          path: agent/dist/aiagent-linux-arm64
          if-no-files-found: error
  api-types:
    # packages/ui/src/api/agent.gen.ts is generated from agent/api/openapi.yaml (agent.md section 4.14):
    # regenerate it and fail on any difference, so the TypeScript clients never drift from the contract.
    # Node comes preinstalled on ubuntu-latest; the generator itself is pinned by package-lock.json.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ui
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install (pinned by package-lock.json)
        run: npm ci --no-audit --no-fund
      - name: Regenerate agent.gen.ts
        run: npm run gen:agent-api
      - name: The generated file is committed and current
        run: git diff --exit-code -- src/api/agent.gen.ts
      - name: The generated types compile
        run: npm run typecheck
