name: release-catalog
# Tag catalog-<CATALOG_VERSION> -> lint the catalog, build catalog.tar.gz (catalog/ and docs/), SHA256SUMS,
# minisign signature, DRAFT GitHub release. The moving tag catalog-stable is excluded (CAT-04 owns it).
# Trust root: docs/architecture/release-signing.md. Tag names: docs/architecture/overview.md section 3.8.
on:
  push:
    tags: ['catalog-*', '!catalog-stable']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {fetch-depth: 0}
      - name: Validate the tag and that it is on main
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" =~ ^catalog-[0-9A-Za-z][0-9A-Za-z._-]*$ ]] || { echo "::error::tag '$tag' is not catalog-<CATALOG_VERSION>"; exit 1; }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$tag does not point at a commit on main"; exit 1; }
      - name: Require the catalog, the agent module (for the linter), the secrets and the public key
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          [ -d catalog ] || { echo "::error::catalog/ does not exist yet: nothing to release"; exit 1; }
          [ -f agent/go.mod ] && [ -d agent/cmd/aiagent ] || { echo "::error::agent/ does not exist yet (AGENT-01): cannot run 'aictl catalog lint', so an unlinted catalog is never published"; exit 1; }
          [ -n "$MINISIGN_SECRET_KEY" ] && [ -n "$MINISIGN_PASSWORD" ] || { echo "::error::secrets MINISIGN_SECRET_KEY / MINISIGN_PASSWORD are not set (owner action: docs/architecture/release-signing.md)"; exit 1; }
          [ -f agent/internal/kit/keys/minisign.pub ] || { echo "::error::agent/internal/kit/keys/minisign.pub is not committed (owner action: docs/architecture/release-signing.md)"; exit 1; }
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Lint the catalog with the agent's own validator
        env:
          OUT_DIR: ${{ runner.temp }}/build
        run: |
          set -euo pipefail
          scripts/agent-ci.sh build
          ln -sf "$OUT_DIR/aiagent-linux-amd64" "$OUT_DIR/aictl"
          "$OUT_DIR/aictl" catalog lint catalog/
      - name: Reproducible catalog.tar.gz
        env:
          REL: ${{ runner.temp }}/release
        run: |
          set -euo pipefail
          mkdir -p "$REL"
          epoch="$(git log -1 --format=%ct)"
          tar --sort=name --mtime="@$epoch" --owner=0 --group=0 --numeric-owner -cf - catalog docs | gzip -n > "$REL/catalog.tar.gz"
      - name: Install minisign
        run: sudo apt-get update -qq && sudo apt-get install -y -qq minisign
      - name: SHA256SUMS, sign, verify with the committed public key
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          RELEASE_TAG: ${{ github.ref_name }}
          REL: ${{ runner.temp }}/release
        run: |
          set -euo pipefail
          scripts/release-sign.sh sums "$REL" catalog.tar.gz
          scripts/release-sign.sh sign "$REL"
          scripts/release-sign.sh verify "$REL"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REL: ${{ runner.temp }}/release
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes \
            --title "Catalog ${GITHUB_REF_NAME#catalog-}" \
            "$REL/catalog.tar.gz" "$REL/SHA256SUMS" "$REL/SHA256SUMS.minisig"
