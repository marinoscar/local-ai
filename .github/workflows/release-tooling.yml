name: release-tooling
# Tests the release scripts with throwaway keys and a tiny fixture repository. No secrets are used.
#   scripts/release-sign.sh                                   checksums, signing, verification
#   scripts/release/{build-src-tarball,stamp-installer,assemble-node-release,offline-build-check}.sh   node release
#   scripts/release/{check-desktop-tag,assemble-desktop-release,desktop-release-notes,desktop-kit-snippet}.sh   desktop release (DSK-12),
#   plus a lint of every workflow (YAML parses, desktop-release.yml keeps its safety properties)
on:
  pull_request:
    paths: ['scripts/release-sign.sh', 'scripts/release/**', 'scripts/check-redaction.sh', 'scripts/tests/test-release-sign.sh', 'scripts/tests/test-release-node.sh', 'scripts/tests/test-desktop-release.sh', '.github/workflows/release-*.yml', '.github/workflows/desktop-*.yml', '.github/PULL_REQUEST_TEMPLATE/**']
  push:
    branches: [main]
    paths: ['scripts/release-sign.sh', 'scripts/release/**', 'scripts/check-redaction.sh', 'scripts/tests/test-release-sign.sh', 'scripts/tests/test-release-node.sh', 'scripts/tests/test-desktop-release.sh', '.github/workflows/release-*.yml', '.github/workflows/desktop-*.yml', '.github/PULL_REQUEST_TEMPLATE/**']
permissions:
  contents: read
jobs:
  sign-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq minisign
      - run: scripts/tests/test-release-sign.sh
  node-release-tests:
    # Source tarball (reproducible, vendored, redaction-checked), installer stamping, asset assembly and signing, and
    # the offline build inside `unshare -n` (the runner has passwordless sudo).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.24'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq minisign shellcheck
      - name: shellcheck the release scripts and their tests
        run: shellcheck -S style scripts/release-sign.sh scripts/release/*.sh && shellcheck -S warning scripts/tests/test-release-node.sh scripts/tests/test-desktop-release.sh
      - run: scripts/tests/test-release-node.sh
  desktop-release-tests:
    # The desktop release scripts (tag check, SHA256SUMS + minisign, notes, kit snippet) with throwaway keys and fake
    # assets, and the lint of every workflow file (a colon-space in a step name once broke a workflow).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq minisign shellcheck python3-yaml
      - run: python3 -c 'import yaml; print("PyYAML", yaml.__version__)'
      - run: scripts/tests/test-desktop-release.sh
