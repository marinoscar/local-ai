name: docs-guard
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  redaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {fetch-depth: 0}
      - name: Redaction check
        run: scripts/check-redaction.sh
      - name: Redaction check self-test (fixtures, staged scan, hook)
        run: scripts/tests/test-redaction.sh
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: scripts/linkcheck/go.mod
      - name: Link checker unit tests
        run: cd scripts/linkcheck && go vet ./... && go test -race ./...
      - name: Markdown links and anchors (offline)
        run: scripts/check-links.sh
  doctor-codes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Doctor code registry check
        run: scripts/check-doctor-codes.sh
      - name: Doctor code check self-test (fixtures)
        run: scripts/tests/test-doctor-codes.sh
