name: docs-guard
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  redaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {fetch-depth: 0}
      - name: Redaction check
        run: scripts/check-redaction.sh
      - name: Redaction check self-test (fixtures, staged scan, hook)
        run: scripts/tests/test-redaction.sh
      - name: Inventory helper self-test
        run: scripts/tests/test-init-inventory.sh
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: scripts/linkcheck/go.mod
      - name: Link checker unit tests
        run: cd scripts/linkcheck && go vet ./... && go test -race ./...
      - name: Markdown links and anchors (offline)
        run: scripts/check-links.sh
  doctor-codes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Doctor code registry check
        run: scripts/check-doctor-codes.sh
      - name: Doctor code check self-test (fixtures)
        run: scripts/tests/test-doctor-codes.sh
