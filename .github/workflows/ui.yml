name: ui
# The Survival Portal SPA (agent/ui): lint, unit tests, build, then Playwright (1366x768, axe-core,
# keyboard walk-through, offline test) against a fake agent. survival-portal.md sections 4.10 and 4.11.
on:
  pull_request:
    paths: ['agent/ui/**', 'docs/specs/survival-portal.md', 'scripts/check-offline-assets.mjs', 'scripts/testdata/offline-assets/**', '.github/workflows/ui.yml']
  push:
    branches: [main]
    paths: ['agent/ui/**', 'docs/specs/survival-portal.md', 'scripts/check-offline-assets.mjs', 'scripts/testdata/offline-assets/**', '.github/workflows/ui.yml']
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent/ui
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: agent/ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint (no JSX text literal, no style attribute under src/portal)
        run: npm run lint
      - name: Unit tests (i18n parity and placeholders, status-line rule, language order)
        run: npm test
      - name: Build
        run: npm run build
      - name: Offline asset scan of the real build (survival-portal.md section 4.11)
        working-directory: .
        run: node scripts/check-offline-assets.mjs agent/ui/dist
      - name: Scanner self-test (unit cases, and the bad fixture must fail)
        working-directory: .
        run: |
          node --test scripts/tests/check-offline-assets.test.mjs
          if node scripts/check-offline-assets.mjs scripts/testdata/offline-assets/bad; then
            echo "the scanner accepted the bad fixture" >&2
            exit 1
          fi
      - name: Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Playwright (no-scroll, axe-core, keyboard, banners, offline)
        run: npx playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: |
            agent/ui/playwright-report
            agent/ui/test-results
          if-no-files-found: ignore
