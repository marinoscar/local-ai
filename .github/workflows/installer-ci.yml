name: installer-ci
# installers/install-node.sh (INST-01): shellcheck and the offline shell tests (throwaway state and keys, nothing
# is installed). Spec: docs/specs/installer.md.
on:
  pull_request:
    paths: ['installers/**', 'agent/internal/setup/**', 'scripts/check-no-logind-restart.sh', 'scripts/tests/test-no-logind-restart.sh', 'scripts/tests/test-installer.sh', 'scripts/release/**', '.github/workflows/installer-ci.yml']
  push:
    branches: [main]
    paths: ['installers/**', 'agent/internal/setup/**', 'scripts/check-no-logind-restart.sh', 'scripts/tests/test-no-logind-restart.sh', 'scripts/tests/test-installer.sh', 'scripts/release/**', '.github/workflows/installer-ci.yml']
permissions:
  contents: read
jobs:
  installer-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq minisign shellcheck
      - name: shellcheck the installer and its test
        run: shellcheck -S style installers/install-node.sh && shellcheck -S warning scripts/tests/test-installer.sh
      - run: scripts/tests/test-installer.sh
      - name: nothing restarts, reloads or signals systemd-logind
        run: scripts/check-no-logind-restart.sh && scripts/tests/test-no-logind-restart.sh
