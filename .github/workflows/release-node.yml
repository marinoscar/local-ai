name: release-node
# Tag node-vX.Y.Z -> static agent binaries (linux/amd64, linux/arm64), the agent source tarball with vendor/ and the
# built UI, the stamped install-node.sh, SHA256SUMS, its minisign signature, and a DRAFT GitHub release with the six
# assets. The owner checks the draft and publishes it. Spec: docs/specs/rebuild-kit.md sections 3.1, 3.2 and 4.3.4;
# trust root and the owner's key setup: docs/architecture/release-signing.md; layout read by self-update:
# docs/specs/agent.md section 4.10.
#
# Jobs: prepare (validate the tag) -> build (checks, binaries, source tarball built twice and compared; no secrets)
#       -> offline-build (the tarball builds with no network, the section 4.3.4 command; no secrets)
#       -> release (environment `release`: stamp, SHA256SUMS, sign, verify with the committed key, draft release).
#
# workflow_dispatch is a DRY RUN by default: the same build and offline proof, then the assets are assembled and signed
# with a throwaway key generated inside the job and uploaded as a workflow artifact. No release, no tag, no real key.
# workflow_dispatch with `release: true` (on main only) is a REAL release of the current main HEAD as node-v<version>
# without a tag push (issues #441, #444): the `handoff` job tags main HEAD through the API and starts this workflow again
# on that tag (`gh workflow run --ref node-v<version>`), because the `release` environment allows only node-v* tag refs.
# A dispatch on a node-v* tag ref is handled exactly like a tag push.
# Every real release publishes itself once SHA256SUMS verifies with the committed key, then downloads what GitHub serves
# and verifies it again; a failure moves it back to a draft (release-signing.md section 2).
on:
  push:
    tags: ['node-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Dry run only: the semver to build as (e.g. 0.0.1-rc.1). Nothing is published or signed with the real key.'
        required: false
        default: '0.0.0-dryrun.1'
      release:
        description: 'Real release of main HEAD as node-v<version> (tag created by the release, then published). Off: dry run.'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
      handoff: ${{ steps.meta.outputs.handoff }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {fetch-depth: 0}
      - name: Validate the tag (or the dry-run version) and that a tag is on main
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          semver='^([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$'
          handoff=false
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != refs/tags/node-v* ]]; then
            [[ "$INPUT_VERSION" =~ $semver ]] || { echo "::error::version '$INPUT_VERSION' is not a semver"; exit 1; }
            version="${BASH_REMATCH[1]}"; pre="${BASH_REMATCH[2]}"; tag="node-v$version"; dry=true
            if [[ "$INPUT_RELEASE" == "true" ]]; then
              [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::a real release is started from main only (this run is on $GITHUB_REF)"; exit 1; }
              [[ "$version" != 0.0.0-dryrun* ]] || { echo "::error::give the real version (for example 0.1.0-rc.3), not the dry-run default"; exit 1; }
              if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
                echo "::error::$tag already exists: a pushed tag is never moved. Choose the next version."; exit 1
              fi
              # Nothing is built here: the handoff job tags main HEAD and starts the real release on the tag.
              dry=false; handoff=true
            fi
          else
            # A tag push, or a dispatch on a node-v* tag ref (the handoff's second run): the same real release.
            tag="$GITHUB_REF_NAME"
            [[ "$tag" == node-v* && "${tag#node-v}" =~ $semver ]] || { echo "::error::tag '$tag' is not node-v<semver>"; exit 1; }
            version="${BASH_REMATCH[1]}"; pre="${BASH_REMATCH[2]}"; dry=false
            git fetch --no-tags origin main
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
              || { echo "::error::$tag does not point at a commit on main"; exit 1; }
          fi
          # pre is the semver pre-release part (e.g. -rc.1): such a release is marked as a pre-release
          if [[ -n "$pre" ]]; then prerelease=--prerelease; else prerelease=""; fi
          { echo "tag=$tag"; echo "version=$version"; echo "prerelease=$prerelease"; echo "dry_run=$dry"; echo "handoff=$handoff"; } >> "$GITHUB_OUTPUT"
          echo "release $tag (version $version, dry run: $dry, handoff to the tag: $handoff)"

  handoff:
    # `release: true` on main (issue #444): tag main HEAD through the API, then start this workflow on the tag. A tag
    # created with GITHUB_TOKEN starts no workflow by itself, but a workflow_dispatch sent with it does.
    needs: prepare
    if: needs.prepare.outputs.handoff == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Tag main HEAD and start the release on the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" --jq '"tagged " + .ref'
          gh workflow run release-node.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
          echo "started the release of $TAG on commit $GITHUB_SHA: see the next release-node run"
  build:
    needs: prepare
    # A `release: true` dispatch on main builds nothing itself: the run it starts on the tag does.
    if: needs.prepare.outputs.handoff != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {fetch-depth: 0}
      - name: Require the agent module
        run: |
          [ -f agent/go.mod ] && [ -d agent/cmd/aiagent ] || { echo "::error::agent/ does not exist yet (AGENT-01): nothing to release"; exit 1; }
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Is there a local UI to build
        id: ui
        run: |
          if [ -f agent/ui/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "agent/ui does not exist yet (survival portal epic): the release carries no UI build"; fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.ui.outputs.present == 'true'
        with:
          node-version: '22'
      - name: Build the local UI (shipped built, the rebuild kit has no Node.js)
        if: steps.ui.outputs.present == 'true'
        working-directory: agent/ui
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Checks (vet, tests, staticcheck, vendor current)
        run: scripts/agent-ci.sh check
      - name: Static builds with the release version
        env:
          AGENT_VERSION: ${{ needs.prepare.outputs.version }}
          OUT_DIR: ${{ runner.temp }}/bin
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"; export SOURCE_DATE_EPOCH
          scripts/agent-ci.sh build
      - name: The binaries build reproducibly
        env:
          AGENT_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"; export SOURCE_DATE_EPOCH
          scripts/agent-ci.sh repro
      - name: Agent source tarball, built twice (must be byte-identical)
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          SRC_OUT: ${{ runner.temp }}/src
        run: |
          set -euo pipefail
          scripts/release/build-src-tarball.sh --tag "$TAG" --ref "$GITHUB_SHA" --out "$SRC_OUT/a"
          scripts/release/build-src-tarball.sh --tag "$TAG" --ref "$GITHUB_SHA" --out "$SRC_OUT/b"
          name="local-ai-$TAG-src.tar.gz"
          a="$(sha256sum "$SRC_OUT/a/$name" | cut -d' ' -f1)"; b="$(sha256sum "$SRC_OUT/b/$name" | cut -d' ' -f1)"
          [ "$a" = "$b" ] || { echo "::error::the source tarball is not reproducible: $a != $b"; exit 1; }
          echo "source tarball sha256 $a (identical across two builds)"
          mkdir -p "$RUNNER_TEMP/unsigned"
          cp "$RUNNER_TEMP/bin/aiagent-linux-amd64" "$RUNNER_TEMP/bin/aiagent-linux-arm64" "$SRC_OUT/a/$name" "$RUNNER_TEMP/unsigned/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: node-unsigned
          path: ${{ runner.temp }}/unsigned/*
          if-no-files-found: error
          retention-days: 7

  offline-build:
    # The kit rebuilds the agent with only Go and no network (rebuild-kit.md section 4.3.4). Prove it here, from the
    # tarball that will be released: a module missing from vendor/ is LAI-KIT-030 on a node, so CI must catch it first.
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: agent/go.mod
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: node-unsigned
          path: ${{ runner.temp }}/unsigned
      - name: Build from the tarball inside a network namespace (unshare -n), then check the version
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          scripts/release/offline-build-check.sh --tarball "$RUNNER_TEMP/unsigned/local-ai-$TAG-src.tar.gz" \
            --version "$VERSION" --go "$(command -v go)"

  package-dry-run:
    # workflow_dispatch only: assemble and sign with a throwaway key, upload for inspection, publish nothing.
    if: needs.prepare.outputs.dry_run == 'true'
    needs: [prepare, build, offline-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install minisign
        run: sudo apt-get update -qq && sudo apt-get install -y -qq minisign
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: node-unsigned
          path: ${{ runner.temp }}/unsigned
      - name: Assemble the assets and sign them with a throwaway key
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          pw="$(openssl rand -hex 16)"; echo "::add-mask::$pw"
          printf '%s\n%s\n' "$pw" "$pw" | minisign -G -p "$RUNNER_TEMP/dry.pub" -s "$RUNNER_TEMP/dry.key" -f >/dev/null
          MINISIGN_SECRET_KEY="$(cat "$RUNNER_TEMP/dry.key")" MINISIGN_PASSWORD="$pw" RELEASE_TAG="$TAG" \
            scripts/release/assemble-node-release.sh --tag "$TAG" --bin-dir "$RUNNER_TEMP/unsigned" \
              --tarball "$RUNNER_TEMP/unsigned/local-ai-$TAG-src.tar.gz" --pubkey "$RUNNER_TEMP/dry.pub" \
              --out "$RUNNER_TEMP/release" --allow-missing-installer --sign
          rm -f "$RUNNER_TEMP/dry.key"
          echo "Dry run for $TAG: signed with a throwaway key. NOT a release; nothing was published." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: node-release-dry-run
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 7

  release:
    # Only this job holds the signing secrets and write access. Add required reviewers to the `release` environment
    # (docs/architecture/release-signing.md section 3): the signing starts after the build and the offline proof pass.
    if: needs.prepare.outputs.dry_run == 'false'
    needs: [prepare, build, offline-build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Require the signing secrets and the committed public key
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$MINISIGN_SECRET_KEY" ] && [ -n "$MINISIGN_PASSWORD" ] || { echo "::error::secrets MINISIGN_SECRET_KEY / MINISIGN_PASSWORD are not set in the release environment (owner action: docs/architecture/release-signing.md)"; exit 1; }
          [ -f agent/internal/kit/keys/minisign.pub ] || { echo "::error::agent/internal/kit/keys/minisign.pub is not committed (owner action: docs/architecture/release-signing.md)"; exit 1; }
      - name: Install minisign
        run: sudo apt-get update -qq && sudo apt-get install -y -qq minisign
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: node-unsigned
          path: ${{ runner.temp }}/unsigned
      - name: Stamp install-node.sh, write SHA256SUMS, sign, verify with the committed public key
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          scripts/release/assemble-node-release.sh --tag "$RELEASE_TAG" --bin-dir "$RUNNER_TEMP/unsigned" \
            --tarball "$RUNNER_TEMP/unsigned/local-ai-$RELEASE_TAG-src.tar.gz" \
            --pubkey agent/internal/kit/keys/minisign.pub --out "$RUNNER_TEMP/release" --sign
      - name: Create the draft release and check its assets
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          REL: ${{ runner.temp }}/release
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          # PRERELEASE is empty or the single flag --prerelease
          # shellcheck disable=SC2086
          gh release create "$TAG" --draft --verify-tag --generate-notes $PRERELEASE \
            --title "Agent $VERSION" \
            "$REL/aiagent-linux-amd64" "$REL/aiagent-linux-arm64" "$REL/SHA256SUMS" "$REL/SHA256SUMS.minisig" \
            "$REL/install-node.sh" "$REL/local-ai-$TAG-src.tar.gz"
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.draft and .tag_name==\"$TAG\") | .id" | head -n 1)"
          [ -n "$id" ] || { echo "::error::the draft release for $TAG was not found"; exit 1; }
          have="$(gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets" --jq '.[].name' | LC_ALL=C sort | tr '\n' ' ' | sed 's/ $//')"
          want="$(printf '%s\n' aiagent-linux-amd64 aiagent-linux-arm64 SHA256SUMS SHA256SUMS.minisig install-node.sh "local-ai-$TAG-src.tar.gz" | LC_ALL=C sort | tr '\n' ' ' | sed 's/ $//')"
          [ "$have" = "$want" ] || { echo "::error::the draft holds [$have], expected [$want]"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "draft $TAG (release $id) holds the six assets"
      - name: Publish the release (a pre-release when the version has a dash), then verify what was published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          set -euo pipefail
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false --jq '"published " + .tag_name + " prerelease=" + (.prerelease|tostring)'
          # The same check a node does: the committed public key must verify what GitHub now serves. If it does not, pull
          # the release back to a draft so no node takes it.
          if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/published" \
              && scripts/release-sign.sh verify "$RUNNER_TEMP/published" agent/internal/kit/keys/minisign.pub; then
            echo "published and verified: $TAG"
          else
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=true >/dev/null
            echo "::error::the published assets of $TAG do not verify; the release was moved back to a draft. Fix with a new version."
            exit 1
          fi
