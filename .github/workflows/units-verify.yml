name: units-verify
# `systemd-analyze verify` on the generated localai-llama.service files (ROUTER-04, llama-router.md
# sections 3.2 to 3.4), localai-kiwix.service (SVC-02, companion-services.md section 3.3) and the
# localai-whisper.service (SVC-05, companion-services.md section 3.3) and the localai-drill service and timer templates (DRILL-01, drill.md section 3.3) and the localai-agent
# service template (AGENT-20, agent.md section 3.6) and the localai-sync service and timer templates (SYNC-14, ark-sync.md section 3.7). The files
# are the golden files of the unit generators; the agent workflow's go test proves each generator
# renders exactly those bytes. The logic is in scripts/verify-units.sh so
# it runs the same by hand.
on:
  pull_request:
    paths: ['agent/internal/router/unit*.go', 'agent/internal/router/testdata/golden/**', 'agent/internal/svc/kiwix/unit*.go', 'agent/internal/svc/kiwix/testdata/**', 'agent/internal/svc/whisper/unit*.go', 'agent/internal/svc/whisper/testdata/**', 'agent/internal/setup/units/**', 'scripts/verify-units.sh', '.github/workflows/units-verify.yml']
  push:
    branches: [main]
    paths: ['agent/internal/router/unit*.go', 'agent/internal/router/testdata/golden/**', 'agent/internal/svc/kiwix/unit*.go', 'agent/internal/svc/kiwix/testdata/**', 'agent/internal/svc/whisper/unit*.go', 'agent/internal/svc/whisper/testdata/**', 'agent/internal/setup/units/**', 'scripts/verify-units.sh', '.github/workflows/units-verify.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: systemd-analyze version
        run: systemd-analyze --version | head -1
      - name: verify the router, single, drop-in, kiwix, whisper, agent, drill and sync files
        run: scripts/verify-units.sh
