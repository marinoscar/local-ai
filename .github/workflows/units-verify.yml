name: units-verify
# `systemd-analyze verify` on the generated localai-llama.service files (ROUTER-04, llama-router.md
# sections 3.2 to 3.4). The files are the golden files of the unit generator; the agent workflow's
# go test proves the generator renders exactly those bytes. The logic is in scripts/verify-units.sh so
# it runs the same by hand.
on:
  pull_request:
    paths: ['agent/internal/router/unit*.go', 'agent/internal/router/testdata/golden/**', 'scripts/verify-units.sh', '.github/workflows/units-verify.yml']
  push:
    branches: [main]
    paths: ['agent/internal/router/unit*.go', 'agent/internal/router/testdata/golden/**', 'scripts/verify-units.sh', '.github/workflows/units-verify.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: systemd-analyze version
        run: systemd-analyze --version | head -1
      - name: verify the router, single and drop-in files
        run: scripts/verify-units.sh
