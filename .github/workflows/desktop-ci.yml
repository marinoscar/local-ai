name: desktop-ci
# ai-desktop (apps/desktop): typecheck, unit tests, build, then package the deb and AppImage, check the result and run the offline egress e2e against the packaged app
# (docs/specs/desktop.md sections 3 and 4.11). It runs only for changes that can affect the desktop app, so a pull
# request that touches only agent/** does not trigger it. packages/ui is consumed through "file:../../packages/ui",
# which is why the job checks out the whole repository. The release workflow (desktop-release.yml, tags desktop-v*) repeats these steps before it signs anything;
# scripts/tests/test-desktop-release.sh fails if the two drift apart.
on:
  push:
    branches: [main]
    paths: ['apps/desktop/**', 'packages/ui/**', '.github/workflows/desktop-ci.yml']
  pull_request:
    paths: ['apps/desktop/**', 'packages/ui/**', '.github/workflows/desktop-ci.yml']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop:
    name: Typecheck, test, build, package, verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Download the pinned Electron binary (electron 44 has no install hook)
        run: node node_modules/electron/install.js
      - name: Typecheck (main, preload, tests, renderer)
        run: npm run typecheck
      - name: Unit tests (verify self-test on fixture asars, stub imports, assets, project policy)
        run: npm test
      - name: Build (electron-vite, three bundles)
        run: npm run build
      - name: Package (deb and AppImage, x64, nothing is published)
        run: node scripts/dist.mjs --linux --x64
      - name: Verify the packaged app (asar, fuses, no source maps, no node_modules/electron)
        run: node scripts/packaged-app.mjs verify
      - name: End-to-end, the packaged test copy under Xvfb against the fake agent on 127.0.0.1:7070 (egress, start-up, error pages, diagnose, windows and bridges)
        env:
          LOCALAI_E2E_NO_SANDBOX: '1'
          LOCALAI_E2E_EXECUTABLE: release/test-copy/ai-desktop
        run: |
          node scripts/packaged-app.mjs test-copy
          xvfb-run -a -s "-screen 0 1920x1080x24" npx playwright test
      - name: Inspect the deb (depends, AppArmor profile, install paths)
        run: |
          deb=$(ls release/ai-desktop_*_amd64.deb)
          dpkg -I "$deb"
          dpkg-deb -c "$deb" | grep -E ' \./opt/ai-desktop/(ai-desktop|resources/apparmor-profile)$'
          dpkg-deb -c "$deb" | grep -E ' \./usr/share/applications/ai-desktop\.desktop$'
          ls release/ai-desktop-*-x86_64.AppImage
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ai-desktop-packages
          path: |
            apps/desktop/release/*.deb
            apps/desktop/release/*.AppImage
          retention-days: 7
          if-no-files-found: error
