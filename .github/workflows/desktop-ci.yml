name: desktop-ci
# ai-desktop (apps/desktop): typecheck, unit tests, build, then package the deb and AppImage and check the result
# (docs/specs/desktop.md sections 3 and 4.11). It runs only for changes that can affect the desktop app, so a pull
# request that touches only agent/** does not trigger it. packages/ui is consumed through "file:../../packages/ui",
# which is why the job checks out the whole repository. The release workflow (desktop-release.yml) arrives with DSK-12.
on:
  push:
    branches: [main]
    paths: ['apps/desktop/**', 'packages/ui/**', '.github/workflows/desktop-ci.yml']
  pull_request:
    paths: ['apps/desktop/**', 'packages/ui/**', '.github/workflows/desktop-ci.yml']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop:
    name: Typecheck, test, build, package, verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Download the pinned Electron binary (electron 44 has no install hook)
        run: node node_modules/electron/install.js
      - name: Typecheck (main, preload, tests, renderer)
        run: npm run typecheck
      - name: Unit tests (verify self-test on fixture asars, stub imports, assets, project policy)
        run: npm test
      - name: Build (electron-vite, three bundles)
        run: npm run build
      - name: Package (deb and AppImage, x64, nothing is published)
        run: node scripts/dist.mjs --linux --x64
      - name: Verify the packaged app (asar, fuses, no source maps, no node_modules/electron)
        run: node scripts/packaged-app.mjs verify
      - name: Inspect the deb (depends, AppArmor profile, install paths)
        run: |
          deb=$(ls release/ai-desktop_*_amd64.deb)
          dpkg -I "$deb"
          dpkg-deb -c "$deb" | grep -E ' \./opt/ai-desktop/(ai-desktop|resources/apparmor-profile)$'
          dpkg-deb -c "$deb" | grep -E ' \./usr/share/applications/ai-desktop\.desktop$'
          ls release/ai-desktop-*-x86_64.AppImage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-desktop-packages
          path: |
            apps/desktop/release/*.deb
            apps/desktop/release/*.AppImage
          retention-days: 7
          if-no-files-found: error
