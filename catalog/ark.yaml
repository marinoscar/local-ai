# catalog/ark.yaml: the ark content catalog (Kiwix books, offline maps, place names, docs).
# Spec: docs/specs/catalog.md section 3 and 3.1. Rules: `aictl catalog lint catalog/`.
#
# Kiwix items: `book` is the file name without its date (`<name>_<flavour>` of the Kiwix OPDS entry).
# Every book and its directory were checked against the Kiwix OPDS catalog and the download directory
# listing (evidence: the PR description of issue #74). `base_url` is the directory of the book on the
# Kiwix download origin; sync resolves the newest dated file there and its `.sha256` sidecar, so no hash
# is stored in this file. `expected_size_bytes` is the OPDS size rounded up for growth; sync uses the
# real size from the origin.
#
# Order matters: the planner drops later list positions first within a tier (catalog.md section 4), and
# the profiles list items in this order. Kit items (kit-*, rebuild-kit.md section 3.2) follow docs-bundle.
#
# No sha256 is written here except for map-assets: Kiwix items use the origin's sidecar and the place files use computed
# checksums with trust on first use (catalog.md section 3.1). `map-assets` is pinned by tag and sha256 (issue #487).
schema_version: 1
content:

  # ---- Tier 1: in every profile ----

  - id: docs-bundle
    kind: docs
    display_name: "Manuals and runbooks"
    summary: "The printable guides for running, repairing and rebuilding the lab, offline."
    summary_es: "Las guías para operar, reparar y reconstruir el laboratorio, sin internet."
    survival_tier: 1
    source:
      type: repo_docs
    expected_size_bytes: 150000000

  # ---- Rebuild kit (rebuild-kit.md section 3.2). Kit items are always tier 1 (catalog.md section 3). ----
  # kit-agent-binaries carries the release's signed SHA256SUMS and SHA256SUMS.minisig as `release/SHA256SUMS(.minisig)`
  # (`name:` gives a file its path inside the item: the sync engine reserves the plain name SHA256SUMS in an item dir,
  # issue #360). The signed list comes first: an item's version is the first 12 digits of its first file's sha256, so the
  # version names the release the list signs, and a node that synced the item before the list was added fetches it again.
  # Not here yet: kit-desktop needs a published desktop release to pin (E8); kit-cuda-redist is off by default.
  # kit-agent-binaries and kit-agent-source pin the pre-release node-v0.1.0-rc.1. Pins below were computed from
  # the downloaded release files (decision #251); nothing is copied from a mirror's listing unchecked.

