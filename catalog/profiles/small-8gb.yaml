schema_version: 1
id: small-8gb
display_name: "Small GPU laptop (8 GB VRAM)"
match:
  backends: [cuda]
  vram_mib: {min: 7000, max: 11999}
  ram_mib: {min: 12000}
router:
  models_max: 1
  memory_margin_mib: 512
  autoload: false
storage:
  target: internal
  budget_bytes: 220000000000
  min_free_bytes: 25000000000
include:
  models: [qwen3.5-9b-q4km, whisper-small, piper-en-medium, piper-es-medium]
  content:
    # tier 1
    - docs-bundle
    - wikimed-en
    - survival-first-aid
    - survival-water
    - survival-food
    - survival-post-disaster
    - ifixit-en
    - osm-central-america
    - places-central-america
    - wikipedia-en-nopic
    - wikipedia-es-nopic
    # tier 2
    - wikimed-es
    - mdwiki-en
    - stackexchange-diy
    - stackexchange-electronics
    - stackexchange-cooking
    - stackexchange-gardening
    - stackexchange-outdoors
    - stackexchange-ham
    - wikibooks-en
    - wikivoyage-en
    - wikivoyage-es
    - stackexchange-superuser
    - stackexchange-askubuntu
    - stackexchange-unix
    - gutenberg-en-technology
    - gutenberg-en-agriculture
    - gutenberg-en-medicine
    - libretexts-en-medicine
    - libretexts-en-engineering
    - libretexts-en-biology
    - libretexts-en-chemistry
    - energypedia-en
default_model: qwen3.5-9b-q4km
survival:
  models: [qwen3.5-9b-q4km]
  default_model: qwen3.5-9b-q4km
  require_services: [kiwix, whisper]
  portal_language: auto
