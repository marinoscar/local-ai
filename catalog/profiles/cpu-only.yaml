schema_version: 1
id: cpu-only
display_name: "Any machine without a usable GPU"
match:
  backends: [cpu]
router:
  models_max: 1
  memory_margin_mib: 512
  autoload: false
storage:
  target: internal
  budget_bytes: 120000000000
  min_free_bytes: 15000000000
include:
  models: [qwen3.5-9b-q4km, whisper-small, piper-en-medium, piper-es-medium, qwen3.5-4b-q4km, embeddinggemma-300m-q8]
  content:
    # tier 1
    - docs-bundle
    - kit-catalog
    - kit-llama-cpp
    - kit-whisper-cpp
    - kit-agent-binaries
    - kit-agent-source
    - kit-desktop
    - kit-go-toolchain
    - kit-kiwix-tools
    - kit-pmtiles
    - kit-piper
    - kit-debs-resolute-amd64
    - wikimed-en
    - survival-first-aid
    - survival-water
    - survival-food
    - survival-post-disaster
    - ifixit-en
    - osm-central-america
    - map-assets
    - places-central-america
    - wikipedia-en-nopic
    - wikipedia-es-nopic
    # tier 2
    - wikimed-es
    - stackexchange-diy
    - stackexchange-cooking
    - stackexchange-gardening
    - stackexchange-outdoors
    - stackexchange-ham
    - wikivoyage-en
    - wikivoyage-es
default_model: qwen3.5-9b-q4km
survival:
  models: [qwen3.5-9b-q4km]
  default_model: qwen3.5-9b-q4km
  require_services: [kiwix]
  portal_language: auto
