schema_version: 1
id: cuda-12gb
display_name: "CUDA workstation (12 to 24 GB VRAM)"
match:
  backends: [cuda]
  vram_mib: {min: 12000, max: 24999}
  ram_mib: {min: 12000}
router:
  models_max: 2
  memory_margin_mib: 768
  autoload: false
storage:
  target: internal
  budget_bytes: 500000000000
  min_free_bytes: 40000000000
include:
  models: [qwen3.5-9b-q4km, qwen3.6-35b-a3b-q4km, whisper-medium, piper-en-medium, piper-es-medium, qwen3.5-4b-q4km, embeddinggemma-300m-q8]
  content:
    # tier 1
    - docs-bundle
    - kit-catalog
    - kit-llama-cpp
    - kit-whisper-cpp
    - kit-agent-binaries
    - kit-agent-source
    - kit-go-toolchain
    - kit-kiwix-tools
    - kit-pmtiles
    - kit-piper
    - kit-debs-resolute-amd64
    - kit-nvidia-resolute-amd64-595-open
    - wikimed-en
    - survival-first-aid
    - survival-water
    - survival-food
    - survival-post-disaster
    - ifixit-en
    - osm-central-america
    - places-central-america
    - wikipedia-es-nopic
    - wikipedia-en-maxi
    # tier 2
    - wikimed-es
    - mdwiki-en
    - stackexchange-diy
    - stackexchange-electronics
    - stackexchange-cooking
    - stackexchange-gardening
    - stackexchange-outdoors
    - stackexchange-ham
    - wikibooks-en
    - wikivoyage-en
    - wikivoyage-es
    - stackexchange-superuser
    - stackexchange-askubuntu
    - stackexchange-unix
    - gutenberg-en-technology
    - gutenberg-en-agriculture
    - gutenberg-en-medicine
    - libretexts-en-medicine
    - libretexts-en-engineering
    - libretexts-en-biology
    - libretexts-en-chemistry
    - energypedia-en
default_model: qwen3.5-9b-q4km
survival:
  models: [qwen3.5-9b-q4km]
  default_model: qwen3.5-9b-q4km
  require_services: [kiwix, whisper]
  portal_language: auto
