schema_version: 1
id: max-128gb
display_name: "Large unified-memory node (128 GB)"
match:
  backends: [vulkan]
  vram_mib: {min: 49152}   # 48 GiB: a unified-memory node is matched on its GTT (ai-n1 reports 62061 MiB)
  ram_mib: {min: 65536}
router:
  models_max: 3
  memory_margin_mib: 1024
  autoload: false
storage:
  target: internal
  budget_bytes: 900000000000
  min_free_bytes: 100000000000
include:
  # qwen3.8-27b-q4km is left out until it is measured with aictl bench (catalog.md section 2).
  models: [qwen3-coder-next-q4km, qwen3.6-35b-a3b-q4km, whisper-large-v3-turbo, piper-en-medium, piper-es-medium, qwen3.5-4b-q4km, embeddinggemma-300m-q8]
  content:
    # tier 1
    - docs-bundle
    - kit-catalog
    - kit-llama-cpp
    - kit-whisper-cpp
    - kit-agent-binaries
    - kit-agent-source
    - kit-go-toolchain
    - kit-kiwix-tools
    - kit-pmtiles
    - kit-piper
    - kit-debs-resolute-amd64
    - wikimed-en
    - survival-first-aid
    - survival-water
    - survival-food
    - survival-post-disaster
    - ifixit-en
    - osm-central-america
    - map-assets
    - places-central-america
    - wikipedia-es-nopic
    - wikipedia-en-maxi
    # tier 2
    - wikimed-es
    - mdwiki-en
    - stackexchange-diy
    - stackexchange-electronics
    - stackexchange-cooking
    - stackexchange-gardening
    - stackexchange-outdoors
    - stackexchange-ham
    - wikibooks-en
    - wikivoyage-en
    - wikivoyage-es
    - stackexchange-superuser
    - stackexchange-askubuntu
    - stackexchange-unix
    - gutenberg-en-technology
    - gutenberg-en-agriculture
    - gutenberg-en-medicine
    - libretexts-en-medicine
    - libretexts-en-engineering
    - libretexts-en-biology
    - libretexts-en-chemistry
    - energypedia-en
    # tier 3
    - wiktionary-en
    - wiktionary-es
    - ted-natural-disaster
    - ted-water
    - ted-medicine
    - gutenberg-es-all
default_model: qwen3-coder-next-q4km
survival:
  models: [qwen3.6-35b-a3b-q4km]
  default_model: qwen3.6-35b-a3b-q4km
  require_services: [kiwix, whisper]
  portal_language: auto
# Named model sets a person switches between with one action (catalog.md section 4, "Workloads").
workloads:
  coding:
    label: {en: "Coding", es: "Programación"}
    models: [qwen3-coder-next-q4km, embeddinggemma-300m-q8]
  chat:
    label: {en: "Chat", es: "Conversación"}
    models: [qwen3.6-35b-a3b-q4km, qwen3.5-4b-q4km]
  speech:
    label: {en: "Speech", es: "Voz"}
    models: [qwen3.5-4b-q4km]
