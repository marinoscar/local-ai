title = "local-ai gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "localai-token"
description = "Local AI / EAB tokens (lat_, nod_, lai_, pat_)"
regex = '''\b(lat|nod|lai|pat)_[A-Za-z0-9_-]{20,}'''

[[rules]]
id = "tailnet-ip"
description = "Tailscale CGNAT address"
regex = '''\b100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}\b'''

[[rules]]
id = "tailnet-name"
description = "Tailnet name"
regex = '''\btail[0-9a-f]{6}\b'''

[[rules]]
id = "route53-zone"
description = "Route53 hosted zone id"
regex = '''\bZ0[0-9A-Z]{10,}\b'''

# The redaction self-test fixtures contain deliberately fake, forbidden-looking values.
# scripts/check-redaction.sh --file proves they are caught; gitleaks must not fail on them.
[allowlist]
description = "redaction test fixtures and one invented placeholder claim token"
paths = ['''scripts/tests/redaction/.*''']
# One invented placeholder claim token shared by the cloud command-plane fixtures and their specs
# (apps/cloud/apps/api/test/fixtures/localai/*.json and the localai specs). It is a UUID with no
# meaning; the wire contract requires a UUID there, so a shared JSON fixture cannot generate it.
# Exact value only: any other high-entropy value in those files is still a finding.
regexes = ['''1f0e8b7a-3c2d-4e9f-8a6b-5d4c3b2a1f0e''']
