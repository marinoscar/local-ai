<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Local AI banner</title>
<!-- Source of banner.png (README). Rendered offline by agent/ui/scripts/render-brand.mjs, which injects the
     bundled Atkinson Hyperlegible font; nothing here is fetched from the network. -->
<style>
  html,body{margin:0}
  body{width:1280px;height:400px;overflow:hidden;background:#07070A;font-family:"Atkinson Hyperlegible",system-ui,sans-serif;color:#F5EFE3}
  .wrap{position:relative;width:1280px;height:400px;background:radial-gradient(700px 420px at 82% 50%,rgba(242,181,68,.16),transparent 62%),radial-gradient(1px 1px at 8% 20%,#ffffff66,transparent),radial-gradient(1px 1px at 22% 78%,#ffffff44,transparent),radial-gradient(1.5px 1.5px at 46% 14%,#ffffff55,transparent),radial-gradient(1px 1px at 58% 86%,#ffffff33,transparent),#07070A}
  .eclipse{position:absolute;right:120px;top:50%;width:330px;height:330px;transform:translateY(-50%)}
  .text{position:absolute;left:88px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:18px}
  .name{font-size:84px;font-weight:700;letter-spacing:-0.01em;line-height:1}
  .name span{color:#F2B544}
  .tag{font-size:28px;color:#D8D1E2;max-width:640px;line-height:1.3}
  .chips{display:flex;gap:12px;margin-top:6px}
  .chip{font-size:18px;font-weight:700;padding:8px 16px;border-radius:999px;border:1px solid #3A3644;color:#E9E2D4;background:#111015}
</style>
</head>
<body>
<div class="wrap">
  <div class="text">
    <div class="name">Local <span>AI</span></div>
    <div class="tag">Private AI, a library, maps and voice that keep working when the internet is gone.</div>
    <div class="chips"><span class="chip">Offline first</span><span class="chip">Survival mode</span><span class="chip">English · Español</span></div>
  </div>
  <svg class="eclipse" viewBox="0 0 512 512" aria-hidden="true">
    <defs>
      <radialGradient id="corona" cx="50%" cy="50%" r="50%">
        <stop offset="46%" stop-color="#FFE7A8" stop-opacity="0"/>
        <stop offset="50%" stop-color="#FFF4D6"/>
        <stop offset="60%" stop-color="#F2B544" stop-opacity="0.8"/>
        <stop offset="100%" stop-color="#F2B544" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <g stroke="#F2B544" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round">
      <path d="M256 18v70M256 424v70M18 256h70M424 256h70M88 88l48 48M376 376l48 48M424 88l-48 48M136 376l-48 48"/>
    </g>
    <circle cx="256" cy="256" r="230" fill="url(#corona)"/>
    <circle cx="256" cy="256" r="112" fill="#050505"/>
  </svg>
</div>
</body>
</html>
