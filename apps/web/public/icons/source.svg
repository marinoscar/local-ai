<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Local AI">
  <!-- Corona, the total solar eclipse of ADR-0014, copied from packages/ui/brand/icon.svg (the cloud web is built from apps/cloud only).
       The plate is a solid fill of identity.json themeColor so scripts/rename.mjs still finds its anchor; the warm glow is an overlay. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#1A1408"/>
      <stop offset="100%" stop-color="#1A1408" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="corona" cx="50%" cy="50%" r="50%">
      <stop offset="48%" stop-color="#FFE7A8" stop-opacity="0"/>
      <stop offset="52%" stop-color="#FFF4D6"/>
      <stop offset="62%" stop-color="#F2B544" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#F2B544" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="115" fill="#07070a"/>
  <rect width="512" height="512" rx="115" style="fill:url(#glow)"/>
  <g stroke="#F2B544" stroke-opacity="0.45" stroke-width="6" stroke-linecap="round">
    <path d="M256 51v55M256 406v55M51 256h55M406 256h55M111 111l38 38M363 363l38 38M401 111l-38 38M149 363l-38 38"/>
  </g>
  <circle cx="256" cy="256" r="179" style="fill:url(#corona)"/>
  <circle cx="256" cy="256" r="94" style="fill:#050505"/>
</svg>
