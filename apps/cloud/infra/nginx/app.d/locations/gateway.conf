# =============================================================================
# OpenAI-compatible gateway (APP-OWNED; docs/specs/gateway.md section 3.1)
# =============================================================================
# /v1/x is served by the API at /api/gateway/v1/x (raw Fastify routes), unbuffered
# so a streamed completion reaches the client token by token. The edge vhost on a
# VPS needs the same path declared to the CLI (apps/cli/src/app.ts, proxy.streamPaths).
# Included BEFORE `location /api` by nginx.conf.

# `/v1` without the slash answers a relative redirect (no scheme or host guess behind the TLS edge).
location = /v1 {
    absolute_redirect off;
    return 301 /v1/;
}

location /v1/ {
    proxy_pass http://api_upstream/api/gateway/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering on;
    chunked_transfer_encoding off;
    proxy_connect_timeout 10s;
    proxy_send_timeout 1800s;
    proxy_read_timeout 1800s;
    client_max_body_size 26m;
    # A body over 26 MiB never reaches the API: answer it in the gateway's own JSON shape (LAI-GW-004).
    error_page 413 @gateway_request_too_large;
    include /etc/nginx/platform/security-headers.conf;
}

location @gateway_request_too_large {
    default_type application/json;
    include /etc/nginx/platform/security-headers.conf;
    add_header X-Request-ID $request_id always;
    return 413 '{"error":{"message":"The request is too large. Send smaller images or audio (limit 8 MB of JSON, 25 MB of audio).","type":"invalid_request_error","param":null,"code":"request_too_large","localai_code":"LAI-GW-004","request_id":"$request_id"}}';
}
