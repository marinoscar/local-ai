# =============================================================================
# App compose overlay (scope vps): the cloud does not run the platform's stack agent (APP-OWNED, #450)
# =============================================================================
# vps.compose.yml (generated by @marinoscar/platform-infra) adds `stack-agent`, the one container that holds the
# Docker socket, so the platform admin UI can redeploy the telemetry containers. It is built from
# apps/stack-agent/Dockerfile, an app of the EnterpriseAppBase starter that apps/cloud does not have, so without
# this overlay `laictl deploy install` stops at "Build images" (lstat apps/stack-agent: no such file or directory).
#
# The cloud does not take that trade-off: the Docker socket is root-equivalent on the host, and `laictl deploy
# update` redeploys the telemetry containers. Not to be confused with the cloud's own VPS stack-agent
# (docs/specs/cloud-app.md section 4.10), which is `laictl node start` under systemd, not a container.
#
# This is the opt-out the platform supports (EnterpriseAppBase #714): a service in the `disabled` profile is never
# built or started (nothing selects that profile) and is left out of `docker compose config`. The API still requires
# STACK_AGENT_TOKEN (`${STACK_AGENT_TOKEN:?...}` in vps.compose.yml); the deploy CLI generates it on install and
# update, so it is set although nothing listens for it.
# =============================================================================
services:
  stack-agent:
    profiles: ["disabled"]
